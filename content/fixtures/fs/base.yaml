  - path: /home/ops/net/asymmetric.txt
    content: |
      # The office has two firewalls. Connections go out through fw-a and come back through fw-b.
      # Both firewalls only allow replies to connections they have seen start.
      $ tcpdump on fw-a   10.40.30.21 > 196.41.0.20: SYN
      $ tcpdump on fw-b   196.41.0.20 > 10.40.30.21: SYN-ACK   (dropped: no such connection)
    mode: 420
