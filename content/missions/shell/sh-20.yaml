lesson:
  text: awk runs its { } block on every line, and END { } runs once at the very end. Put a condition before a block to run it only on matching lines. Keep a sum and a count, then divide in END. printf "%.0f" rounds.
  example: awk '$1=="cat"{s+=$2;n++} END{printf "%.0f\n", s/n}' pets.txt
brief: What is the average ms for /v1/orders in ~/logs/api-access.log, rounded to a whole number? Path is field 4 and ms is field 6.
goal: "Run: submit <ms>"
hints:
  - Filter with $4=="/v1/orders".
  - printf "%.0f" rounds. Track sum and count.
debrief:
  why: Pattern plus action lets awk filter and aggregate in the same step, with no grep needed.
  solution: awk '$4=="/v1/orders"{s+=$6;n++} END{printf "%.0f\n", s/n}' ~/logs/api-access.log
  job: Latency per endpoint is the basis of every SLO.
