title: Delete and print lines
from: SRE
difficulty: hard
check: fs
par:
  kind: commands
  value: 1
lesson:
  text: sed /pattern/d deletes matching lines. ^ means line start and $ means line end, so ^$ is a blank line. Separate commands with ; and use sed -n '5p' to print only line 5.
  example: |-
    sed '/^;/d; /^$/d' settings.ini
    sed -n '5p' notes.txt
brief: Reviewers only want live settings from ~/conf/nginx-comments.conf.
goal: Write it to ~/conf/nginx-clean.conf without comment lines or blank lines.
hints:
  - /^#/d deletes comment lines.
  - /^$/d deletes blank lines. Separate with ;
debrief:
  why: ^ and $ anchor to the start and end of a line, so ^$ means an empty line.
  solution: sed '/^#/d; /^$/d' ~/conf/nginx-comments.conf > ~/conf/nginx-clean.conf
  job: Comparing real settings between servers starts here.
teaches:
  - /d
  - ^
  - $
expect:
  - file_equals:
      path: ~/conf/nginx-clean.conf
      content: |
        worker_processes 4;
        keepalive_timeout 65;
        gzip on;
