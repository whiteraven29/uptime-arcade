id: sh-30
track: SH
skill: shell
chapter: Scripting
order: 30
title: "Capstone: the report script"
from: SRE
difficulty: expert
check: fs
par:
  kind: commands
  value: 5
lesson:
  text: "A script is a file of commands. The first line, #!/bin/bash, says which program runs it. $1 is the first word you pass in. Make it runnable with chmod +x, then run it by its path."
  example: |-
    echo '#!/bin/bash' > hi.sh
    echo 'echo "hello $1"' >> hi.sh
    chmod +x hi.sh
    ./hi.sh amina
brief: Anything you type twice should be a script. Build ~/bin/report.sh, which counts the lines in ~/logs/app.log that contain whatever word you pass it.
goal: "Create the script, make it executable, then run: ~/bin/report.sh ERROR"
hints:
  - mkdir -p ~/bin, then build the file with echo ... > and echo ... >>. Use single quotes so $1 stays literal.
  - 'The command inside is: grep -c "$1" ~/logs/app.log'
debrief:
  why: A script is a saved pipeline with a parameter. Once it exists, anyone can run it and get the same answer.
  solution: |-
    mkdir -p ~/bin
    echo '#!/bin/bash' > ~/bin/report.sh
    echo 'grep -c "$1" ~/logs/app.log' >> ~/bin/report.sh
    chmod +x ~/bin/report.sh
    ~/bin/report.sh ERROR
  job: Nearly all automation starts as a script somebody got tired of retyping.
teaches:
  - "#!"
  - $1
expect:
  - file_exists: ~/bin/report.sh
  - mode_has:
      path: ~/bin/report.sh
      bit: x
  - file_contains:
      path: ~/bin/report.sh
      text: $1
  - script_ran: ~/bin/report.sh
rewind:
  - type: mc
    level: easy
    label: The main idea
    q: 'You just finished "Capstone: the report script". Which sentence best describes what it taught?'
    options:
      - while read handles a file one line at a time, and it's safer than for when lines contain spaces.
      - ^ and $ anchor to the start and end of a line, so ^$ means an empty line.
      - A script is a saved pipeline with a parameter. Once it exists, anyone can run it and get the same answer.
      - sed applies a substitution to every line. Writing to a new file keeps the original for a safe rollback.
    answer: A script is a saved pipeline with a parameter. Once it exists, anyone can run it and get the same answer.
    hint: "Look for the sentence about #! and $1."
