lesson:
  text: "grep -E turns on extended patterns: a|b means a or b, + means one or more, ? means optional, [0-9] means any digit, and parentheses group choices."
  example: |-
    grep -E 'cat|dog' pets.txt
    grep -E '^[0-9]+$' numbers.txt
brief: How many lines in ~/logs/app.log are ERROR or FATAL?
goal: "Run: submit <count>"
