    level: easy
    label: The main idea
    q: You just finished "Clean up characters". Which sentence best describes what it taught?
    options:
      - Windows ends lines with CR LF. A hidden \r at the end of a line breaks shell scripts in confusing ways.
      - Pattern plus action lets awk filter and aggregate in the same step, with no grep needed.
      - sed applies a substitution to every line. Writing to a new file keeps the original for a safe rollback.
      - Capture groups rearrange text without knowing the values.
    answer: Windows ends lines with CR LF. A hidden \r at the end of a line breaks shell scripts in confusing ways.
    hint: Look for the sentence about tr and -d.
  - type: mc
    level: easy
    label: Spot the solution
    q: Which command solved it?
    context: ~/conf/windows.txt came from a Windows PC and each line ends in \r, which breaks scripts.
    options:
      - tr -d '\r' < ~/conf/windows.txt > ~/conf/unix.txt
      - sed -E 's#([0-9]{2})/([0-9]{2})/([0-9]{4})#\3-\2-\1#' ~/data/customers.csv > ~/data/customers-clean.csv
      - sed 's/old-host\.example/whiteraven.example/' ~/conf/endpoints.conf > ~/conf/endpoints-new.conf
      - awk '$4=="/v1/orders"{s+=$6;n++} END{printf "%.0f\n", s/n}' ~/logs/api-access.log
    answer: tr -d '\r' < ~/conf/windows.txt > ~/conf/unix.txt
    hint: tr reads stdin, so use < or a pipe.
    code: true
