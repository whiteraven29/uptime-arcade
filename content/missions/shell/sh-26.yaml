id: sh-26
track: SH
skill: shell
chapter: Patterns
order: 26
title: Clean up characters
from: Support
difficulty: hard
check: fs
par:
  kind: commands
  value: 1
lesson:
  text: tr swaps or deletes single characters, and -d deletes them. It only reads standard input, so feed it a file with <.
  example: tr -d ',' < numbers.txt > clean.txt
brief: ~/conf/windows.txt came from a Windows PC and each line ends in \r, which breaks scripts.
goal: Write ~/conf/unix.txt with the carriage returns removed.
hints:
  - tr -d removes characters.
  - tr reads stdin, so use < or a pipe.
debrief:
  why: Windows ends lines with CR LF. A hidden \r at the end of a line breaks shell scripts in confusing ways.
  solution: tr -d '\r' < ~/conf/windows.txt > ~/conf/unix.txt
  job: A script that 'looks fine' but fails is often this.
teaches:
  - tr
  - -d
  - <
expect:
  - file_equals:
      path: ~/conf/unix.txt
      content: |
        alpha
        bravo
        charlie
