title: Read line by line
from: SRE
difficulty: expert
check: fs
par:
  kind: commands
  value: 1
lesson:
  text: "while read takes a file one line at a time into a variable, and redirecting after done saves all the output. Every command also returns an exit code: a && b runs b only if a worked, and a || b runs b only if a failed."
  example: |-
    while read n; do echo "hello $n"; done < names.txt > out.txt
    mkdir logs && echo made || echo failed
brief: For each host in ~/data/hosts.txt, write a line like check srv-01 to ~/data/checks.txt.
goal: Use a while read loop with one command line.
hints:
  - while read h; do echo "check $h"; done < file
  - Redirect after done with > to collect all the output.
debrief:
  why: while read handles a file one line at a time, and it's safer than for when lines contain spaces.
  solution: while read h; do echo "check $h"; done < ~/data/hosts.txt > ~/data/checks.txt
  job: Looping over host lists is everyday fleet work.
teaches:
  - while
  - read
  - "&&"
  - "||"
