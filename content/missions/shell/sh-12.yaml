rewind:
  - type: mc
    level: easy
    label: The main idea
    q: You just finished "Save the output". Which sentence best describes what it taught?
    options:
      - The shell splits on spaces, and programs read a leading dash as an option. Quoting and a path prefix fix both. Dotfiles are only hidden from plain ls.
      - mkdir -p creates the whole chain and doesn't complain if a folder is already there, so it's safe to run twice.
      - Each command does one small job, and the pipe joins them. grep picks the lines, head keeps the first.
      - "> starts the file again every time, while >> adds to it. Mixing them up is the classic way to lose a report."
    answer: "> starts the file again every time, while >> adds to it. Mixing them up is the classic way to lose a report."
    hint: Look for the sentence about > and >>.
  - type: mc
    level: easy
    label: Spot the solution
    q: Which command solved it?
    context: The incident channel wants the FATAL lines from ~/logs/app.log in a file, with the total count on the last line.
    options:
      - cat ~/inbox/'week 44'/.rota
      - grep -c FATAL ~/logs/app.log >> ~/incident.txt
      - grep FATAL ~/logs/app.log | head -1
      - touch ~/work/today/notes.txt
    answer: grep -c FATAL ~/logs/app.log >> ~/incident.txt
    hint: grep -c with >> adds the count without wiping the file.
    code: true
  - type: mc
    level: medium
    label: Why it matters
    q: Where would you use what "Save the output" taught you at work?
    options:
      - Almost every useful one-liner has a pipe in it.
      - Setup scripts use mkdir -p because it can be run again safely.
      - Backups and uploads produce names like this all the time.
      - Evidence saved to a file survives after your terminal scrolls away.
    answer: Evidence saved to a file survives after your terminal scrolls away.
    hint: "It starts with: Evidence saved to a…"
