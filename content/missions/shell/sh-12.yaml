id: sh-12
track: SH
skill: shell
chapter: Pipes
order: 12
title: Save the output
from: SRE
difficulty: medium
check: fs
par:
  kind: commands
  value: 2
lesson:
  text: "> writes output to a file, replacing what was there. >> adds to the end instead. 2>/dev/null throws error messages away."
  example: |-
    grep cat pets.txt > cats.txt
    grep -c cat pets.txt >> cats.txt
    ls missing 2>/dev/null
brief: The incident channel wants the FATAL lines from ~/logs/app.log in a file, with the total count on the last line.
goal: Write the lines to ~/incident.txt, then add the count to the end of it.
hints:
  - Use > for the lines.
  - grep -c with >> adds the count without wiping the file.
debrief:
  why: "> starts the file again every time, while >> adds to it. Mixing them up is the classic way to lose a report."
  solution: |-
    grep FATAL ~/logs/app.log > ~/incident.txt
    grep -c FATAL ~/logs/app.log >> ~/incident.txt
  job: Evidence saved to a file survives after your terminal scrolls away.
teaches:
  - ">"
  - ">>"
expect:
  - file_equals:
      path: ~/incident.txt
      content: |
        2026-10-14 06:00:33 FATAL payments retrying order=1120
