    q: "Without looking back: type one of the commands you used."
    context: Clear ~/desk/old.log and the whole ~/desk/tmp folder. keep.txt must survive. If you delete it by mistake, press Leave and reopen this mission to restore the files.
    answer:
      - rm ~/desk/old.log
