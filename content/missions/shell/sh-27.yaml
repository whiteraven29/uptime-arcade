    level: easy
    label: The main idea
    q: You just finished "Variables and quoting". Which sentence best describes what it taught?
    options:
      - sed applies a substitution to every line. Writing to a new file keeps the original for a safe rollback.
      - ^ and $ anchor to the start and end of a line, so ^$ means an empty line.
      - $( ) turns a command's output into a value you can reuse, which is the step from one-liners to scripts.
      - awk splits on whitespace for you, so column work needs no delimiter flags.
    answer: $( ) turns a command's output into a value you can reuse, which is the step from one-liners to scripts.
