par:
  kind: commands
  value: 2
lesson:
  text: NAME=value sets a variable, with no spaces around the =. $NAME reads it back, and $(command) captures what a command printed. Double quotes keep the value as one piece and still expand it. Single quotes keep everything literal.
  example: |-
    N=$(wc -l < notes.txt)
    echo "Notes: $N"
brief: Store the number of 500 errors in ~/logs/api-access.log in a variable, then print it in a sentence.
goal: "Run: submit <the count>"
hints:
  - Put spaces around 500 in grep so it can't match a byte count.
  - E=$(grep -c ' 500 ' ~/logs/api-access.log)
debrief:
  why: $( ) turns a command's output into a value you can reuse, which is the step from one-liners to scripts.
  solution: |-
    E=$(grep -c ' 500 ' ~/logs/api-access.log)
    echo "Count: $E"
  job: Scripts capture values like this all the time, to alert when a count is too high.
teaches:
  - $(
  - echo
  - "="
answer:
  accept:
    - "66"
