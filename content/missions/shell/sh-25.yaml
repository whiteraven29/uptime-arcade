id: sh-25
track: SH
skill: shell
chapter: Patterns
order: 25
title: Rearrange with groups
from: Data
difficulty: hard
check: fs
par:
  kind: commands
  value: 1
lesson:
  text: "sed -E lets you capture parts with ( ) and reuse them as \\1, \\2. Any character can be the delimiter, such as #, which helps when the text contains /."
  example: sed -E 's#(\w+)/(\w+)#\2/\1#' pairs.txt
brief: The warehouse needs YYYY-MM-DD, but the signup column in ~/data/customers.csv is DD/MM/YYYY.
goal: Write ~/data/customers-clean.csv with one sed command and keep the header.
hints:
  - sed -E gives you (groups).
  - "Rebuild as \\3-\\2-\\1. Use # as the delimiter so / needs no escaping."
debrief:
  why: Capture groups rearrange text without knowing the values.
  solution: sed -E 's#([0-9]{2})/([0-9]{2})/([0-9]{4})#\3-\2-\1#' ~/data/customers.csv > ~/data/customers-clean.csv
  job: Cleaning exports before import is routine data work.
teaches:
  - \1
