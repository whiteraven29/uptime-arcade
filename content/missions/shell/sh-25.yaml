rewind:
  - type: mc
    level: easy
    label: The main idea
    q: You just finished "Rearrange with groups". Which sentence best describes what it taught?
    options:
      - find picks the files and -exec acts on them, so a cleanup covers a whole tree in one line. Previewing first is what keeps it safe.
      - ^ and $ anchor to the start and end of a line, so ^$ means an empty line.
      - Capture groups rearrange text without knowing the values.
      - Associative arrays group by any key, which is a GROUP BY in one line.
    answer: Capture groups rearrange text without knowing the values.
    hint: Look for the sentence about \1.
  - type: mc
    level: easy
    label: Spot the solution
    q: Which command solved it?
    context: The warehouse needs YYYY-MM-DD, but the signup column in ~/data/customers.csv is DD/MM/YYYY.
    options:
      - sed -E 's#([0-9]{2})/([0-9]{2})/([0-9]{4})#\3-\2-\1#' ~/data/customers.csv > ~/data/customers-clean.csv
      - awk -F, 'NR>1{s[$3]+=$5} END{for(k in s)print s[k],k}' ~/data/customers.csv | sort -rn | head -1
      - sed '/^#/d; /^$/d' ~/conf/nginx-comments.conf > ~/conf/nginx-clean.conf
      - find ~/build -name '*.tmp' -exec rm {} ;
    answer: sed -E 's#([0-9]{2})/([0-9]{2})/([0-9]{4})#\3-\2-\1#' ~/data/customers.csv > ~/data/customers-clean.csv
    hint: "Rebuild as \\3-\\2-\\1. Use # as the delimiter so / needs no escaping."
    code: true
  - type: mc
    level: medium
    label: Why it matters
    q: Where would you use what "Rearrange with groups" taught you at work?
    options:
      - Scoped cleanups stop disks filling up.
      - Cleaning exports before import is routine data work.
      - Comparing real settings between servers starts here.
      - Quick revenue cuts save waiting for a dashboard.
    answer: Cleaning exports before import is routine data work.
    hint: "It starts with: Cleaning exports before import…"
