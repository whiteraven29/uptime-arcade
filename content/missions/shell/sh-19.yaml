lesson:
  text: awk splits each line into fields called $1, $2 and so on, on whitespace by default. It saves the fiddling with cut.
  example: awk '{print $3}' people.txt
brief: One client sends far more requests than anyone else in ~/logs/api-access.log. Find its IP.
goal: "Run: submit <ip>"
hints:
  - awk '{print $2}' prints the IP column.
  - Then count with sort and uniq -c.
debrief:
  why: awk splits on whitespace for you, so column work needs no delimiter flags.
  solution: awk '{print $2}' ~/logs/api-access.log | sort | uniq -c | sort -rn | head -1
  job: Finding a chatty client is step one for capacity and rate limit work.
