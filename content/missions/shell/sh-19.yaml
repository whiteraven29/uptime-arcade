  - type: mc
    level: easy
    label: The main idea
    q: You just finished "Fields with awk". Which sentence best describes what it taught?
    options:
      - tail and cut together pull a single value out of a structured line.
      - awk splits on whitespace for you, so column work needs no delimiter flags.
      - find picks the files and -exec acts on them, so a cleanup covers a whole tree in one line. Previewing first is what keeps it safe.
      - "> starts the file again every time, while >> adds to it. Mixing them up is the classic way to lose a report."
    answer: awk splits on whitespace for you, so column work needs no delimiter flags.
    hint: Look for the sentence about awk and print.
