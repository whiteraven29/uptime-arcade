    level: easy
    label: Spot the solution
    q: Which command solved it?
    context: One client sends far more requests than anyone else in ~/logs/api-access.log. Find its IP.
    options:
      - find ~/build -name '*.tmp' -exec rm {} ;
      - tail -1 ~/logs/api-access.log | cut -d' ' -f4
      - awk '{print $2}' ~/logs/api-access.log | sort | uniq -c | sort -rn | head -1
      - grep -c FATAL ~/logs/app.log >> ~/incident.txt
    answer: awk '{print $2}' ~/logs/api-access.log | sort | uniq -c | sort -rn | head -1
