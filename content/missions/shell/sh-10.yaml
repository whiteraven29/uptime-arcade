title: Ignore the health checks
from: SRE
difficulty: easy
check: answer
par:
  kind: commands
  value: 1
lesson:
  text: grep -c prints how many lines matched instead of the lines. grep -v flips it, keeping the lines that do NOT match. Flags can be joined, as in -vc.
  example: |-
    grep -c 'timeout' server.log
    grep -v 'DEBUG' server.log
brief: Load balancer checks are noise. How many requests in ~/logs/api-access.log are NOT for /health?
goal: "Run: submit <count>"
hints:
  - grep -v inverts the match.
  - Add -c to count.
debrief:
  why: Removing known noise first is how you make logs readable.
  solution: grep -vc '/health' ~/logs/api-access.log
  job: Filtering health checks is standard in every log query.
teaches:
  - -v
  - -c
answer:
  accept:
    - "1300"
