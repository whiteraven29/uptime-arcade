lesson:
  text: grep prints the lines that contain a pattern. -i ignores upper and lower case, and -n shows each line number.
  example: |-
    grep timeout server.log
    grep -in 'error' server.log
brief: Which line of ~/conf/nginx-comments.conf turns on gzip? Someone may have typed it in capitals, so ignore case.
goal: "Run: submit <line number>"
hints:
  - grep -i ignores case.
  - Add -n, as in grep -in. The number before the colon is the line.
debrief:
  why: grep is the search box of the command line. -n tells you where to go and -i stops capitals hiding a match.
  solution: grep -in gzip ~/conf/nginx-comments.conf
  job: You will run grep more than any other command.
teaches:
  - grep
  - -i
  - -n
answer:
  accept:
    - "7"
