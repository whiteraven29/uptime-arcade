    q: You just finished "The top-N counter". Which sentence best describes what it taught?
    options:
      - sort | uniq -c | sort -rn is the most useful shell idiom you'll learn. uniq only collapses neighbours, so sort first.
      - Text sort compares character by character. Numeric sort is what you want for sizes and durations.
      - rm is permanent, so name exactly what you mean. Careless rm -r is how people lose production data.
      - Each command does one small job, and the pipe joins them. grep picks the lines, head keeps the first.
    answer: sort | uniq -c | sort -rn is the most useful shell idiom you'll learn. uniq only collapses neighbours, so sort first.
