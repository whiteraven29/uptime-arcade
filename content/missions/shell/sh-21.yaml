skill: shell
chapter: awk
order: 21
title: Group by
from: Finance
difficulty: hard
check: answer
par:
  kind: commands
  value: 1
lesson:
  text: -F sets awk's separator, and NR>1 skips a header row. An array like s[$1] keeps one total per key, and for (k in s) loops over the keys in END.
  example: awk -F, 'NR>1{s[$1]+=$2} END{for(k in s)print s[k],k}' sales.csv
brief: Using ~/data/customers.csv (id,name,plan,country,mrr,signup), which plan has the highest total mrr?
goal: "Run: submit <plan>"
hints:
  - awk -F, for commas, NR>1 for the header.
  - s[$3]+=$5, then a for loop in END.
debrief:
  why: Associative arrays group by any key, which is a GROUP BY in one line.
  solution: awk -F, 'NR>1{s[$3]+=$5} END{for(k in s)print s[k],k}' ~/data/customers.csv | sort -rn | head -1
  job: Quick revenue cuts save waiting for a dashboard.
teaches:
  - -F
  - NR
  - for
answer:
  accept:
    - enterprise
