      - Associative arrays group by any key, which is a GROUP BY in one line.
      - tail and cut together pull a single value out of a structured line.
      - awk splits on whitespace for you, so column work needs no delimiter flags.
    answer: Associative arrays group by any key, which is a GROUP BY in one line.
