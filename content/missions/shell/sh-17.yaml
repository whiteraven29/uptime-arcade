    q: You just finished "Search the tree". Which sentence best describes what it taught?
    options:
      - find walks a whole tree, and -name matches the base name exactly unless you use a glob.
      - Linux only runs a file if its execute bit is set, which stops a downloaded file running by accident.
      - Text sort compares character by character. Numeric sort is what you want for sizes and durations.
      - tail and cut together pull a single value out of a structured line.
    answer: find walks a whole tree, and -name matches the base name exactly unless you use a glob.
