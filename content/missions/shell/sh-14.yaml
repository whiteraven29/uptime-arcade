      - "> starts the file again every time, while >> adds to it. Mixing them up is the classic way to lose a report."
      - Each command does one small job, and the pipe joins them. grep picks the lines, head keeps the first.
      - grep is the search box of the command line. -n tells you where to go and -i stops capitals hiding a match.
    answer: Text sort compares character by character. Numeric sort is what you want for sizes and durations.
