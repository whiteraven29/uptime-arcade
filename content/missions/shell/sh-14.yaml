id: sh-14
track: SH
skill: shell
chapter: Columns
order: 14
title: Sort it out
from: SRE
difficulty: medium
check: answer
par:
  kind: commands
  value: 1
lesson:
  text: sort orders lines as text by default, so 90 lands after 800. -n sorts as numbers, -k picks the column, -r reverses, and -u drops repeats.
  example: |-
    sort -k2 -n scores.txt
    sort -u names.txt
brief: What is the highest response time in ms in ~/logs/api-access.log? It is the 6th column.
goal: "Run: submit <ms>"
hints:
  - sort -n compares as numbers.
  - -k6 sorts on column 6. The biggest ends up last.
debrief:
  why: Text sort compares character by character. Numeric sort is what you want for sizes and durations.
  solution: sort -k6 -n ~/logs/api-access.log | tail -1 | cut -d' ' -f6
  job: Worst-case latency is where user complaints come from.
teaches:
  - sort
  - -k
  - -n
answer:
  accept:
    - "1787"
