id: vi-11
track: VI
skill: vi
chapter: Operators
order: 11
title: Change in place
from: SRE
difficulty: medium
check: vi
par:
  kind: keys
  value: 16
lesson:
  text: "c is the change operator: it deletes and leaves you in insert mode. cw changes a word, cc the whole line, and C from the cursor to the end of the line."
  example: |-
    cw  change a word
    cc  change the line
    C   change to end of line
brief: Set log_level to info in ~/vi/app.yaml.
goal: "Make the change, then save with :wq. You must use vi: vi ~/vi/app.yaml"
hints:
  - 2j, then w w lands on debug.
  - cw, type info, Esc.
debrief:
  why: Go to the thing, then act on it. c does the delete and the switch to insert in one step.
  solution: 2jwwcwinfo<Esc>:wq<CR>
  job: You'll do this over SSH on live servers.
teaches:
  - c
  - C
file: ~/vi/app.yaml
expect:
  - file_equals:
      path: ~/vi/app.yaml
      content: |
        name: api
        port: 8080
        log_level: info
        workers: 4
  - vi_saved: ~/vi/app.yaml
rewind:
  - type: mc
    level: easy
    label: The main idea
    q: You just finished "Change in place". Which sentence best describes what it taught?
    options:
      - "^ is the one you want on indented code: it lands on the text, not on the spaces."
      - "Counts work with almost every command: 3dd, 5j, 2w."
      - Jumping directly to a line beats scrolling, and error messages always tell you the line.
      - Go to the thing, then act on it. c does the delete and the switch to insert in one step.
    answer: Go to the thing, then act on it. c does the delete and the switch to insert in one step.
    hint: Look for the sentence about c and C.
  - type: mc
    level: easy
    label: Spot the solution
    q: Which keys made this edit?
    context: Set log_level to info in ~/vi/app.yaml.
    options:
      - ^i#<Esc>:wq<CR>
      - 2jwwcwinfo<Esc>:wq<CR>
      - :3<CR>i# <Esc>Gi# <Esc>:wq<CR>
      - j3dd:wq<CR>
    answer: 2jwwcwinfo<Esc>:wq<CR>
    hint: cw, type info, Esc.
    code: true
  - type: mc
    level: medium
    label: Why it matters
    q: Where would you use what "Change in place" taught you at work?
    options:
      - A failing config usually reports its line number.
      - Removing temporary jobs is a habit that prevents surprises.
      - You'll do this over SSH on live servers.
      - Commenting out a setting is the safest way to switch it off.
    answer: You'll do this over SSH on live servers.
    hint: "It starts with: You'll do this over…"
  - type: text
    level: medium
