    level: medium
    label: Why it matters
    q: Where would you use what "Named registers" taught you at work?
    options:
      - Handy when you are moving several pieces around a large file.
      - A precise one-line replace leaves everything else untouched.
      - Ranges are how you edit a block without touching the rest of the file.
      - Commenting out a block is the everyday use.
    answer: Handy when you are moving several pieces around a large file.
