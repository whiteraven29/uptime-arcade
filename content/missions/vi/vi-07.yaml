id: vi-07
track: VI
skill: vi
chapter: Inserting
order: 7
title: Fix one character
from: Platform
difficulty: easy
check: vi
par:
  kind: keys
  value: 12
lesson:
  text: x deletes the character under the cursor. r replaces it with the next key you press, and you stay in normal mode.
  example: |-
    x   delete this character
    rX  replace it with X
brief: In ~/vi/replica.yaml remove the extra a in replicaas, and change port 7080 to 8080.
goal: "Make the change, then save with :wq. You must use vi: vi ~/vi/replica.yaml"
hints:
  - e jumps to the end of the word, h steps back onto the extra a.
  - r8 on the 7. No insert mode needed.
debrief:
  why: r and x fix a typo without ever leaving normal mode, so there is no Esc to forget.
  solution: ehxjhr8:wq<CR>
  job: One-character mistakes are the most common kind in config files.
teaches:
  - x
  - r
file: ~/vi/replica.yaml
expect:
  - file_equals:
      path: ~/vi/replica.yaml
      content: |
        replicas: 3
        port: 8080
  - vi_saved: ~/vi/replica.yaml
rewind:
  - type: mc
    level: easy
    label: The main idea
    q: You just finished "Fix one character". Which sentence best describes what it taught?
    options:
      - Words are the natural unit of text, and w b e let you move by them.
      - r and x fix a typo without ever leaving normal mode, so there is no Esc to forget.
      - Everything in vi starts from where the cursor is, and hjkl put you there without leaving the home row.
      - "^ is the one you want on indented code: it lands on the text, not on the spaces."
    answer: r and x fix a typo without ever leaving normal mode, so there is no Esc to forget.
    hint: Look for the sentence about x and r.
  - type: mc
    level: easy
    label: Spot the solution
    q: Which keys made this edit?
    context: In ~/vi/replica.yaml remove the extra a in replicaas, and change port 7080 to 8080.
    options:
      - ^i#<Esc>:wq<CR>
      - jlio<Esc>jio<Esc>:wq<CR>
      - ehxjhr8:wq<CR>
      - withe <Esc>:wq<CR>
    answer: ehxjhr8:wq<CR>
    hint: r8 on the 7. No insert mode needed.
    code: true
  - type: mc
    level: medium
    label: Why it matters
    q: Where would you use what "Fix one character" taught you at work?
    options:
      - YAML typos cause a large share of failed deploys.
      - Commenting out a setting is the safest way to switch it off.
      - One-character mistakes are the most common kind in config files.
      - Long config lines are quick to cross once you move by word.
    answer: One-character mistakes are the most common kind in config files.
    hint: "It starts with: One-character mistakes are the…"
