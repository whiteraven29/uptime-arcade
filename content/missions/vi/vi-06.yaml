id: vi-06
track: VI
skill: vi
chapter: Inserting
order: 6
title: Add text anywhere
from: Support
difficulty: easy
check: vi
par:
  kind: keys
  value: 32
lesson:
  text: There are several ways into insert mode. a inserts after the cursor, A at the end of the line, I at the start. o opens a new line below and O a new line above.
  example: |-
    a  after cursor
    A  end of line
    I  start of line
    o  new line below
    O  new line above
brief: "Open ~/vi/motd.txt and add a second line: Maintenance: Sunday 02:00"
goal: "Make the change, then save with :wq. You must use vi: vi ~/vi/motd.txt"
hints:
  - o opens a new line below and enters insert mode.
  - Escape returns to normal mode.
debrief:
  why: Choosing the right way into insert mode saves moving the cursor first.
  solution: "oMaintenance: Sunday 02:00<Esc>:wq<CR>"
  job: A message of the day warns everyone who logs in.
teaches:
  - a
  - A
  - o
  - O
  - I
file: ~/vi/motd.txt
expect:
  - file_equals:
      path: ~/vi/motd.txt
      content: |
        Welcome to wr-dev01
        Maintenance: Sunday 02:00
  - vi_saved: ~/vi/motd.txt
rewind:
  - type: mc
    level: easy
    label: The main idea
    q: You just finished "Add text anywhere". Which sentence best describes what it taught?
    options:
      - Choosing the right way into insert mode saves moving the cursor first.
      - Jumping directly to a line beats scrolling, and error messages always tell you the line.
      - Words are the natural unit of text, and w b e let you move by them.
      - "^ is the one you want on indented code: it lands on the text, not on the spaces."
    answer: Choosing the right way into insert mode saves moving the cursor first.
    hint: Look for the sentence about a and A.
  - type: mc
    level: easy
    label: Spot the solution
