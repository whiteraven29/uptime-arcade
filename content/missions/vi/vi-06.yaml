      - withe <Esc>:wq<CR>
      - :3<CR>i# <Esc>Gi# <Esc>:wq<CR>
      - ^i#<Esc>:wq<CR>
    answer: "oMaintenance: Sunday 02:00<Esc>:wq<CR>"
    hint: Escape returns to normal mode.
    code: true
