    level: easy
    label: The main idea
    q: You just finished "Text objects". Which sentence best describes what it taught?
    options:
      - Ranges let one command touch exactly the block you mean, with no cursor movement.
      - :s works on one line by default, and only on the first match unless you add g.
      - Text objects describe what you mean, inside these quotes, so the cursor does not have to be anywhere exact.
      - dd is cut and p is paste. In an ACL the first match wins, so a catch-all belongs last.
    answer: Text objects describe what you mean, inside these quotes, so the cursor does not have to be anywhere exact.
    hint: Look for the sentence about i" and i(.
