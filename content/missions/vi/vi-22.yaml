id: vi-22
track: VI
skill: vi
chapter: Precision
order: 22
title: Text objects
from: Backend
difficulty: hard
check: vi
par:
  kind: keys
  value: 16
lesson:
  text: After an operator, i means inside and a means around. ciw changes the word under the cursor, ci" changes inside quotes, di( deletes inside brackets, and da( takes the brackets too. The cursor can be anywhere in the object.
  example: |-
    ciw  change this word
    ci"  change inside quotes
    di(  delete inside ( )
    da(  delete ( ) as well
brief: In ~/vi/call.py replace the quoted text with new, keeping the quotes. Then on the next line empty the brackets of max, keeping the brackets.
goal: "Make the change, then save with :wq. You must use vi: vi ~/vi/call.py"
hints:
  - ci" works from anywhere on the line up to the closing quote.
  - After Esc, j moves down onto the bracket, then di(.
debrief:
  why: Text objects describe what you mean, inside these quotes, so the cursor does not have to be anywhere exact.
  solution: ci"new<Esc>jdi(:wq<CR>
  job: This is the moment vi starts to feel faster than a mouse.
teaches:
  - i"
  - i(
  - a(
  - iw
file: ~/vi/call.py
expect:
  - file_equals:
      path: ~/vi/call.py
      content: |
        name = "new"
        size = max()
  - vi_saved: ~/vi/call.py
