    q: You just finished "Replace everywhere". Which sentence best describes what it taught?
    options:
      - :s is sed inside vi. % selects the whole file and g every match per line.
      - J handles the newline and the spacing in one key.
      - :s works on one line by default, and only on the first match unless you add g.
      - Copy then tweak is faster and safer than retyping an address.
    answer: :s is sed inside vi. % selects the whole file and g every match per line.
