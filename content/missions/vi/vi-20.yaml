    q: Where would you use what "Replace everywhere" taught you at work?
    options:
      - Wrapped pastes break systemd units and shell commands.
      - A precise one-line replace leaves everything else untouched.
      - Scaling out often starts with this exact edit.
      - Global replace is the fastest big edit you can make.
