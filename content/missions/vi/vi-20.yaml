title: Replace everywhere
from: Platform
difficulty: medium
check: vi
par:
  kind: keys
  value: 25
lesson:
  text: "% in front of :s means every line in the file. g on the end means every match on each line."
  example: :%s/cat/dog/g<Enter>
brief: Replace every staging with prod in ~/vi/env.yaml in one command.
goal: "Make the change, then save with :wq. You must use vi: vi ~/vi/env.yaml"
hints:
  - :%s/old/new/g runs on the whole file.
  - "% means every line."
debrief:
  why: :s is sed inside vi. % selects the whole file and g every match per line.
  solution: :%s/staging/prod/g<CR>:wq<CR>
  job: Global replace is the fastest big edit you can make.
teaches:
  - "%"
file: ~/vi/env.yaml
