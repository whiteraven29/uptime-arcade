id: vi-21
track: VI
skill: vi
chapter: Ex commands
order: 21
title: Work on ranges
from: SRE
difficulty: hard
check: vi
par:
  kind: keys
  value: 24
lesson:
  text: Ex commands take a line range. :2,3d deletes lines 2 and 3. In a range . means the current line and $ means the last, so :.,$s runs from here to the end.
  example: |-
    :10,20d
    :.,$s/a/b/
brief: In ~/vi/switches.conf delete lines 2 and 3. The cursor lands on the next line, so from there to the end turn on into off.
goal: "Make the change, then save with :wq. You must use vi: vi ~/vi/switches.conf"
hints:
  - :2,3d deletes both lines.
  - :.,$s/on/off/ covers the current line to the last.
debrief:
  why: Ranges let one command touch exactly the block you mean, with no cursor movement.
  solution: :2,3d<CR>:.,$s/on/off/<CR>:wq<CR>
  job: Ranges are how you edit a block without touching the rest of the file.
teaches:
  - :d
  - .,$
file: ~/vi/switches.conf
expect:
  - file_equals:
      path: ~/vi/switches.conf
      content: |
        a: on
        d: off
        e: off
  - vi_saved: ~/vi/switches.conf
rewind:
