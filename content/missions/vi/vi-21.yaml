    level: easy
    label: The main idea
    q: You just finished "Work on ranges". Which sentence best describes what it taught?
    options:
      - ">> shifts a line right and << shifts it left. In YAML, indentation changes the meaning."
      - J handles the newline and the spacing in one key.
      - :s is sed inside vi. % selects the whole file and g every match per line.
      - Ranges let one command touch exactly the block you mean, with no cursor movement.
    answer: Ranges let one command touch exactly the block you mean, with no cursor movement.
    hint: Look for the sentence about :d and .,$.
