    label: The main idea
    q: You just finished "Global commands". Which sentence best describes what it taught?
    options:
      - :g and :v apply a command to every line that does or does not match, which is grep for your edits.
      - A macro turns one careful edit into a tool, which pays off on any repetitive change regex cannot express.
      - Marks are bookmarks inside a file, so you can look elsewhere and come straight back.
      - Text objects describe what you mean, inside these quotes, so the cursor does not have to be anywhere exact.
    answer: :g and :v apply a command to every line that does or does not match, which is grep for your edits.
