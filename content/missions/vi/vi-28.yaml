id: vi-28
track: VI
skill: vi
chapter: Power
order: 28
title: Global commands
from: SRE
difficulty: hard
check: vi
par:
  kind: keys
  value: 21
lesson:
  text: :g/pattern/d deletes every line that matches. :v/pattern/d deletes every line that does NOT match. They work on the whole file in one go.
  example: |-
    :g/DEBUG/d
    :v/keep/d
brief: In ~/vi/global.conf delete all comment lines, then delete every line without an = in it.
goal: "Make the change, then save with :wq. You must use vi: vi ~/vi/global.conf"
hints:
  - :g/^#/d removes the comments.
  - :v/=/d removes what has no =.
debrief:
  why: :g and :v apply a command to every line that does or does not match, which is grep for your edits.
  solution: :g/^#/d<CR>:v/=/d<CR>:wq<CR>
  job: The quickest way to strip a noisy file down to what matters.
teaches:
  - :g
  - :v
file: ~/vi/global.conf
expect:
  - file_equals:
      path: ~/vi/global.conf
      content: |
        port=80
        workers=4
  - vi_saved: ~/vi/global.conf
