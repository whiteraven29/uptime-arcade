    level: easy
    label: The main idea
    q: You just finished "Jump to a character". Which sentence best describes what it taught?
    options:
      - "Doubling an operator acts on the whole line: dd, yy, cc. Operator plus motion is the grammar of vi."
      - ; repeats the last f search, so you can hop across delimited data.
      - r and x fix a typo without ever leaving normal mode, so there is no Esc to forget.
      - Jumping directly to a line beats scrolling, and error messages always tell you the line.
    answer: ; repeats the last f search, so you can hop across delimited data.
    hint: Look for the sentence about f and t.
