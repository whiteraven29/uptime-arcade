id: vi-12
track: VI
skill: vi
chapter: Finding
order: 12
title: Jump to a character
from: Platform
difficulty: medium
check: vi
par:
  kind: keys
  value: 15
lesson:
  text: f plus a character jumps to it on the current line, and t stops just before it. ; repeats the jump, and , repeats it backwards. This lets you hop along a line from comma to comma.
  example: |-
    f,  to the next comma
    t,  just before it
    ;   again
    ,   back again
brief: In ~/vi/nodes.csv change the port to 9090.
goal: "Make the change, then save with :wq. You must use vi: vi ~/vi/nodes.csv"
hints:
  - f, jumps to a comma and ; repeats it.
  - l moves right, then cw.
debrief:
  why: ; repeats the last f search, so you can hop across delimited data.
  solution: f,;lcw9090<Esc>:wq<CR>
  job: Hand-editing CSV and config columns is common during incidents.
teaches:
  - f
  - t
  - ;
  - ","
file: ~/vi/nodes.csv
expect:
  - file_equals:
      path: ~/vi/nodes.csv
      content: |
        web01,dar,9090,active
  - vi_saved: ~/vi/nodes.csv
rewind:
