lesson:
  text: sorted returns a new sorted list. key= says what to compare and reverse=True gives biggest first. [:n] takes the first n items.
  example: sorted(d, key=d.get, reverse=True)[:3]
brief: Given a dict of name to count, return the n names with the highest counts, highest first.
goal: Write top_n(counts, n). Tests run when you press Run tests.
hints:
  - sorted(d, key=d.get, reverse=True)
  - Slice with [:n].
debrief:
  why: key= tells sorted what to compare. Slicing past the end is safe in Python.
  solution: |-
    def top_n(counts, n):
        return sorted(counts, key=counts.get, reverse=True)[:n]
  job: Top lists fill dashboards and reports.
teaches:
  - sorted
  - key
  - reverse
