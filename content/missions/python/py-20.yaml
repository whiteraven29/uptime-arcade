lesson:
  text: "with open(path) as f: opens a file and closes it for you, even if an error happens. Looping over f gives one line at a time."
  example: |-
    with open("notes.txt") as f:
        for line in f:
            if line.startswith("#"):
                print(line)
brief: Return how many lines in the file start with ERROR. A test file called app.log is ready.
goal: Write count_lines(path). Tests run when you press Run tests.
hints:
  - "with open(path) as f:"
  - line.startswith("ERROR")
debrief:
  why: with guarantees the file gets closed. Reading line by line means even a huge file fits in memory.
  solution: |-
    def count_lines(path):
        n = 0
        with open(path) as f:
            for line in f:
                if line.startswith("ERROR"):
                    n += 1
        return n
  job: Log processing starts with exactly this loop.
teaches:
  - with
  - open
  - as
  - startswith
