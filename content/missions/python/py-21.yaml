title: Counter and defaultdict
from: SRE
difficulty: hard
check: py
par:
  kind: first-try
  value: 1
lesson:
  text: The collections module has ready-made tools. Counter counts a list for you, and most_common(1) gives the top item with its count. defaultdict(list) creates a missing key as an empty list.
  example: |-
    from collections import Counter, defaultdict
    Counter(["a", "b", "a"]).most_common(1)   # [("a", 2)]
    groups = defaultdict(list)
    groups["x"].append(1)
brief: Return the path that appears most often.
goal: Write busiest(paths). Tests run when you press Run tests.
hints:
  - Counter(paths).most_common(1)
  - That gives a list holding a (path, count) pair, so take [0][0].
debrief:
  why: You wrote this loop by hand earlier. Now you know what the library saves you.
  solution: |-
    from collections import Counter

    def busiest(paths):
        return Counter(paths).most_common(1)[0][0]
  job: Knowing the standard library means writing less code.
teaches:
  - from
  - Counter
  - most_common
  - defaultdict
