lesson:
  text: import brings in a module of extra tools. JSON is the text format APIs use. json.loads turns JSON text into dicts and lists, and json.dumps turns them back into text.
  example: |-
    import json
    d = json.loads('{"a": 1}')
    d["a"] = 2
    json.dumps(d)   # '{"a": 2}'
brief: The text is a JSON object with a version number. Add 1 to it and return the new JSON text.
goal: Write bump_version(text). Tests run when you press Run tests.
hints:
  - d = json.loads(text)
  - d["version"] += 1, then json.dumps(d).
debrief:
  why: "Parse, change, serialise: never edit JSON by hand with string replacement."
  solution: |-
    import json

    def bump_version(text):
        d = json.loads(text)
        d["version"] += 1
        return json.dumps(d)
  job: Nearly every API you call speaks JSON.
teaches:
  - import
  - json
  - loads
  - dumps
