lesson:
  text: An IP address is really one 32-bit number. n * 256 + octet builds that number. >> shifts bits away, so x >> 8 drops the last 8 bits. Real programs use the ipaddress module, but doing it by hand shows what a subnet is.
  example: |-
    n = 0
    for o in [1, 2]:
        n = n * 256 + o
    n >> 8   # 1
brief: Return True when two IPv4 strings share a subnet. Prefixes run from 8 to 30.
goal: Write same_subnet(a, b, prefix). Tests run when you press Run tests.
hints:
  - n = n * 256 + octet makes one integer.
  - Shift right by 32 - prefix and compare.
debrief:
  why: An IP is a 32-bit number, and shifting off the host bits does what a subnet mask does.
  solution: |-
    def to_int(ip):
        n = 0
        for o in ip.split("."):
            n = n * 256 + int(o)
        return n

    def same_subnet(a, b, prefix):
        s = 32 - prefix
        return to_int(a) >> s == to_int(b) >> s
  job: Your computer makes this exact check before every packet.
teaches:
  - ">>"
