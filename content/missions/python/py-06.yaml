id: py-06
track: PY
skill: python
chapter: Strings
order: 6
title: Format a report line
from: SRE
difficulty: easy
check: py
par:
  kind: first-try
  value: 1
lesson:
  text: "An f-string puts values inside text: write f before the quote and put names in { }. {name:<8} pads to 8 wide on the left, and {n:>3} pads to 3 wide on the right, which is how you line up columns."
  example: |-
    name = "cat"
    n = 3
    f"{name:<6}{n:>3} left"   # "cat     3 left"
brief: Return the host padded to 8 wide on the left, then cpu padded to 3 wide on the right, then a percent sign. report_line("web01", 42) gives "web01    42%".
goal: Write report_line(host, cpu). Tests run when you press Run tests.
hints:
  - f"{host:<8}"
  - f"{host:<8}{cpu:>3}%"
debrief:
  why: f-strings keep the text and the values together, and padding is what turns output into a readable table.
  solution: |-
    def report_line(host, cpu):
        return f"{host:<8}{cpu:>3}%"
  job: Status reports and CLI tools format lines like this.
teaches:
  - f-string
python:
  starter: |
    def report_line(host, cpu):
        # your code here
        pass
  tests:
    - expr: report_line("web01", 42)
      want: '"web01    42%"'
    - expr: report_line("db", 7)
      want: '"db        7%"'
