lesson:
  text: A function is a named, reusable piece of code. def creates it, the name in brackets is its input, and return hands back the answer. A comparison such as 5 > 3 already gives True or False, so you can return it directly.
  example: |-
    def is_adult(age):
        return age >= 18

    is_adult(20)   # True
brief: Return True for any status below 500.
goal: Write is_healthy(status). Tests run when you press Run tests.
hints:
  - A comparison already gives a bool.
  - return status < 500
debrief:
  why: Functions let you solve a problem once and reuse it. Comparisons return booleans, so an if statement here adds nothing.
  solution: |-
    def is_healthy(status):
        return status < 500
  job: Health logic like this sits behind every status page.
teaches:
  - def
  - return
python:
  starter: |
    def is_healthy(status):
        # your code here
        pass
  tests:
    - expr: is_healthy(200)
      want: "True"
    - expr: is_healthy(404)
      want: "True"
    - expr: is_healthy(500)
      want: "False"
    - expr: is_healthy(503)
      want: "False"
