id: py-10
track: PY
skill: python
chapter: Dicts
order: 10
title: Look things up
from: Network
difficulty: easy
check: py
par:
  kind: first-try
  value: 1
lesson:
  text: A dict maps keys to values, written with {} braces. d["a"] looks a key up, and it crashes if the key is missing, so check first with in.
  example: |-
    ages = {"amina": 31, "joel": 27}
    ages["joel"]        # 27
    "sara" in ages      # False
brief: Return the port for a service from PORTS, or "unknown" if it is not there.
goal: Write port_of(service). Tests run when you press Run tests.
hints:
  - "if service in PORTS:"
  - return PORTS[service], otherwise "unknown".
debrief:
  why: A dict finds a value by name instantly, with no looping through a list.
  solution: |-
    PORTS = {"ssh": 22, "dns": 53, "https": 443}

    def port_of(service):
        if service in PORTS:
            return PORTS[service]
        return "unknown"
  job: Lookup tables are everywhere in config and routing code.
teaches:
  - "{}"
  - in
python:
