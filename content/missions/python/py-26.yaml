lesson:
  text: An object keeps its state between calls. Anything stored on self is still there next time a method runs, which is what makes objects different from plain functions.
  example: |-
    class Tally:
        def __init__(self):
            self.n = 0
        def add(self):
            self.n += 1
brief: hit(path) records a request. total holds how many so far. count(path) returns the hits for one path, 0 if none.
goal: Write the Hits class. Tests run when you press Run tests.
hints:
  - Set self.total = 0 and self.paths = {} in __init__.
  - self.paths.get(path, 0)
debrief:
  why: State that lives on self survives between calls, so the object remembers what happened to it.
  solution: |-
    class Hits:
        def __init__(self):
            self.total = 0
            self.paths = {}
        def hit(self, path):
            self.total += 1
            self.paths[path] = self.paths.get(path, 0) + 1
        def count(self, path):
            return self.paths.get(path, 0)
  job: Metrics counters in real services look just like this.
teaches:
  - state
