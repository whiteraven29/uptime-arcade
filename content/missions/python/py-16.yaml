    q: You just finished "Flexible functions". Which sentence best describes what it taught?
    options:
      - key= tells sorted what to compare. Slicing past the end is safe in Python.
      - Defaults keep the common call short while still letting callers change the rare setting.
      - for is for a known list, and while is for "until this becomes true". Make sure something changes, or it runs forever.
