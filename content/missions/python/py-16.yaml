lesson:
  text: A parameter can have a default, used when the caller leaves it out. Callers can also name arguments, as in f(2, cap=3), which makes calls easier to read.
  example: |-
    def greet(name, word="Hello"):
        return word + " " + name

    greet("Sara")              # Hello Sara
    greet("Sara", word="Hi")   # Hi Sara
brief: Return base * 2 ** attempt, but never more than cap.
goal: Write delay(attempt, base=1, cap=30). Tests run when you press Run tests.
hints:
  - base * 2 ** attempt
  - min(..., cap)
debrief:
  why: Defaults keep the common call short while still letting callers change the rare setting.
  solution: |-
    def delay(attempt, base=1, cap=30):
        return min(base * 2 ** attempt, cap)
  job: Good library functions are built around sensible defaults.
teaches:
  - default
  - keyword
