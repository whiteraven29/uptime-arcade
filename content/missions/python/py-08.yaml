id: py-08
track: PY
skill: python
chapter: Lists
order: 8
title: Loop over things
from: SRE
difficulty: easy
check: py
par:
  kind: first-try
  value: 1
lesson:
  text: for repeats the indented lines once per item, giving each item a name. range(3) gives 0, 1, 2 when you need to count. Start a total at 0 and add with +=.
  example: |-
    total = 0
    for n in [1, 2, 3]:
        total += n

    for i in range(3):
        print(i)
brief: Given a list of status codes, return how many are 500 or above.
goal: Write count_errors(codes). Tests run when you press Run tests.
hints:
  - Start a counter at 0.
  - "Inside the loop: if code >= 500: n += 1"
debrief:
  why: Loop, test, count is the shape of a huge amount of real code.
  solution: |-
    def count_errors(codes):
        n = 0
        for code in codes:
            if code >= 500:
                n += 1
        return n
  job: Counting errors is the first number anyone asks for in an incident.
teaches:
  - for
  - in
  - range
  - +=
python:
  starter: |
    def count_errors(codes):
        # your code here
        pass
  tests:
    - expr: count_errors([200, 500, 503, 404])
      want: "2"
    - expr: count_errors([])
      want: "0"
    - expr: count_errors([500])
      want: "1"
