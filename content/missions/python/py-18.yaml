lesson:
  text: Unpack each split row into names, convert text to numbers with int(), and add into a dict.
  example: |-
    a, b = "cat,3".split(",")
    t[a] = t.get(a, 0) + int(b)
brief: Rows are "date,customer,mb". Return a dict of customer to total mb as ints.
goal: Write totals(rows). Tests run when you press Run tests.
hints:
  - Unpack the three parts from split(',').
  - dict.get with a default.
debrief:
  why: Group-and-sum is awk's s[$2]+=$3 written as a dict.
  solution: |-
    def totals(rows):
        out = {}
        for row in rows:
            d, c, mb = row.split(",")
            out[c] = out.get(c, 0) + int(mb)
        return out
  job: Usage billing is built on this.
teaches:
  - split
