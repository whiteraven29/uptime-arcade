id: py-17
track: PY
skill: python
chapter: Functions
order: 17
title: When things go wrong
from: Backend
difficulty: medium
check: py
par:
  kind: first-try
  value: 1
lesson:
  text: int("abc") raises an error that would stop the program. try runs risky code, and except catches the error so you can respond. raise creates an error yourself. None means "no value".
  example: |-
    try:
        n = int(text)
    except ValueError:
        n = None

    if n < 0:
        raise ValueError("negative")
brief: Return the text as an int if it is a valid port from 1 to 65535. Return None otherwise.
goal: Write parse_port(text). Tests run when you press Run tests.
hints:
  - Put int(text) inside try, and raise ValueError when it is out of range.
  - "except ValueError: return None"
debrief:
  why: Errors are normal when input comes from outside. Catch what you expect and turn it into something the rest of the code can use.
  solution: |-
    def parse_port(text):
        try:
            n = int(text)
            if n < 1 or n > 65535:
                raise ValueError("out of range")
            return n
        except ValueError:
            return None
  job: Every program that reads input needs this.
teaches:
  - try
  - except
  - raise
  - None
  - ValueError
  - int
python:
  starter: |
    def parse_port(text):
        # your code here
        pass
  tests:
    - expr: parse_port("8080")
      want: "8080"
    - expr: parse_port("abc")
      want: None
    - expr: parse_port("70000")
      want: None
