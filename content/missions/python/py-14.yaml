par:
  kind: first-try
  value: 1
lesson:
  text: "A list comprehension builds a list in one line: [expression for item in list]. ** is power, so 2 ** 3 is 8, and min(a, b) gives the smaller value, which works as a cap."
  example: |-
    [n * 2 for n in [1, 2, 3]]            # [2, 4, 6]
    [min(3 * 2 ** i, 20) for i in range(4)]  # [3, 6, 12, 20]
brief: Return n retry delays that double from base and never exceed cap.
goal: Write backoff(base, n, cap). Tests run when you press Run tests.
hints:
  - base * 2 ** i
  - min() applies the cap.
debrief:
  why: Exponential backoff stops clients hammering a struggling service, and the cap limits the wait.
  solution: |-
    def backoff(base, n, cap):
        return [min(base * 2 ** i, cap) for i in range(n)]
  job: Every reliable client retries this way.
teaches:
  - comprehension
  - "**"
  - min
