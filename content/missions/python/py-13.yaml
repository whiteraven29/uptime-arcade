par:
  kind: first-try
  value: 1
lesson:
  text: A set holds unique values and answers "have I seen this?" quickly. Use it beside a list when order matters, and add to the list with append.
  example: |-
    seen = set()
    out = []
    if x not in seen:
        seen.add(x)
        out.append(x)
brief: Return items without repeats, keeping first-seen order.
goal: Write dedupe(items). Tests run when you press Run tests.
hints:
  - A set remembers what you've seen.
  - Append to a list only when it's new.
debrief:
  why: A set gives fast membership checks and a list keeps the order, so you use both.
  solution: |-
    def dedupe(items):
        seen = set()
        out = []
        for x in items:
            if x not in seen:
                seen.add(x)
                out.append(x)
        return out
  job: Deduping events is a daily data task.
teaches:
  - set
  - add
  - not
  - append
