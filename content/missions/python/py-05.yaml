lesson:
  text: "String methods return new strings, and you can chain them: strip removes outer spaces, lower lowercases, and replace swaps text."
  example: '" Hi There ".strip().lower().replace(" ", "_")'
brief: 'Lowercase, turn spaces into dashes, and strip outer spaces: " Cold Room 3 " gives "cold-room-3".'
goal: Write slugify(name). Tests run when you press Run tests.
hints:
  - strip() then lower().
  - replace(' ', '-')
debrief:
  why: Chaining string methods reads top to bottom like a pipeline.
  solution: |-
    def slugify(name):
        return name.strip().lower().replace(" ", "-")
  job: Every product with URLs needs this.
teaches:
  - strip
  - lower
  - replace
python:
