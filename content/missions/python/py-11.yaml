id: py-11
track: PY
skill: python
chapter: Dicts
order: 11
title: Count anything
from: SRE
difficulty: medium
check: py
par:
  kind: first-try
  value: 1
lesson:
  text: d.get(k, 0) gives 0 when the key is missing, which makes counting simple. line.split() breaks text into a list of words.
  example: |-
    c = {}
    for w in words:
        c[w] = c.get(w, 0) + 1

    "a b c".split()[1]   # "b"
brief: Each line is space separated and the 5th field is the status. Return a dict of status string to count.
goal: Write count_status(lines). Tests run when you press Run tests.
hints:
  - line.split()[4]
  - counts.get(s, 0) + 1
debrief:
  why: This is uniq -c as a dict. It's the same group-and-count idea in another language.
  solution: |-
    def count_status(lines):
        counts = {}
        for line in lines:
            s = line.split()[4]
            counts[s] = counts.get(s, 0) + 1
        return counts
  job: Log summaries in services start like this.
teaches:
  - get
  - split
python:
  starter: |
    def count_status(lines):
        # your code here
        pass
  tests:
    - expr: count_status(["t i GET /a 200 5","t i GET /b 500 9","t i GET /a 200 1"])
      want: '{"200":2,"500":1}'
    - expr: count_status([])
      want: "{}"
