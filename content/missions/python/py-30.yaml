lesson:
  text: Nothing new. Parse each line, count as you go, and work out the percentile at the end. For nearest-rank p95, sort the values and take rank -(-95 * n // 100), remembering that rank r is index r - 1.
  example: |-
    s = sorted(values)
    rank = -(-95 * len(s) // 100)
    s[rank - 1]
brief: Each line is "path status ms". Return a dict with requests (how many lines), errors (status 500 or above), p95 (nearest-rank 95th percentile of ms), and top (the most requested path).
goal: Write analyse(lines). Tests run when you press Run tests.
hints:
  - Unpack path, status, ms from split(), and convert with int().
  - sorted(paths, key=paths.get, reverse=True)[0] finds the top path.
debrief:
  why: "Real tools are small pieces put together: parse, aggregate, sort, report. p95 shows what slow users feel, where an average hides them."
  solution: |-
    def analyse(lines):
        errors = 0
        times = []
        paths = {}
        for line in lines:
            path, status, ms = line.split()
            if int(status) >= 500:
                errors += 1
            times.append(int(ms))
            paths[path] = paths.get(path, 0) + 1
        s = sorted(times)
        rank = -(-95 * len(s) // 100)
        top = sorted(paths, key=paths.get, reverse=True)[0]
        return {"requests": len(lines), "errors": errors, "p95": s[rank - 1], "top": top}
  job: You have just written a small version of what monitoring tools do.
teaches:
  - capstone
