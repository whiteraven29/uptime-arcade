lesson:
  text: A list holds values in order, inside [ ]. Counting starts at 0, so x[0] is the first item and x[-1] is the last. x[a:b] takes a slice from a up to b, and len(x) is how many items it has.
  example: |-
    x = [10, 20, 30]
    x[0]      # 10
    x[-1]     # 30
    x[0:2]    # [10, 20]
    len(x)    # 3
brief: Return a new list holding the first and last items.
goal: Write ends(items). Tests run when you press Run tests.
hints:
  - items[0] is the first.
  - return [items[0], items[-1]]
debrief:
  why: Indexing from 0 feels odd for a day and then becomes natural. -1 means count from the end.
  solution: |-
    def ends(items):
        return [items[0], items[-1]]
  job: Picking the first and last records is a daily task with logs.
teaches:
  - "[]"
  - "[i]"
  - len
  - "[a:b]"
