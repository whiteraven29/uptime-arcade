id: py-12
track: PY
skill: python
chapter: Collections
order: 12
title: Tuples and unpacking
from: Compliance
difficulty: medium
check: py
par:
  kind: first-try
  value: 1
lesson:
  text: "You can unpack a list or tuple straight into names: a, b = ... A tuple is a fixed group of values written with commas, like a list you cannot change. + joins strings."
  example: |-
    point = (3, 4)
    x, y = point
    name, ext = "pic.png".split(".")
    name[0] + "..." + ext
brief: 'Keep the first letter and the domain: "amina@whiteraven.example" gives "a***@whiteraven.example".'
goal: Write mask_email(addr). Tests run when you press Run tests.
hints:
  - split('@') gives two parts.
  - Use the first character plus ***.
debrief:
  why: Unpacking names each part as it comes out, so the rest of the code reads clearly.
  solution: |-
    def mask_email(addr):
        user, domain = addr.split("@")
        return user[0] + "***@" + domain
  job: Privacy laws expect this in production logs.
teaches:
  - unpack
  - +
python:
  starter: |
    def mask_email(addr):
        # your code here
        pass
  tests:
    - expr: mask_email("amina@whiteraven.example")
      want: '"a***@whiteraven.example"'
    - expr: mask_email("jo@x.io")
      want: '"j***@x.io"'
