id: py-09
track: PY
skill: python
chapter: Lists
order: 9
title: Loop until done
from: SRE
difficulty: easy
check: py
par:
  kind: first-try
  value: 1
lesson:
  text: while repeats as long as its condition stays true. Use it when you do not know how many rounds you need. break leaves a loop early.
  example: |-
    n = 1
    while n < 100:
        n *= 2
    # n is now 128
brief: Starting from start, count how many doublings it takes to reach at least limit.
goal: Write doublings(start, limit). Tests run when you press Run tests.
hints:
  - Loop while start < limit.
  - start *= 2 and add 1 to a counter each round.
debrief:
  why: for is for a known list, and while is for "until this becomes true". Make sure something changes, or it runs forever.
  solution: |-
    def doublings(start, limit):
        n = 0
        while start < limit:
            start *= 2
            n += 1
        return n
  job: Retry loops and polling are written this way.
teaches:
  - while
  - break
  - "*="
