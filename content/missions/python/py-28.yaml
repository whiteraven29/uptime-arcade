id: py-28
track: PY
skill: python
chapter: Quality
order: 28
title: Test your code
from: Platform
difficulty: hard
check: py
par:
  kind: first-try
  value: 1
lesson:
  text: assert checks that something is true and raises an error if not. A test is just a function full of asserts. Good tests try more than one value, because a broken function can be right by luck.
  example: |-
    def test_add():
        assert add(1, 2) == 3
        assert add(0, 0) == 0
brief: Write test_double so it passes on the correct double and fails on broken ones. Testing only double(2) is not enough, because 2 + 2 is also 4.
goal: Fill in test_double. Tests run when you press Run tests.
hints:
  - assert double(3) == 6
  - Check at least two different values.
debrief:
  why: A test proves the code works today and warns you the day it stops. Picking inputs that can tell right from wrong is the skill.
  solution: |-
    def double(x):
        return x * 2

    def test_double():
        assert double(3) == 6
        assert double(5) == 10
  job: Teams will not merge code without tests.
teaches:
  - assert
python:
  starter: |
    def double(x):
        return x * 2

    def test_double():
        # add assert lines here
        pass
  tests:
    - expr: test_double()
      want: None
      label: your test passes on the correct double
    - expr: "_catches(lambda x: x + 2)"
      want: "True"
      label: your test catches a double that adds 2
    - expr: "_catches(lambda x: x * 3)"
      want: "True"
      label: your test catches a double that triples
  prelude: |
    def _catches(bad):
        global double
        good = double
        double = bad
        try:
            test_double()
            return False
        except AssertionError:
            return True
        finally:
            double = good
