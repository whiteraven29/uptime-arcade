id: py-03
track: PY
skill: python
chapter: Basics
order: 3
title: Make a decision
from: SRE
difficulty: easy
check: py
par:
  kind: first-try
  value: 1
lesson:
  text: if runs the indented lines below it only when its condition is true. elif checks another condition, and else catches whatever is left. Comparisons like <, >= and == give True or False. Indentation is how Python knows what belongs to the if.
  example: |-
    if temp > 30:
        state = "hot"
    elif temp > 15:
        state = "mild"
    else:
        state = "cold"
brief: The variable status holds an HTTP code. Set label to "ok" below 400, "client error" below 500, and "server error" for anything else.
goal: Set label using if, elif and else. Tests run when you press Run tests.
hints:
  - Check the smallest range first, then elif status < 500.
  - else catches everything from 500 up.
debrief:
  why: Conditions are checked from the top and the first true one wins, so the order matters.
  solution: |-
    if status < 400:
        label = "ok"
    elif status < 500:
        label = "client error"
    else:
        label = "server error"
  job: Status logic like this sits behind every dashboard.
teaches:
  - if
  - elif
  - else
  - <
  - ">="
python:
  starter: |
    # status is already set for you. Set label here.
    if status < 400:
        label = "ok"
  tests:
    - expr: __case(200)
      want: '"ok"'
      label: status 200
    - expr: __case(404)
      want: '"client error"'
      label: status 404
    - expr: __case(503)
      want: '"server error"'
      label: status 503
  wrap:
    args: status
    ret: label
