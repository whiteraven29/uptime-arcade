lesson:
  text: datetime(2026, 11, 14, 23, 0) makes a moment in time. Adding a timedelta moves it forward and handles the end of a day or month for you. strftime formats it as text.
  example: |-
    from datetime import datetime, timedelta
    t = datetime(2026, 1, 31, 12, 0)
    (t + timedelta(days=1)).strftime("%Y-%m-%d")   # "2026-02-01"
brief: A maintenance window starts in November 2026 on the given day and hour. Return when it ends, as "YYYY-MM-DD HH:MM".
goal: Write window_end(day, hour, minutes). Tests run when you press Run tests.
hints:
  - datetime(2026, 11, day, hour, 0) + timedelta(minutes=minutes)
  - strftime("%Y-%m-%d %H:%M")
debrief:
  why: Date maths is full of traps like month ends and leap years, so never do it by hand.
  solution: |-
    from datetime import datetime, timedelta

    def window_end(day, hour, minutes):
        t = datetime(2026, 11, day, hour, 0) + timedelta(minutes=minutes)
        return t.strftime("%Y-%m-%d %H:%M")
  job: Schedules, expiry dates and SLAs all need this.
teaches:
  - datetime
  - timedelta
  - strftime
python:
  starter: |
    from datetime import datetime, timedelta

    def window_end(day, hour, minutes):
        # your code here
        pass
  tests:
    - expr: window_end(14, 23, 90)
      want: '"2026-11-15 00:30"'
    - expr: window_end(1, 2, 30)
      want: '"2026-11-01 02:30"'
