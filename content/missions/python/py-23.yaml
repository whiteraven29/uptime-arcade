lesson:
  text: The re module searches with regular expressions. re.findall returns every match, and if the pattern has ( ) you get just that group. \d+ means one or more digits. Write patterns as r"..." so backslashes stay literal.
  example: |-
    import re
    re.findall(r"id=(\d+)", "id=7 id=9")   # ["7", "9"]
brief: Return every number that follows order= in the text, as strings.
goal: Write order_ids(text). Tests run when you press Run tests.
hints:
  - re.findall with a group.
  - r"order=(\d+)"
debrief:
  why: Regular expressions pull structure out of messy text, the same idea as grep -o.
  solution: |-
    import re

    def order_ids(text):
        return re.findall(r"order=(\d+)", text)
  job: Log parsers lean on this all the time.
teaches:
  - re
  - findall
