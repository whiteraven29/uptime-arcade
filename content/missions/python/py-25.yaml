par:
  kind: first-try
  value: 1
lesson:
  text: A class is a blueprint that bundles data with the functions that use it. __init__ runs when you create an object and stores values on self. Methods are functions inside the class, and they all take self first.
  example: |-
    class Dog:
        def __init__(self, name):
            self.name = name
        def speak(self):
            return self.name + " says hi"

    Dog("Rex").speak()
brief: Server("web", 4) stores a name and a core count. capacity() returns cores * 100. describe() returns "web has 4 cores".
goal: Write the Server class. Tests run when you press Run tests.
hints:
  - "def __init__(self, name, cores):"
  - return f"{self.name} has {self.cores} cores"
debrief:
  why: A class keeps related data and behaviour together, so the rest of the program has less to track.
  solution: |-
    class Server:
        def __init__(self, name, cores):
            self.name = name
            self.cores = cores
        def capacity(self):
            return self.cores * 100
        def describe(self):
            return f"{self.name} has {self.cores} cores"
  job: Most large codebases are organised around classes.
teaches:
  - class
  - __init__
  - self
python:
  starter: |
    class Server:
        # your code here
        pass
  tests:
    - expr: Server("web", 4).capacity()
      want: "400"
    - expr: Server("db", 2).describe()
      want: '"db has 2 cores"'
