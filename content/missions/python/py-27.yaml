par:
  kind: first-try
  value: 1
lesson:
  text: "yield makes a generator: a function that hands out one value at a time and pauses in between. It holds no list in memory, so it can walk through a 10 GB file. list() collects the values if you need them all, and sum() adds them up as they come."
  example: |-
    def countdown(n):
        while n > 0:
            yield n
            n -= 1

    list(countdown(3))   # [3, 2, 1]
brief: Yield the even numbers from 0 up to, but not including, limit.
goal: Write evens(limit). Tests run when you press Run tests.
hints:
  - "for n in range(0, limit, 2):"
  - yield n
debrief:
  why: Generators do the work only when asked, so memory use stays flat however much data flows through.
  solution: |-
    def evens(limit):
        for n in range(0, limit, 2):
            yield n
  job: Streaming big logs line by line relies on this.
teaches:
  - yield
  - list
  - sum
