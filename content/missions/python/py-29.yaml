lesson:
  text: Sort by start time, then walk through once. out[-1] is the last item, and you extend it when the next item overlaps. max(a, b) gives the larger value.
  example: |-
    for s, e in sorted(items):
        if out and s <= out[-1][1]:
            out[-1][1] = max(out[-1][1], e)
brief: Given [start, end] pairs, merge overlapping ones and return them sorted.
goal: Write merge(windows). Tests run when you press Run tests.
hints:
  - Sort by start.
  - Extend the last window when the next one overlaps.
debrief:
  why: Sorting first turns an all-pairs problem into one pass.
  solution: |-
    def merge(windows):
        out = []
        for s, e in sorted(windows):
            if out and s <= out[-1][1]:
                out[-1][1] = max(out[-1][1], e)
            else:
                out.append([s, e])
        return out
  job: Calendars, schedulers and IP ranges all use this.
teaches:
  - max
  - and
