id: go-10
track: GO
skill: go
chapter: Slices
order: 10
title: Grow with append
from: Backend
difficulty: easy
check: go-out
par:
  kind: first-try
  value: 1
lesson:
  text: append adds to a slice and returns the result. A slice has a length and a capacity. When there is no spare capacity, append copies to a new array, so the two slices stop sharing.
  example: |-
    a := []int{1}
    b := append(a, 2)
    b[0] = 5   // a[0] is still 1
brief: Read this Go program and predict exactly what it prints.
goal: "Predict the output, then run: submit <the printed text>"
hints:
  - "a is full: len 2, cap 2."
  - append must allocate a new array.
debrief:
  why: With no capacity left, append copies to a new array, so a and b no longer share memory.
  solution: submit 1 9
  job: Sharing depends on capacity, so never rely on it.
teaches:
  - append
answer:
  accept:
    - 1 9
go:
  program: |
    package main

    import (
    	"fmt"
    )

    func main() {
    	a := []int{1, 2}
    	b := append(a, 3)
    	b[0] = 9
    	fmt.Println(a[0], b[0])
    }
