title: 'Capstone: the worker pool'
from: CTO
difficulty: expert
check: go-code
par:
  kind: first-try
  value: 1
lesson:
  text: Nothing new. A worker pool is goroutines ranging over a jobs channel. They only leave that loop when the channel is closed, and wg.Wait() only returns when they leave.
  example: "for j := range jobs {\n\t// stops when jobs is closed\n}"
brief: Three workers double each job, and sumDoubled adds up what they return. As written it hangs forever at wg.Wait(), because the workers never learn that the jobs have run out. Fix it.
goal: Add the line that lets the workers finish. Run tests compiles and runs your code with go test.
hints:
- range over a channel only ends when the channel is closed.
- Close jobs once every job has been sent, before wg.Wait().
debrief:
  why: range over a channel ends only on close. Whoever sends is responsible for closing, otherwise every worker waits forever.
  solution: "package main\n\nimport (\n\t\"fmt\"\n\t\"sync\"\n)\n\nfunc sumDoubled(nums []int) int {\n\tjobs := make(chan int, len(nums))\n\tresults := make(chan int, len(nums))\n\tvar wg sync.WaitGroup\n\tfor w := 0; w < 3; w++ {\n\t\twg.Add(1)\n\t\tgo func() {\n\t\t\tdefer wg.Done()\n\t\t\tfor j := range jobs {\n\t\t\t\tresults <- j * 2\n\t\t\t}\n\t\t}()\n\t}\n\tfor _, n := range nums {\n\t\tjobs <- n\n\t}\n\tclose(jobs)\n\twg.Wait()\n\tclose(results)\n\tsum := 0\n\tfor r := range results {\n\t\tsum += r\n\t}\n\treturn sum\n}\n\nfunc main() {\n\tfmt.Println(sumDoubled([]int{1, 2, 3, 4, 5}))\n}\n"
  job: You have just debugged the most common goroutine leak there is.
teaches:
- capstone
go:
  starter: "package main\n\nimport (\n\t\"fmt\"\n\t\"sync\"\n)\n\nfunc sumDoubled(nums []int) int {\n\tjobs := make(chan int, len(nums))\n\tresults := make(chan int, len(nums))\n\tvar wg sync.WaitGroup\n\tfor w := 0; w < 3; w++ {\n\t\twg.Add(1)\n\t\tgo func() {\n\t\t\tdefer wg.Done()\n\t\t\tfor j := range jobs {\n\t\t\t\tresults <- j * 2\n\t\t\t}\n\t\t}()\n\t}\n\tfor _, n := range nums {\n\t\tjobs <- n\n\t}\n\t// One line is missing here.\n\twg.Wait()\n\tclose(results)\n\tsum := 0\n\tfor r := range results {\n\t\tsum += r\n\t}\n\treturn sum\n}\n\nfunc main() {\n\tfmt.Println(sumDoubled([]int{1, 2, 3, 4, 5}))\n}\n"
  test: "package main\n\nimport \"testing\"\n\nfunc TestSumDoubled(t *testing.T) {\n\tif got := sumDoubled([]int{1, 2, 3, 4, 5}); got != 30 {\n\t\tt.Errorf(\"sumDoubled gave %d, wanted 30\", got)\n\t}\n\tif got := sumDoubled(nil); got != 0 {\n\t\tt.Errorf(\"sumDoubled(nil) gave %d, wanted 0\", got)\n\t}\n}\n"
