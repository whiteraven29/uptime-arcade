lesson:
  text: Every Go program starts with package main, imports the packages it needs, and begins running at func main(). fmt.Println prints a line. Curly braces hold the body of the function.
  example: |-
    package main

    import "fmt"

    func main() {
    	fmt.Println("Hi")
    }
brief: Read this Go program and predict exactly what it prints.
goal: "Predict the output, then run: submit <the printed text>"
hints:
  - Execution starts inside func main.
  - Println prints the text between the quotes.
debrief:
  why: package main and func main are where a Go program starts. Everything else is just the instructions inside.
  solution: submit Hello, Whiteraven
  job: Every Go service you ever read starts from this exact shape.
teaches:
  - package
  - import
  - func
  - main
  - fmt
  - Println
answer:
