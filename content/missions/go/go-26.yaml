  - type: mc
    level: easy
    label: The main idea
    q: You just finished "Select and timeouts". Which sentence best describes what it taught?
    options:
      - Wrapping adds context without losing the original, so use errors.Is rather than ==.
      - recover only works inside a deferred function, because deferred calls are all that run during a panic.
      - default makes a channel operation non-blocking, and time.After is how you stop waiting forever.
      - Goroutines are cheap to start, but main does not wait for them. That is the first concurrency trap.
    answer: default makes a channel operation non-blocking, and time.After is how you stop waiting forever.
