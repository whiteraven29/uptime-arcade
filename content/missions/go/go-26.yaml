id: go-26
track: GO
skill: go
chapter: Concurrency
order: 26
title: Select and timeouts
from: Backend
difficulty: hard
check: go-out
par:
  kind: first-try
  value: 1
lesson:
  text: select waits on several channels and runs whichever is ready first. A case on time.After gives you a timeout. With a default case it does not wait at all.
  example: |-
    select {
    case v := <-c:
    	fmt.Print(v)
    case <-time.After(time.Second):
    	fmt.Print("too slow")
    }
brief: Read this Go program and predict exactly what it prints.
goal: "Predict the output, then run: submit <the printed text>"
hints:
  - Nothing is ready to send.
  - default runs when no case is ready.
debrief:
  why: default makes a channel operation non-blocking, and time.After is how you stop waiting forever.
  solution: submit empty
  job: Handy for try-send and try-receive, and for every timeout.
teaches:
  - select
answer:
  accept:
    - empty
go:
  program: |
    package main

    import (
    	"fmt"
    )

    func main() {
    	ch := make(chan int)
    	select {
    	case v := <-ch:
    		fmt.Println(v)
    	default:
    		fmt.Println("empty")
    	}
    }
