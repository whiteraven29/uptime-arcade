id: go-20
track: GO
skill: go
chapter: Cleanup
order: 20
title: panic and recover
from: Platform
difficulty: medium
check: go-out
par:
  kind: first-try
  value: 1
lesson:
  text: panic stops normal flow and starts unwinding the program. A deferred function can call recover to catch it. Keep panics for real programmer errors, and use returned errors for everything else.
  example: |-
    defer func() {
    	if r := recover(); r != nil {
    		fmt.Println("saved")
    	}
    }()
    panic("oops")
brief: Read this Go program and predict exactly what it prints.
goal: "Predict the output, then run: submit <the printed text>"
hints:
  - The deferred function still runs during the panic.
  - recover stops it, and the named result is what gets returned.
debrief:
  why: recover only works inside a deferred function, because deferred calls are all that run during a panic.
  solution: submit caught and still running
  job: Web servers use this to stop one bad request killing the process.
teaches:
  - panic
  - recover
answer:
  accept:
    - caught and still running
go:
  program: |
    package main

    import (
    	"fmt"
    )

    func safe() (msg string) {
    	defer func() {
    		if r := recover(); r != nil {
    			msg = "caught"
    		}
    	}()
    	panic("boom")
    }

    func main() {
    	fmt.Println(safe(), "and still running")
    }
