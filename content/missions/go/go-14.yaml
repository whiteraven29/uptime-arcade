id: go-14
track: GO
skill: go
chapter: Maps and text
order: 14
title: Bytes and runes
from: Backend
difficulty: medium
check: go-out
par:
  kind: first-try
  value: 1
lesson:
  text: A Go string is a row of bytes in UTF-8, so len counts bytes. Characters outside plain English can take several bytes. Convert to []rune to count characters.
  example: |-
    len("é")            // 2
    len([]rune("é"))    // 1
brief: Read this Go program and predict exactly what it prints.
goal: "Predict the output, then run: submit <the printed text>"
hints:
  - len counts bytes.
  - ✓ takes 3 bytes in UTF-8.
debrief:
  why: Strings are bytes, so convert to runes when you need characters.
  solution: submit 6 8 6
  job: This matters for limits on any text that is not plain ASCII.
teaches:
  - rune
  - "[]rune"
answer:
  accept:
    - 6 8 6
go:
  program: |
    package main

    import (
    	"fmt"
    )

    func main() {
    	s := "habari"
    	t := "jambo✓"
    	fmt.Println(len(s), len(t), len([]rune(t)))
    }
