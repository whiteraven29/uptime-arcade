title: Share safely
from: Backend
difficulty: hard
check: go-out
par:
  kind: first-try
  value: 1
lesson:
  text: "The sync package has the tools for this. WaitGroup waits for goroutines: Add before starting, Done when finished, Wait blocks until all are done. A Mutex lets only one goroutine at a time change shared data."
  example: |-
    wg.Add(1)
    go func() {
    	defer wg.Done()
    	mu.Lock(); n++; mu.Unlock()
    }()
    wg.Wait()
brief: Read this Go program and predict exactly what it prints.
goal: "Predict the output, then run: submit <the printed text>"
hints:
  - The mutex protects n.
  - Wait blocks until every Done.
debrief:
  why: WaitGroup waits for the goroutines, and the mutex stops lost updates. Without it the count could be wrong.
  solution: submit 100
  job: The basic shape of safe concurrent code.
teaches:
  - sync
  - Mutex
  - WaitGroup
  - Add
  - Done
  - Wait
  - Lock
  - Unlock
answer:
  accept:
    - "100"
go:
  program: |
    package main

    import (
    	"fmt"
    	"sync"
    )

    func main() {
    	var mu sync.Mutex
    	var wg sync.WaitGroup
    	n := 0
    	for i := 0; i < 100; i++ {
    		wg.Add(1)
    		go func() {
    			defer wg.Done()
    			mu.Lock()
    			n++
    			mu.Unlock()
    		}()
    	}
    	wg.Wait()
    	fmt.Println(n)
    }
