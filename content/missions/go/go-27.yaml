      - Channels are how goroutines talk safely, by handing over values instead of sharing memory.
      - Wrapping adds context without losing the original, so use errors.Is rather than ==.
      - Goroutines are cheap to start, but main does not wait for them. That is the first concurrency trap.
      - WaitGroup waits for the goroutines, and the mutex stops lost updates. Without it the count could be wrong.
