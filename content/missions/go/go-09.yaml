id: go-09
track: GO
skill: go
chapter: Slices
order: 9
title: Arrays vs slices
from: Backend
difficulty: easy
check: go-out
par:
  kind: first-try
  value: 1
lesson:
  text: An array has a fixed size in its type, like [2]int, and assigning it copies everything. A slice, []int, is a small view onto an array, so assigning one shares the same data.
  example: |-
    a := [2]int{1, 2}  // array: copied
    s := []int{1, 2}   // slice: shared
brief: Read this Go program and predict exactly what it prints.
goal: "Predict the output, then run: submit <the printed text>"
hints:
  - b is a full copy of a.
  - t looks at the same data as s.
debrief:
  why: Arrays are values and slices are views. That one difference explains most slice surprises.
  solution: submit 1 9
  job: You will use slices almost always, and arrays rarely.
teaches:
  - "[2]int"
  - slice
answer:
  accept:
    - 1 9
go:
  program: |
    package main

    import (
    	"fmt"
    )

    func main() {
    	a := [2]int{1, 2}
    	b := a
    	b[0] = 9
    	s := []int{1, 2}
    	t := s
    	t[0] = 9
    	fmt.Println(a[0], s[0])
    }
