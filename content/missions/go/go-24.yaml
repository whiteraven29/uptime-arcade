id: go-24
track: GO
skill: go
chapter: Concurrency
order: 24
title: Channels
from: Backend
difficulty: hard
check: go-out
par:
  kind: first-try
  value: 1
lesson:
  text: A channel passes values between goroutines. ch <- v sends and <-ch receives, and values come out in order. An unbuffered channel blocks until the other side is ready. A buffered one holds a few values without blocking.
  example: |-
    c := make(chan int, 1)
    c <- 5
    fmt.Println(<-c)   // 5
brief: Read this Go program and predict exactly what it prints.
goal: "Predict the output, then run: submit <the printed text>"
hints:
  - Two values are waiting when len runs.
  - They come out in the order they went in.
debrief:
  why: Channels are how goroutines talk safely, by handing over values instead of sharing memory.
  solution: submit 2 a b
  job: Pipelines and worker pools are built from channels.
teaches:
  - chan
  - <-
answer:
  accept:
    - 2 a b
go:
  program: |
    package main

    import (
    	"fmt"
    )

    func main() {
    	ch := make(chan string, 2)
    	ch <- "a"
    	ch <- "b"
    	fmt.Println(len(ch), <-ch, <-ch)
    }
