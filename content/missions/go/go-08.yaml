id: go-08
track: GO
skill: go
chapter: Functions
order: 8
title: Errors are values
from: Backend
difficulty: easy
check: go-code
par:
  kind: first-try
  value: 1
lesson:
  text: Go has no exceptions. A function that can fail returns an error as its last value, and nil means no error. You check it right away with if err != nil.
  example: "v, err := strconv.Atoi(text)\nif err != nil {\n\treturn\n}"
brief: Finish describe so a bad number comes back as "bad number" instead of carrying on with a useless value.
goal: Write the check in describe. Run tests compiles and runs your code with go test.
hints:
- err holds the failure, so look at it right after Atoi.
- if err != nil, return "bad number" before the last line runs.
debrief:
  why: Errors are ordinary values, so handling them is visible right where the failure happens.
  solution: "package main\n\nimport (\n\t\"fmt\"\n\t\"strconv\"\n)\n\nfunc describe(text string) string {\n\tn, err := strconv.Atoi(text)\n\tif err != nil {\n\t\treturn \"bad number\"\n\t}\n\tif n < 0 {\n\t\treturn \"negative\"\n\t}\n\treturn \"fine\"\n}\n\nfunc main() {\n\tfmt.Println(describe(\"abc\"))\n}\n"
  job: if err != nil is the most common line in Go.
teaches:
- err
- nil
- Atoi
- '!='
go:
  starter: "package main\n\nimport (\n\t\"fmt\"\n\t\"strconv\"\n)\n\nfunc describe(text string) string {\n\tn, err := strconv.Atoi(text)\n\t// Return \"bad number\" here if the conversion failed.\n\tif n < 0 {\n\t\treturn \"negative\"\n\t}\n\treturn \"fine\"\n}\n\nfunc main() {\n\tfmt.Println(describe(\"abc\"))\n}\n"
  test: "package main\n\nimport \"testing\"\n\nfunc TestDescribe(t *testing.T) {\n\tfor text, want := range map[string]string{\"abc\": \"bad number\", \"\": \"bad number\", \"42\": \"fine\", \"-7\": \"negative\"} {\n\t\tif got := describe(text); got != want {\n\t\t\tt.Errorf(\"describe(%q) = %q, wanted %q\", text, got, want)\n\t\t}\n\t}\n}\n"
