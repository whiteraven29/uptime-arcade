id: go-08
track: GO
skill: go
chapter: Functions
order: 8
title: Errors are values
from: Backend
difficulty: easy
check: go-fix
par:
  kind: first-try
  value: 1
lesson:
  text: Go has no exceptions. A function that can fail returns an error as its last value, and nil means no error. You check it right away with if err != nil.
  example: |-
    v, err := strconv.Atoi(text)
    if err != nil {
    	return
    }
brief: Finish the check so a bad number prints "bad number" instead of carrying on with a useless value.
goal: "Run: submit <the code that replaces ____>"
hints:
  - err holds the failure.
  - Compare it with nil.
debrief:
  why: Errors are ordinary values, so handling them is visible right where the failure happens.
  solution: submit err != nil
  job: if err != nil is the most common line in Go.
teaches:
  - err
  - nil
  - Atoi
  - "!="
answer:
  accept:
    - err != nil
    - nil != err
go:
  program: |
    package main

    import (
    	"fmt"
    	"strconv"
    )

    func main() {
    	n, err := strconv.Atoi("abc")
    	if ____ {
    		fmt.Println("bad number")
    		return
    	}
    	fmt.Println(n)
    }
  prints: bad number
