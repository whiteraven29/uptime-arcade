id: go-22
track: GO
skill: go
chapter: Errors and packages
order: 22
title: Exported names
from: Platform
difficulty: hard
check: go-code
par:
  kind: first-try
  value: 1
lesson:
  text: In Go a capital first letter means exported, so visible from other packages. A lowercase name is private to its package. That is why you call strings.ToUpper and never strings.toUpper.
  example: 'strings.ToLower("HI")   // works

    strings.toLower("HI")   // will not compile'
brief: shout should return its text in capitals, so "web" becomes "WEB". The strings package already has a function for this. Mind the capitals in its name.
goal: Finish shout. Run tests compiles and runs your code with go test.
hints:
- Exported names start with a capital letter.
- strings.ToUpper takes a string and returns the capitals.
debrief:
  why: 'Capitalisation is the whole visibility system in Go: no public or private keywords.'
  solution: "package main\n\nimport (\n\t\"fmt\"\n\t\"strings\"\n)\n\nfunc shout(text string) string {\n\treturn strings.ToUpper(text)\n}\n\nfunc main() {\n\tfmt.Println(shout(\"web\"))\n}\n"
  job: A lowercase field also silently vanishes from JSON output, which catches everyone once.
teaches:
- strings
- ToUpper
go:
  starter: "package main\n\nimport (\n\t\"fmt\"\n\t\"strings\"\n)\n\nfunc shout(text string) string {\n\t// Use the strings package here.\n\treturn strings.TrimSpace(text)\n}\n\nfunc main() {\n\tfmt.Println(shout(\"web\"))\n}\n"
  test: "package main\n\nimport \"testing\"\n\nfunc TestShout(t *testing.T) {\n\tfor text, want := range map[string]string{\"web\": \"WEB\", \"db-1\": \"DB-1\", \"\": \"\"} {\n\t\tif got := shout(text); got != want {\n\t\t\tt.Errorf(\"shout(%q) = %q, wanted %q\", text, got, want)\n\t\t}\n\t}\n}\n"
