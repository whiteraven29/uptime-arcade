id: go-12
track: GO
skill: go
chapter: Slices
order: 12
title: Copy safely
from: Backend
difficulty: medium
check: go-out
par:
  kind: first-try
  value: 1
lesson:
  text: make creates a slice of a given length. copy fills the destination up to the shorter length and returns how many items it copied, so it never grows anything.
  example: |-
    d := make([]int, 1)
    n := copy(d, []int{4, 5})   // n is 1
brief: Read this Go program and predict exactly what it prints.
goal: "Predict the output, then run: submit <the printed text>"
hints:
  - copy takes the shorter length.
  - It returns how many it copied.
debrief:
  why: copy never grows the destination, so size it first. It gives you data that is truly separate.
  solution: submit 2 [7 8]
  job: Buffer code uses this all the time.
teaches:
  - make
  - copy
answer:
  accept:
    - 2 [7 8]
go:
  program: |
    package main

    import (
    	"fmt"
    )

    func main() {
    	dst := make([]int, 2)
    	n := copy(dst, []int{7, 8, 9})
    	fmt.Println(n, dst)
    }
