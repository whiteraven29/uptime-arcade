title: Constants and iota
from: Platform
difficulty: easy
check: go-out
par:
  kind: first-try
  value: 1
lesson:
  text: const declares a value that can never change. Inside a const block iota counts up from 0, and lines left blank repeat the previous rule. It is how Go writes named levels.
  example: |-
    const (
    	Red = iota  // 0
    	Green       // 1
    )
brief: Read this Go program and predict exactly what it prints.
goal: "Predict the output, then run: submit <the printed text>"
hints:
  - iota starts at 0.
  - Each following line adds one.
debrief:
  why: iota gives a list of named numbers without typing each value, so inserting one cannot leave a duplicate.
  solution: submit 0 1 2
  job: Log levels and states are usually written with iota.
teaches:
  - const
  - iota
answer:
  accept:
    - 0 1 2
go:
  program: |
    package main

    import (
    	"fmt"
    )

    const (
    	Low = iota
    	Mid
    	High
    )

    func main() {
    	fmt.Println(Low, Mid, High)
    }
