    q: You just finished "Constants and iota". Which sentence best describes what it taught?
    options:
      - iota gives a list of named numbers without typing each value, so inserting one cannot leave a duplicate.
      - Explicit conversion means no surprise rounding, and the compiler catches type mix-ups for you.
      - package main and func main are where a Go program starts. Everything else is just the instructions inside.
      - Every variable starts at its type's zero value, so there's no undefined state.
    answer: iota gives a list of named numbers without typing each value, so inserting one cannot leave a duplicate.
