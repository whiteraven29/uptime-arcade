id: go-28
track: GO
skill: go
chapter: Concurrency
order: 28
title: Cancel work
from: Backend
difficulty: hard
check: go-out
par:
  kind: first-try
  value: 1
lesson:
  text: A context carries a deadline through your program. context.WithTimeout makes one that expires, and time.After is a channel that fires once after a delay. Its Done channel closes when time is up, and ctx.Err() says why. Always defer cancel().
  example: |-
    ctx, cancel := context.WithTimeout(context.Background(), time.Second)
    defer cancel()
    <-ctx.Done()
    fmt.Println(ctx.Err())
brief: Read this Go program and predict exactly what it prints.
goal: "Predict the output, then run: submit <the printed text>"
hints:
  - 10 milliseconds is much shorter than one second.
  - The message for a timeout is "context deadline exceeded".
debrief:
  why: Context lets a caller stop work it no longer needs, so a slow database cannot pile up requests forever.
  solution: submit context deadline exceeded
  job: Every Go server passes a context through each request.
teaches:
  - context
  - WithTimeout
  - Background
  - After
  - Err
answer:
  accept:
    - context deadline exceeded
go:
  program: |
    package main

    import (
    	"fmt"
    	"context"
    	"time"
    )

    func main() {
    	ctx, cancel := context.WithTimeout(context.Background(), 10*time.Millisecond)
    	defer cancel()
    	select {
    	case <-ctx.Done():
    		fmt.Println(ctx.Err())
    	case <-time.After(time.Second):
    		fmt.Println("finished")
    	}
    }
