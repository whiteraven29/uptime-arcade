title: Interfaces
from: Backend
difficulty: medium
check: go-out
par:
  kind: first-try
  value: 1
lesson:
  text: An interface lists methods. Any type that has those methods satisfies it automatically, with no declaration, so code can work with many types through one name.
  example: |-
    type Namer interface {
    	Name() string
    }
brief: Read this Go program and predict exactly what it prints.
goal: "Predict the output, then run: submit <the printed text>"
hints:
  - Both types have Ping, so both count as Pinger.
  - Print separates its two values only as written here.
debrief:
  why: Satisfaction is implicit, so you can define an interface where it is used and existing types just fit.
  solution: submit web ok db ok done
  job: io.Reader and error are interfaces you will use every day.
teaches:
  - interface
answer:
  accept:
    - web ok db ok done
go:
  program: |
    package main

    import (
    	"fmt"
    )

    type Pinger interface {
    	Ping() string
    }

    type Web struct{}

    func (Web) Ping() string { return "web ok" }

    type DB struct{}

    func (DB) Ping() string { return "db ok" }

    func main() {
    	for _, p := range []Pinger{Web{}, DB{}} {
    		fmt.Print(p.Ping(), " ")
    	}
    	fmt.Println("done")
    }
