    level: easy
    label: The main idea
    q: You just finished "Structs". Which sentence best describes what it taught?
    options:
      - copy never grows the destination, so size it first. It gives you data that is truly separate.
      - Strings are bytes, so convert to runes when you need characters.
      - Structs bundle related data under one name, like a class without the ceremony.
      - A slice is a pointer, a length and a capacity. With room left, append overwrites. Use a[:2:2] to force a copy.
    answer: Structs bundle related data under one name, like a class without the ceremony.
    hint: Look for the sentence about type and struct.
