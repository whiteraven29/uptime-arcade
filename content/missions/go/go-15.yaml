id: go-15
track: GO
skill: go
chapter: Types
order: 15
title: Structs
from: Backend
difficulty: medium
check: go-out
par:
  kind: first-try
  value: 1
lesson:
  text: type and struct define your own group of named fields. Create one with a literal, and read or change fields with a dot.
  example: |-
    type Pet struct {
    	Name string
    }
    p := Pet{Name: "Rex"}
    p.Name = "Max"
brief: Read this Go program and predict exactly what it prints.
goal: "Predict the output, then run: submit <the printed text>"
hints:
  - Port starts at 80.
  - The next line changes it.
debrief:
  why: Structs bundle related data under one name, like a class without the ceremony.
  solution: submit web 8080
  job: Every API request and config in Go is a struct.
teaches:
  - type
  - struct
answer:
  accept:
    - web 8080
go:
  program: |
    package main

    import (
    	"fmt"
    )

    type Server struct {
    	Name string
    	Port int
    }

    func main() {
    	s := Server{Name: "web", Port: 80}
    	s.Port = 8080
    	fmt.Println(s.Name, s.Port)
    }
rewind:
