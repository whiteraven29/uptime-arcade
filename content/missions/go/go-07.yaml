id: go-07
track: GO
skill: go
chapter: Functions
order: 7
title: Many returns
from: Backend
difficulty: easy
check: go-out
par:
  kind: first-try
  value: 1
lesson:
  text: A Go function can return several values. List the types in brackets after the parameters, and unpack them at the call. Between ints, / drops the remainder and % gives it.
  example: |-
    func split() (int, string) {
    	return 1, "a"
    }
    n, s := split()
brief: Read this Go program and predict exactly what it prints.
goal: "Predict the output, then run: submit <the printed text>"
hints:
  - 17 / 5 between ints is 3.
  - 17 % 5 is the remainder.
debrief:
  why: Multiple returns remove the need for special out-parameters, and they make error handling possible.
  solution: submit 3 2
  job: Almost all Go functions return a value and an error.
teaches:
  - return
  - "%"
  - /
answer:
  accept:
    - 3 2
go:
  program: |
    package main

    import (
    	"fmt"
    )

    func divmod(a, b int) (int, int) {
    	return a / b, a % b
    }

    func main() {
    	q, r := divmod(17, 5)
    	fmt.Println(q, r)
    }
