  - type: mc
    level: easy
    label: The main idea
    q: You just finished "Close and drain". Which sentence best describes what it taught?
    options:
      - Channels are how goroutines talk safely, by handing over values instead of sharing memory.
      - Satisfaction is implicit, so you can define an interface where it is used and existing types just fit.
      - Closing doesn't throw away buffered values. Without close, this loop would deadlock.
      - Deferred calls stack up and run in reverse order, so cleanup unwinds in the opposite order to setup.
    answer: Closing doesn't throw away buffered values. Without close, this loop would deadlock.
