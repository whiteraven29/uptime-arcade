title: Close and drain
from: Backend
difficulty: hard
check: go-out
par:
  kind: first-try
  value: 1
lesson:
  text: close says no more values are coming. range on a channel reads what is left and then stops. Without close, that loop would wait forever.
  example: |-
    c := make(chan int, 2)
    c <- 1
    close(c)
    for v := range c {
    	fmt.Print(v)
    }
brief: Read this Go program and predict exactly what it prints.
goal: "Predict the output, then run: submit <the printed text>"
hints:
  - The buffer holds 3, so sends do not block.
  - range on a closed channel reads what is left.
debrief:
  why: Closing doesn't throw away buffered values. Without close, this loop would deadlock.
  solution: submit 14 0
  job: Worker pools use send, close and range.
teaches:
  - close
answer:
  accept:
    - 14 0
go:
  program: |
    package main

    import (
    	"fmt"
    )

    func main() {
    	ch := make(chan int, 3)
    	for i := 1; i <= 3; i++ {
    		ch <- i * i
    	}
    	close(ch)
    	sum := 0
    	for v := range ch {
    		sum += v
    	}
    	fmt.Println(sum, len(ch))
    }
