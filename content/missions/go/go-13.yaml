id: go-13
track: GO
skill: go
chapter: Maps and text
order: 13
title: Look up with comma-ok
from: Backend
difficulty: medium
check: go-out
par:
  kind: first-try
  value: 1
lesson:
  text: A map stores keys and values. Reading a missing key gives the zero value and adds nothing. v, ok := m[k] also tells you if it exists. m[k]++ creates the key. A nil map can be read, but writing to one crashes.
  example: |-
    m := map[string]int{}
    v, ok := m["z"]   // 0 false
brief: Read this Go program and predict exactly what it prints.
goal: "Predict the output, then run: submit <the printed text>"
hints:
  - Reading a missing key gives zero and adds nothing.
  - ++ does create the key.
debrief:
  why: Maps return the zero value for missing keys, so counting needs no setup. Comma-ok tells zero from missing.
  solution: submit 2 0 false
  job: Go counters rely on this.
teaches:
  - map
  - ok
answer:
  accept:
    - 2 0 false
go:
  program: |
    package main

    import (
    	"fmt"
    )

    func main() {
    	hits := map[string]int{"a": 2}
    	hits["b"]++
    	v, ok := hits["c"]
    	fmt.Println(len(hits), v, ok)
    }
