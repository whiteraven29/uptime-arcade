title: The nil that isn't nil
from: Backend
difficulty: medium
check: go-out
par:
  kind: first-try
  value: 1
lesson:
  text: An interface holds a type and a value. It equals nil only when both are empty, so a nil pointer inside it is not nil. error is itself an interface.
  example: |-
    var p *T
    var i any = p
    // i holds the type *T and a nil value
brief: Read this Go program and predict exactly what it prints.
goal: "Predict the output, then run: submit <the printed text>"
hints:
  - An interface holds a type and a value.
  - It's nil only when both are nil.
debrief:
  why: The interface holds type *E with a nil value, so it isn't nil. Return plain nil on success.
  solution: submit false
  job: A famous Go trap that passes error checks wrongly.
teaches:
  - error
answer:
  accept:
    - "false"
go:
  program: |
    package main

    import (
    	"fmt"
    )

    type E struct{}

    func (*E) Error() string { return "e" }

    func run() error {
    	var p *E
    	return p
    }

    func main() {
    	fmt.Println(run() == nil)
    }
