title: Table tests
from: Platform
difficulty: expert
check: go-out
par:
  kind: first-try
  value: 1
lesson:
  text: "Go tests live in _test.go files and use the testing package. The common style is a table: a slice of cases, each with a name, an input and the wanted result, run in a loop. Adding a case is one more line."
  example: |-
    for _, c := range cases {
    	if got := f(c.in); got != c.want {
    		t.Errorf("%s failed", c.name)
    	}
    }
brief: Read this Go program and predict exactly what it prints.
goal: "Predict the output, then run: submit <the printed text>"
hints:
  - Work out double for each input.
  - Which row has a wrong want?
debrief:
  why: Table tests separate the data from the logic, so covering a new edge case takes one line.
  solution: submit FAIL three
  job: Most Go tests you read are written this way.
teaches:
  - table
  - testing
answer:
  accept:
    - FAIL three
go:
  program: |
    package main

    import (
    	"fmt"
    )

    func double(x int) int { return x + x }

    func main() {
    	cases := []struct {
    		name    string
    		in, want int
    	}{
    		{"one", 1, 2},
    		{"two", 2, 4},
    		{"three", 3, 7},
    	}
    	for _, c := range cases {
    		if got := double(c.in); got != c.want {
    			fmt.Println("FAIL", c.name)
    		}
    	}
    }
