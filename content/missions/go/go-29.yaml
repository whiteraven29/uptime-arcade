  - type: mc
    level: easy
    label: The main idea
    q: You just finished "Table tests". Which sentence best describes what it taught?
    options:
      - default makes a channel operation non-blocking, and time.After is how you stop waiting forever.
      - Table tests separate the data from the logic, so covering a new edge case takes one line.
      - Closing doesn't throw away buffered values. Without close, this loop would deadlock.
      - Context lets a caller stop work it no longer needs, so a slow database cannot pile up requests forever.
    answer: Table tests separate the data from the logic, so covering a new edge case takes one line.
