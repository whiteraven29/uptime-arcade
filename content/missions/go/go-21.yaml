id: go-21
track: GO
skill: go
chapter: Errors and packages
order: 21
title: Wrap and inspect
from: Backend
difficulty: hard
check: go-out
par:
  kind: first-try
  value: 1
lesson:
  text: errors.New makes a simple error. fmt.Errorf with %w wraps one, adding context and keeping the original inside. errors.Is looks through the wrapping, which == cannot do.
  example: |-
    e := fmt.Errorf("read: %w", ErrX)
    errors.Is(e, ErrX)   // true
brief: Read this Go program and predict exactly what it prints.
goal: "Predict the output, then run: submit <the printed text>"
hints:
  - "%w wraps the original."
  - errors.Is unwraps the chain.
debrief:
  why: Wrapping adds context without losing the original, so use errors.Is rather than ==.
  solution: "submit false true db: down"
  job: This is the standard Go error pattern.
teaches:
  - Errorf
  - "%w"
  - errors
  - New
  - Is
answer:
  accept:
    - "false true db: down"
go:
  program: |
    package main

    import (
    	"fmt"
    	"errors"
    )

    var ErrDown = errors.New("down")

    func main() {
    	err := fmt.Errorf("db: %w", ErrDown)
    	fmt.Println(err == ErrDown, errors.Is(err, ErrDown), err)
    }
