id: go-11
track: GO
skill: go
chapter: Slices
order: 11
title: The slice that changed by itself
from: Backend
difficulty: medium
check: go-out
par:
  kind: first-try
  value: 1
lesson:
  text: a[:2] is a view of the first two items, sharing memory with a. len is how many it holds and cap is how far it could grow. append writes in place when the array has spare room.
  example: |-
    a := []int{1, 2, 3}
    b := a[:1]
    b = append(b, 7)   // a[1] is now 7
brief: Read this Go program and predict exactly what it prints.
goal: "Predict the output, then run: submit <the printed text>"
hints:
  - b shares a's array.
  - append writes in place when capacity allows.
debrief:
  why: A slice is a pointer, a length and a capacity. With room left, append overwrites. Use a[:2:2] to force a copy.
  solution: submit 99 3 4
  job: This is one of the commonest real Go bugs.
teaches:
  - len
  - cap
  - "[:"
answer:
  accept:
    - 99 3 4
go:
  program: |
    package main

    import (
    	"fmt"
    )

    func main() {
    	a := []int{1, 2, 3, 4}
    	b := a[:2]
    	b = append(b, 99)
    	fmt.Println(a[2], len(b), cap(b))
    }
