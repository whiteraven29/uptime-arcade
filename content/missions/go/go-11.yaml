    label: The main idea
    q: You just finished "The slice that changed by itself". Which sentence best describes what it taught?
    options:
      - Multiple returns remove the need for special out-parameters, and they make error handling possible.
      - A slice is a pointer, a length and a capacity. With room left, append overwrites. Use a[:2:2] to force a copy.
      - One loop keyword with a few shapes means less to remember. range is the one you use most.
      - Arrays are values and slices are views. That one difference explains most slice surprises.
    answer: A slice is a pointer, a length and a capacity. With room left, append overwrites. Use a[:2:2] to force a copy.
