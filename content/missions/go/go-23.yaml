id: go-23
track: GO
skill: go
chapter: Concurrency
order: 23
title: Goroutines
from: Platform
difficulty: hard
check: go-out
par:
  kind: first-try
  value: 1
lesson:
  text: go in front of a call runs it at the same time as the rest of the program, as a goroutine. When main ends the whole program ends, even with goroutines still running. Sleep here only keeps main alive long enough, and later missions show the proper way.
  example: |-
    go work()
    time.Sleep(time.Second)
    time.Sleep(100 * time.Millisecond)
brief: Read this Go program and predict exactly what it prints.
goal: "Predict the output, then run: submit <the printed text>"
hints:
  - The goroutine starts while main is sleeping.
  - Without the Sleep, main could exit before it printed.
debrief:
  why: Goroutines are cheap to start, but main does not wait for them. That is the first concurrency trap.
  solution: submit worker main
  job: Servers run each request in its own goroutine.
teaches:
  - go
  - time
  - Sleep
  - Millisecond
  - Second
answer:
  accept:
    - worker main
go:
  program: |
    package main

    import (
    	"fmt"
    	"time"
    )

    func main() {
    	go fmt.Print("worker ")
    	time.Sleep(100 * time.Millisecond)
    	fmt.Println("main")
    }
