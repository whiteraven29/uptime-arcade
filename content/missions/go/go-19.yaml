id: go-19
track: GO
skill: go
chapter: Cleanup
order: 19
title: defer order
from: Platform
difficulty: medium
check: go-out
par:
  kind: first-try
  value: 1
lesson:
  text: defer delays a call until the function ends. Several defers run last in, first out. Its arguments are worked out right away, and only the call waits.
  example: |-
    defer fmt.Print("b")
    defer fmt.Print("a")
    // prints ab
brief: Read this Go program and predict exactly what it prints.
goal: "Predict the output, then run: submit <the printed text>"
hints:
  - defer runs when the function returns.
  - Last in, first out.
debrief:
  why: Deferred calls stack up and run in reverse order, so cleanup unwinds in the opposite order to setup.
  solution: submit done 2 1 0
  job: defer closes files and releases locks.
teaches:
  - defer
answer:
  accept:
    - done 2 1 0
go:
  program: |
    package main

    import (
    	"fmt"
    )

    func main() {
    	for i := 0; i < 3; i++ {
    		defer fmt.Print(i, " ")
    	}
    	fmt.Print("done ")
    }
