id: go-03
track: GO
skill: go
chapter: Basics
order: 3
title: Types and conversion
from: Platform
difficulty: easy
check: go-out
par:
  kind: first-try
  value: 1
lesson:
  text: "Go never converts types silently, so an int and a float64 cannot be multiplied until you convert one: float64(x). strconv.Itoa turns an int into its text form, and + joins strings."
  example: |-
    n := 2
    fmt.Println(float64(n) / 4)      // 0.5
    fmt.Println(strconv.Itoa(n) + "x") // 2x
brief: Read this Go program and predict exactly what it prints.
goal: "Predict the output, then run: submit <the printed text>"
hints:
  - float64(3) is 3.0, and 3.0 times 1.5 is 4.5.
  - Itoa gives the text "3", and + adds the !.
debrief:
  why: Explicit conversion means no surprise rounding, and the compiler catches type mix-ups for you.
  solution: submit 4.5 3!
  job: Numbers arriving as text must be converted before any maths.
teaches:
  - float64
  - strconv
  - Itoa
answer:
  accept:
    - 4.5 3!
go:
  program: |
    package main

    import (
    	"fmt"
    	"strconv"
    )

    func main() {
    	x := 3
    	y := 1.5
    	fmt.Println(float64(x)*y, strconv.Itoa(x)+"!")
    }
