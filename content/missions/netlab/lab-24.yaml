    from: DESK-1
    to: SRV-1
rewind:
- type: mc
  level: easy
  label: The main idea
  q: What does port security do?
  options:
  - Limits which or how many machines can use a port
  - Encrypts the port
  - Speeds it up
  - Adds VLANs
  answer: Limits which or how many machines can use a port
  hint: It's about who.
- type: mc
  level: medium
  label: The result
  q: What state does a port show after a violation?
  options:
  - err-disabled
  - FULL
  - QM_IDLE
  - forwarding
  answer: err-disabled
  hint: Error, disabled.
- type: text
  level: medium
  label: The word
  q: Which word sets how many machines are allowed? It follows port-security.
  answer:
  - maximum
  hint: The most.
- type: mc
  level: medium
  label: Mode
  q: What port mode does this lab's port security need?
  options:
  - access
  - trunk
  - routed
  - tunnel
  answer: access
  hint: One device.
- type: mc
  level: hard
  label: Reasoning
  q: Why is a rogue switch a risk, even if it's just convenience?
  options:
  - It adds unknown machines and can create loops
  - It adds encryption
  - It makes DNS slower only
  - It renames VLANs
  answer: It adds unknown machines and can create loops
  hint: Unknown and uncontrolled.
