id: lab-24
track: LAB
skill: networking
chapter: Security
order: 24
title: Stop the rogue switch
from: Security
difficulty: hard
check: net
requires: net-44
par:
  kind: commands
  value: 16
lesson:
  text: Port security limits who can use a switch port. Set switchport mode access, turn it on with switchport port-security, and limit it with switchport port-security maximum. If too many machines appear, or the wrong one, the port shuts itself and shows err-disabled. spanning-tree bpduguard enable shuts a port if a switch appears on it at all. Check with show port-security.
  example: |-
    interface Gi0/3
     switchport mode access
     switchport port-security
     switchport port-security maximum 1
     spanning-tree bpduguard enable
brief: Someone plugged a cheap mini switch into the meeting room's port on Gi0/3, and two laptops are sharing it. Policy is one machine per wall port. Meanwhile, the desk on Gi0/1 must keep working.
goal: The meeting room port shuts itself down, and the desk keeps working.
hints:
- Security only works on an access port.
- switchport port-security, then maximum 1.
debrief:
  why: A port that knows how many machines to expect can close itself the moment someone adds more. It stops rogue switches and much casual snooping.
  solution: |-
    [SW1]
    enable
    configure terminal
    interface Gi0/3
    switchport mode access
    switchport port-security
    switchport port-security maximum 1
    end
    show port-security
  job: It's a standard item in network access policies, especially for ports in public rooms.
teaches:
- switchport port-security
- show port-security
- spanning-tree bpduguard
