id: lab-33
track: LAB
skill: networking
chapter: Capstones
order: 43
title: 'Design day: build the branch'
from: CTO
difficulty: expert
check: net
requires: net-08
par:
  kind: commands
  value: 122
lesson:
  text: 'Designing a site means choosing before configuring. Size each subnet first, with the largest group first, and write the plan down. Then build from the bottom up: VLANs and ports, then gateways, then DHCP, then rules, then the way out. This lab uses what you''ve built so far. A /25 holds 126 hosts, a /27 holds 30 and a /28 holds 14.'
  example: |-
    10.80.0.0/24
      Staff    100 hosts  /25
      Servers   25 hosts  /27
      Mgmt      10 hosts  /28
brief: 'New Kisumu branch, opening Monday. You have 10.50.0.0/24 to split between three VLANs: 10 Staff (100 hosts), 20 Servers (25 hosts), and 30 Mgmt (10 hosts). R1 is a router on a stick on SW1''s Gi0/8. Staff get addresses by DHCP. Staff must not reach Mgmt. Everyone shares 203.0.113.2 to get out. Choose your subnets carefully, because no address is spare. Nothing is cabled in the new branch yet: use Gi0/1 for Staff, Gi0/2 for Servers and Gi0/3 for Mgmt.'
goal: The branch works, as designed.
hints:
- 'Biggest first: /25 for Staff, then /27 for Servers at .128, then /28 for Mgmt at .160.'
- 'Build it in layers: switch, gateways, DHCP, ACL, NAT, then hosts.'
debrief:
  why: 'A design is a set of decisions you can check: sizes that fit, no overlaps, least access, one way out. Building it in layers means each step can be tested before the next.'
  solution: |-
    [cable] STAFF-1 eth0 SW1 Gi0/1
    [cable] APP-1 eth0 SW1 Gi0/2
    [cable] MGMT-1 eth0 SW1 Gi0/3
    [cable] R1 Gi0/0 SW1 Gi0/8
    [SW1]
    enable
    configure terminal
    vlan 10
    name STAFF
    vlan 20
    name SERVERS
    vlan 30
    name MGMT
    interface Gi0/1
    switchport mode access
    switchport access vlan 10
    interface Gi0/2
    switchport mode access
    switchport access vlan 20
    interface Gi0/3
    switchport mode access
    switchport access vlan 30
    interface Gi0/8
    switchport mode trunk
    switchport trunk allowed vlan 10,20,30
    end
    [R1]
    enable
    configure terminal
    interface Gi0/0
    no shutdown
    interface Gi0/0.10
    encapsulation dot1q 10
    ip address 10.50.0.1 255.255.255.128
    ip nat inside
    ip access-group STAFF in
    interface Gi0/0.20
    encapsulation dot1q 20
    ip address 10.50.0.129 255.255.255.224
    ip nat inside
    interface Gi0/0.30
    encapsulation dot1q 30
    ip address 10.50.0.161 255.255.255.240
    ip nat inside
    interface Gi0/1
    ip nat outside
    exit
    ip dhcp excluded-address 10.50.0.1 10.50.0.9
    ip dhcp pool STAFF
    network 10.50.0.0 255.255.255.128
    default-router 10.50.0.1
    exit
    ip access-list extended STAFF
    deny ip 10.50.0.0 0.0.0.127 10.50.0.160 0.0.0.15
    permit ip any any
    exit
    access-list 1 permit 10.50.0.0 0.0.0.255
    ip nat inside source list 1 interface Gi0/1 overload
    end
    copy running-config startup-config
    [STAFF-1]
    dhclient eth0
    [APP-1]
    ip addr add 10.50.0.130/27 dev eth0
    ip route add default via 10.50.0.129
    [MGMT-1]
    ip addr add 10.50.0.162/28 dev eth0
    ip route add default via 10.50.0.161
  job: This is what a new-site project looks like, from an address block to a working branch.
teaches:
- capstone
lab:
  devices:
  - name: STAFF-1
    kind: pc
    x: 10
    y: 75
    config: ''
  - name: APP-1
    kind: server
    x: 30
    y: 92
    config: service http start
  - name: MGMT-1
    kind: pc
    x: 55
    y: 92
    config: ''
  - name: SW1
    kind: switch
    x: 32
    y: 55
    ports: 8
    config: ''
  - name: R1
    kind: router
    x: 42
    y: 22
    config: |-
      interface Gi0/1
       ip address 203.0.113.2 255.255.255.0
       no shutdown
      ip route 0.0.0.0 0.0.0.0 203.0.113.1
  - name: ISP
    kind: router
    x: 70
    y: 22
    locked: true
    config: |-
      interface Gi0/0
       ip address 203.0.113.1 255.255.255.0
       no shutdown
      interface Gi0/1
       ip address 198.51.100.1 255.255.255.0
       no shutdown
  - name: INTERNET
    kind: server
    x: 92
    y: 22
    locked: true
    config: |-
      ip addr add 198.51.100.10/24 dev eth0
      ip route add default via 198.51.100.1
      service http start
  cables:
  - - R1
    - Gi0/1
    - ISP
    - Gi0/0
  - - INTERNET
    - eth0
    - ISP
    - Gi0/1
  cabling: true
expect:
- label: The Staff subnet holds 100 hosts, inside the block
  fits:
    device: R1
    interface: Gi0/0.10
    hosts: 100
    within: 10.50.0.0/24
- label: The Servers subnet holds 25 hosts, and isn't oversized
  fits:
    device: R1
    interface: Gi0/0.20
    hosts: 25
    within: 10.50.0.0/24
    max_len: 27
- label: The Mgmt subnet holds 10 hosts, and isn't oversized
  fits:
    device: R1
    interface: Gi0/0.30
    hosts: 10
    within: 10.50.0.0/24
    max_len: 28
- label: The three subnets don't overlap
  no_overlap:
    interfaces:
    - - R1
      - Gi0/0.10
    - - R1
      - Gi0/0.20
    - - R1
      - Gi0/0.30
- label: STAFF-1 got its address by DHCP
  dhcp:
    host: STAFF-1
    in: 10.50.0.0/24
- label: Staff reach the app server
  reach:
    from: STAFF-1
    to: APP-1
    proto: tcp
    port: 80
- label: Staff can't reach Mgmt
  reach:
    from: STAFF-1
    to: MGMT-1
    expect: blocked
- label: Mgmt reach the app server
  reach:
    from: MGMT-1
    to: APP-1
    proto: tcp
    port: 80
- label: Staff reach the internet
  reach:
    from: STAFF-1
    to: INTERNET
    proto: tcp
    port: 80
- label: It's all saved
  saved:
    device: R1
rewind:
- type: mc
  level: easy
  label: The main idea
  q: When carving a block, which subnet do you place first?
  options:
  - The largest
  - The smallest
  - The Mgmt one always
  - It makes no difference
  answer: The largest
  hint: Biggest first keeps them aligned.
- type: mc
  level: medium
  label: Sizing
  q: Which prefix fits 100 hosts with the fewest spare addresses?
  options:
  - /25
  - /24
  - /26
  - /27
  answer: /25
  hint: 126 hosts.
- type: mc
  level: medium
  label: Sizing
  q: How many hosts fit in a /27?
  options:
  - '30'
  - '62'
  - '14'
  - '254'
  answer: '30'
  hint: 32 minus 2.
- type: order
  level: medium
  label: Order them
  q: Put the build in order.
  scrambled:
  - DHCP and rules
  - VLANs and ports
  - The way out
  - Gateways
  answer:
  - VLANs and ports
  - Gateways
  - DHCP and rules
  - The way out
  hint: Bottom up.
- type: mc
  level: hard
  label: Reasoning
  q: Why not give every VLAN a /25, to be safe?
  options:
  - Only two /25s fit in a /24, so the third would have nowhere to go
  - It would be slower
  - VLANs can't be /25
  - DHCP forbids it
  answer: Only two /25s fit in a /24, so the third would have nowhere to go
  hint: Do the maths.
