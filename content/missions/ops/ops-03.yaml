id: ops-03
track: OPS
skill: python
chapter: First shifts
order: 3
title: Subnet planner
from: Infrastructure
difficulty: medium
check: ops
par:
  kind: first-try
  value: 1
requires_all:
- py-14
- lab-12
lesson:
  text: A /n network has 2 ** (32 - n) addresses, and two of them are reserved, so it holds 2 ** (32 - n) - 2 hosts. A short loop can find the smallest network that fits, which stops people guessing.
  example: |-
    n = 30
    while 2 ** (32 - n) - 2 < 10:
        n -= 1
    print(n)  # 28
brief: A new team needs its own VLAN. Work out the right size in code, then build the routing in the lab.
goal: Write the sizing function, then set up the router.
hints:
- Start at /30 and make the network bigger until the hosts fit.
- In the lab, each VLAN gets a sub-interface.
debrief:
  why: A function gets this right every time, which matters when you plan dozens of networks.
  solution: |-
    # Size the network
    def prefix_for(hosts):
        n = 30
        while 2 ** (32 - n) - 2 < hosts:
            n -= 1
        return n


    # Route the VLANs
    [cable] R1 Gi0/0 SW1 Gi0/8
    [SW1]
    enable
    configure terminal
    interface Gi0/8
    switchport mode trunk
    end
    [R1]
    enable
    configure terminal
    interface Gi0/0
    no shutdown
    interface Gi0/0.10
    encapsulation dot1q 10
    ip address 10.40.10.1 255.255.255.0
    interface Gi0/0.20
    encapsulation dot1q 20
    ip address 10.40.20.1 255.255.255.0
    end
  job: Planning subnets in code is how large networks avoid running out of room.
teaches:
- subnet
stages:
- title: Size the network
  check: py
  brief: prefix_for(hosts) returns the longest prefix whose subnet can hold that many hosts. 10 hosts need a /28, and 2 hosts need a /30.
  goal: Write prefix_for(hosts). Tests run when you press Run tests.
  python:
    starter: |
      def prefix_for(hosts):
          # your code here
          pass
    tests:
    - expr: prefix_for(2)
      want: '30'
    - expr: prefix_for(10)
      want: '28'
    - expr: prefix_for(50)
      want: '26'
    - expr: prefix_for(200)
      want: '24'
  solution: |
    def prefix_for(hosts):
        n = 30
        while 2 ** (32 - n) - 2 < hosts:
            n -= 1
        return n
- title: Route the VLANs
  check: net
  brief: The plan fits. Now connect the VLANs. The printer lives in VLAN 20 and Staff in VLAN 10, and now they need to reach it. R1 needs one cable, to SW1's Gi0/8. Gateways should be 10.40.10.1 and 10.40.20.1. That cable isn't in yet.
  goal: A Staff PC can reach the printer through R1.
  lab:
    devices:
    - name: STAFF-1
      kind: pc
      x: 15
      y: 75
      config: 'ip addr add 10.40.10.10/24 dev eth0

        ip route add default via 10.40.10.1'
    - name: SW1
      kind: switch
      x: 50
      y: 60
      ports: 8
      config: "vlan 10\nvlan 20\ninterface Gi0/1\n switchport access vlan 10\ninterface Gi0/2\n switchport access vlan 20"
    - name: PRINTER
      kind: server
      x: 85
      y: 75
      config: 'ip addr add 10.40.20.10/24 dev eth0

        ip route add default via 10.40.20.1'
    - name: R1
      kind: router
      x: 50
      y: 15
      config: ''
    cables:
    - - STAFF-1
      - eth0
      - SW1
      - Gi0/1
    - - PRINTER
      - eth0
      - SW1
      - Gi0/2
    cabling: true
  expect:
  - label: The switch port to R1 is a trunk
    config:
      device: SW1
      interface: Gi0/8
      contains: switchport mode trunk
  - label: Staff can reach the printer
    reach:
      from: STAFF-1
      to: PRINTER
  - label: R1 knows both networks
    route:
      device: R1
      to: 10.40.20.10
  solution: |-
    [cable] R1 Gi0/0 SW1 Gi0/8
    [SW1]
    enable
    configure terminal
    interface Gi0/8
    switchport mode trunk
    end
    [R1]
    enable
    configure terminal
    interface Gi0/0
    no shutdown
    interface Gi0/0.10
    encapsulation dot1q 10
    ip address 10.40.10.1 255.255.255.0
    interface Gi0/0.20
    encapsulation dot1q 20
    ip address 10.40.20.1 255.255.255.0
    end
rewind:
- type: mc
  level: easy
  label: The main idea
  q: How many usable hosts does a /28 hold?
  options:
  - '16'
  - '28'
  - '14'
  - '6'
  answer: '14'
  hint: 2 ** (32 - 28) minus 2.
- type: mc
  level: easy
  label: The maths
  q: Why subtract 2 from the address count?
  options:
  - Routers always take two.
  - It leaves room for growth.
  - The network and broadcast addresses cannot be given to hosts.
  - IPv4 needs two spare bits.
  answer: The network and broadcast addresses cannot be given to hosts.
  hint: Two addresses in every subnet are reserved.
- type: mc
  level: medium
  label: The lab
  q: What does router on a stick mean?
  options:
  - A router with no cables.
  - One physical link carries several VLANs to a router, using sub-interfaces.
  - A router that only handles one VLAN.
  - A backup router in a cupboard.
  answer: One physical link carries several VLANs to a router, using sub-interfaces.
  hint: One cable, many VLANs.
- type: order
  level: medium
  label: Put it in order
  q: This incident was worked through in stages. Tap them from first to last.
  scrambled:
  - Route the VLANs
  - Size the network
  answer:
  - Size the network
  - Route the VLANs
  hint: 'It started with: Size the network.'
- type: mc
  level: hard
  label: On the job
  q: A team of 50 is growing fast. Which is the better plan?
  options:
  - Use the smallest that fits today, a /26, and never change it.
  - Give them a /8.
  - Share an existing VLAN.
  - Leave room to grow, for example a /25 instead of a tight /26.
  answer: Leave room to grow, for example a /25 instead of a tight /26.
  hint: Renumbering later is painful.
