    Nov 6 09:06 DISCOVER de:ad:be:ef:00:07 floor-2
    Nov 6 09:07 DISCOVER aa:11:22:33:44:01 floor-2
    Nov 6 09:08 DISCOVER de:ad:be:ef:00:07 floor-2
