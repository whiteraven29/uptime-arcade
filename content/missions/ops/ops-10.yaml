id: ops-10
track: OPS
skill: networking
chapter: On the rota
order: 10
title: Certificate sweep
from: Security
difficulty: medium
check: ops
par:
  kind: first-try
  value: 1
requires_all:
- sh-14
- net-27
- py-22
lesson:
  text: A certificate that expires takes a site down with no warning, and every browser shows a scary error. Teams watch expiry dates and renew early. Subtracting two datetime values gives a span of time, and its .days says how far apart they are.
  example: |-
    from datetime import datetime
    gap = datetime(2026, 12, 1) - datetime(2026, 11, 21)
    print(gap.days)  # 10
brief: Last year an expired certificate took the shop down on a Saturday. Find the next one to expire, then write the check that warns in time.
goal: Find the soonest expiry, then compute days left in Python.
hints:
- Sort ~/ops/certs.txt by its date column.
- Subtract the datetimes, then use .days.
debrief:
  why: Dates written as year-month-day sort correctly as plain text, which is why the shell can do half of this job.
  solution: |
    # Find the next to expire
    sort -k2 ops/certs.txt | head -1
    submit shop.corp.test

    # Warn in time
    from datetime import datetime

    def days_left(expiry, today):
        return (expiry - today).days
  job: Expired certificates cause surprisingly large outages, so most teams automate this exact check.
teaches:
- expiry
stages:
- title: Find the next to expire
  check: answer
  brief: ~/ops/certs.txt lists each site and its expiry date, as year-month-day.
  goal: 'Run: submit <the site that expires first>'
  answer:
    accept:
    - shop.corp.test
  solution: |-
    sort -k2 ops/certs.txt | head -1
    submit shop.corp.test
- title: Warn in time
  check: py
  brief: days_left(expiry, today) returns how many whole days are left.
  goal: Write days_left(expiry, today). Tests run when you press Run tests.
  python:
    starter: |
      from datetime import datetime

      def days_left(expiry, today):
          # your code here
          pass
    tests:
    - expr: days_left(datetime(2026, 12, 1), datetime(2026, 11, 21))
      want: '10'
    - expr: days_left(datetime(2026, 11, 21), datetime(2026, 11, 21))
      want: '0'
    - expr: days_left(datetime(2026, 11, 1), datetime(2026, 11, 21))
      want: '-20'
  solution: |
    from datetime import datetime

    def days_left(expiry, today):
        return (expiry - today).days
rewind:
- type: mc
  level: easy
  label: The main idea
  q: What happens when a site certificate expires?
  options:
  - Nothing at all.
  - Browsers show an error and users cannot get in safely.
  - The site gets faster.
  - The password resets.
  answer: Browsers show an error and users cannot get in safely.
  hint: Think of the scary browser warning.
- type: mc
  level: easy
  label: The sort
  q: Why do year-month-day dates sort correctly as text?
  options:
  - Text sorting knows about dates.
  - All dates are the same length in days.
  - sort has a calendar in it.
  - The most significant part comes first.
  answer: The most significant part comes first.
  hint: Read them from left to right.
- type: mc
  level: medium
  label: The code
  q: What do you get when you subtract two datetime values?
  options:
  - A new date.
  - A string.
  - A span of time, with a .days value.
  - An error.
  answer: A span of time, with a .days value.
  hint: It is called a timedelta.
- type: order
  level: medium
  label: Put it in order
  q: This incident was worked through in stages. Tap them from first to last.
  scrambled:
  - Warn in time
  - Find the next to expire
  answer:
  - Find the next to expire
  - Warn in time
  hint: 'It started with: Find the next to expire.'
- type: mc
  level: hard
  label: On the job
  q: Why renew a certificate weeks before it expires?
  options:
  - If something goes wrong with renewal, there is still time to fix it.
  - Certificates work better when new.
  - It is free only in the last week.
  - Browsers require it.
  answer: If something goes wrong with renewal, there is still time to fix it.
  hint: Leave room for problems.
fixtures:
  ops/certs.txt: |
