id: ops-17
track: OPS
skill: networking
chapter: Senior on call
order: 17
title: ISP failover
from: Infrastructure
difficulty: hard
check: ops
par:
  kind: first-try
  value: 1
requires_all:
- net-22
- lab-20
lesson:
  text: Two internet links only help if traffic moves when one fails. traceroute shows the path traffic takes, so you can see which link is in use. A floating static route has a higher administrative distance, so it stays unused until the main route disappears.
  example: |-
    traceroute 8.8.8.8
    ip route 0.0.0.0 0.0.0.0 192.0.2.1 200
brief: The main link keeps failing, and the office goes dark every time. Find where traffic dies, then add a backup route that takes over by itself.
goal: Read the trace, then build the failover in the lab.
hints:
- The last hop that answered is just before the stars.
- The backup route needs a higher distance than the main one.
debrief:
  why: The backup only counts if it takes over by itself, so the lab cuts the link to prove it.
  solution: |-
    # Find where it dies
    cat ops/trace.txt
    submit 203.0.113.1

    # Build the failover
    [EDGE]
    enable
    configure terminal
    ip route 0.0.0.0 0.0.0.0 203.0.113.1
    ip route 0.0.0.0 0.0.0.0 192.0.2.1 200
    end
    show ip route
  job: Most offices with two links rely on exactly this setup.
teaches:
- failover
stages:
- title: Find where it dies
  check: answer
  brief: ~/ops/trace.txt is a traceroute taken during the last outage.
  goal: 'Run: submit <the last address that answered>'
  answer:
    accept:
    - 203.0.113.1
  solution: |-
    cat ops/trace.txt
    submit 203.0.113.1
- title: Build the failover
  check: net
  brief: That is the ISP-A link. Your fibre link to ISP-A goes down twice a month. A cheap backup link to ISP-B has been installed. Traffic should use ISP-A while it's up and move to ISP-B by itself when it isn't.
  goal: Traffic uses ISP-A, and moves to ISP-B when ISP-A's link is cut.
  lab:
    devices:
    - name: PC-1
      kind: pc
      x: 10
      y: 50
      config: 'ip addr add 10.40.20.10/24 dev eth0

        ip route add default via 10.40.20.1'
    - name: EDGE
      kind: router
      x: 35
      y: 50
      config: "interface Gi0/0\n ip address 10.40.20.1 255.255.255.0\n no shutdown\ninterface Gi0/1\n ip address 203.0.113.2 255.255.255.0\n no shutdown\ninterface Gi0/2\n ip address 192.0.2.2 255.255.255.0\n no shutdown"
    - name: ISP-A
      kind: router
      x: 62
      y: 20
      locked: true
      config: "interface Gi0/0\n ip address 203.0.113.1 255.255.255.0\n no shutdown\ninterface Gi0/1\n ip address 198.51.100.1 255.255.255.0\n no shutdown\nip route 10.40.20.0 255.255.255.0 203.0.113.2"
    - name: ISP-B
      kind: router
      x: 62
      y: 80
      locked: true
      config: "interface Gi0/0\n ip address 192.0.2.1 255.255.255.0\n no shutdown\ninterface Gi0/1\n ip address 198.51.101.1 255.255.255.0\n no shutdown\nip route 10.40.20.0 255.255.255.0 192.0.2.2"
    - name: SITE-A
      kind: server
      x: 90
      y: 20
      config: 'ip addr add 198.51.100.10/24 dev eth0

        ip route add default via 198.51.100.1

        service http start'
    - name: SITE-B
      kind: server
      x: 90
      y: 80
      config: 'ip addr add 198.51.101.10/24 dev eth0

        ip route add default via 198.51.101.1

        service http start'
    cables:
    - - PC-1
      - eth0
      - EDGE
      - Gi0/0
    - - EDGE
      - Gi0/1
      - ISP-A
      - Gi0/0
    - - EDGE
      - Gi0/2
      - ISP-B
      - Gi0/0
    - - SITE-A
      - eth0
      - ISP-A
      - Gi0/1
    - - SITE-B
      - eth0
      - ISP-B
      - Gi0/1
  expect:
  - label: The default route uses ISP-A
    route:
      device: EDGE
      to: 8.8.8.8
      via: 203.0.113.1
  - label: With ISP-A cut, it uses ISP-B
    survives:
      cut:
      - device: EDGE
        port: Gi0/1
      then:
      - route:
          device: EDGE
          to: 8.8.8.8
          via: 192.0.2.1
  - label: Sites beyond ISP-B are reachable during the cut
    survives:
      cut:
      - device: EDGE
        port: Gi0/1
      then:
      - reach:
          from: PC-1
          to: 198.51.101.10
          proto: tcp
          port: 80
  solution: |-
    [EDGE]
    enable
    configure terminal
    ip route 0.0.0.0 0.0.0.0 203.0.113.1
    ip route 0.0.0.0 0.0.0.0 192.0.2.1 200
    end
    show ip route
rewind:
- type: mc
  level: easy
  label: The main idea
  q: What is failover?
  options:
  - Replacing a router.
  - Traffic moving to a backup by itself when the main path fails.
  - A slow connection.
  - A failed audit.
  answer: Traffic moving to a backup by itself when the main path fails.
  hint: No human steps in.
- type: mc
  level: easy
  label: The trace
  q: What do stars in a traceroute mean?
  options:
  - The hop is very good.
  - An encrypted hop.
  - The trace finished.
  - That hop did not answer in time.
  answer: That hop did not answer in time.
  hint: Nothing came back.
- type: mc
  level: medium
  label: The route
  q: Why does the floating route have a distance of 200?
  options:
  - It is 200 km long.
  - Higher means faster.
  - It holds 200 hosts.
  - It only gets used when the better route is gone.
  answer: It only gets used when the better route is gone.
  hint: Lower distance wins.
- type: order
  level: medium
  label: Put it in order
  q: This incident was worked through in stages. Tap them from first to last.
  scrambled:
  - Build the failover
  - Find where it dies
  answer:
  - Find where it dies
  - Build the failover
  hint: 'It started with: Find where it dies.'
- type: mc
  level: hard
  label: On the job
  q: Why test failover by really cutting the link?
  options:
  - To annoy users.
  - It is the only way to know that it works before an outage.
  - Routers need exercise.
  - The ISP asks for it.
  answer: It is the only way to know that it works before an outage.
  hint: An untested backup is only a hope.
fixtures:
  ops/trace.txt: |
    1  10.40.1.1  1 ms
    2  203.0.113.1  4 ms
    3  * * *
    4  * * *
