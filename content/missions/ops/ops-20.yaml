id: ops-20
track: OPS
skill: shell
chapter: Final exam
order: 20
title: 'Final exam: Total Recall'
from: Everyone
difficulty: expert
check: ops
par:
  kind: first-try
  value: 1
requires_all:
- sh-30
- vi-30
- py-30
- go-30
- net-30
- lab-34
lesson:
  text: Real outages do not care which tool you learned first. Start from evidence, fix the smallest thing that explains it, and prove the fix. You have done every step of this before, and here they all happen in one night.
  example: grep ERROR app.log | sort | uniq -c | sort -rn
brief: It is 2am, and the Nairobi office is down. The on-call phone is yours. Work through it with every tool you have learned.
goal: 'Five stages, one incident: logs, config, code, a program and the network.'
hints:
- Each stage names the file or device it needs.
- Take the stages one at a time, as you would on a real night.
debrief:
  why: You used every tool you learned, in the order the problem demanded. That is what being on call really is.
  solution: |-
    # Read the logs
    grep ERROR ops/app.log | cut -d' ' -f2,3 | sort | uniq -c | sort -rn | head -1
    submit db timeout

    # Fix the config
    :%s/db_timeout=1/db_timeout=30/<CR>:wq<CR>

    # Count the damage
    def error_rate(lines):
        errors = 0
        for line in lines:
            if line.startswith("ERROR"):
                errors += 1
        return errors / len(lines)


    # Read the restart loop
    submit 6

    # Bring the office back
    [PC-1]
    ping 10.60.10.1
    [SW1]
    enable
    show interfaces trunk
    configure terminal
    interface Gi0/8
    switchport trunk allowed vlan add 10
    end
    copy running-config startup-config
    [R1]
    enable
    show running-config
    configure terminal
    no ip route 0.0.0.0 0.0.0.0 203.0.113.9
    ip route 0.0.0.0 0.0.0.0 203.0.113.1
    no access-list 1
    access-list 1 permit 10.60.0.0 0.0.255.255
    end
    copy running-config startup-config
    [DNS-1]
    dns del portal.corp.test
    dns add portal.corp.test A 10.60.20.80
    [PC-1]
    curl portal.corp.test
    curl 198.51.100.10
  job: If you can do this, you can hold the phone.
teaches:
- on call
stages:
- title: Read the logs
  check: answer
  brief: ~/ops/app.log has the last hour of errors.
  goal: 'Run: submit <the most common error, as its last two words>'
  answer:
    accept:
    - db timeout
  solution: |-
    grep ERROR ops/app.log | cut -d' ' -f2,3 | sort | uniq -c | sort -rn | head -1
    submit db timeout
- title: Fix the config
  check: vi
  brief: The database timeout is far too short in ~/ops/app.conf.
  goal: 'Change db_timeout=1 to db_timeout=30, then save with :wq. You must use vi: vi ~/ops/app.conf'
  file: ~/ops/app.conf
  expect:
  - file_contains:
      path: ~/ops/app.conf
      text: db_timeout=30
  - vi_saved: ~/ops/app.conf
  solution: :%s/db_timeout=1/db_timeout=30/<CR>:wq<CR>
- title: Count the damage
  check: py
  brief: error_rate(lines) returns the share of lines that start with ERROR, as a number from 0 to 1.
  goal: Write error_rate(lines). Tests run when you press Run tests.
  python:
    starter: |
      def error_rate(lines):
          # your code here
          pass
    tests:
    - expr: error_rate(["ERROR a", "INFO b"])
      want: '0.5'
    - expr: error_rate(["INFO b"])
      want: '0.0'
    - expr: error_rate(["ERROR a", "ERROR b"])
      want: '1.0'
  solution: |
    def error_rate(lines):
        errors = 0
        for line in lines:
            if line.startswith("ERROR"):
                errors += 1
        return errors / len(lines)
- title: Read the restart loop
  check: go-out
  brief: The service restarter is a small Go program. How many restarts did it do?
  goal: 'Predict the output, then run: submit <the printed text>'
  go:
    program: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\trestarts := 0\n\tfor i := 0; i < 3; i++ {\n\t\trestarts += 2\n\t}\n\tfmt.Println(restarts)\n}\n"
  answer:
    accept:
    - '6'
  solution: submit 6
- title: Bring the office back
  check: net
  brief: 'One thing left: the network itself. It''s 2am, and a late-night change has taken down the Nairobi office. PC-1 can''t reach the internet, and the site portal.corp.test won''t open. Nobody remembers what was changed. There are several faults on the network. Find them and bring the office back.'
  goal: 'The office is back: PC-1 reaches the internet and the portal by name.'
  lab:
    devices:
    - name: PC-1
      kind: pc
      x: 8
      y: 75
      config: 'ip addr add 10.60.10.10/24 dev eth0

        ip route add default via 10.60.10.1

        nameserver 10.60.20.53'
    - name: SW1
      kind: switch
      x: 28
      y: 55
      ports: 8
      config: "vlan 10\nvlan 20\ninterface Gi0/1\n switchport access vlan 10\ninterface Gi0/2\n switchport access vlan 20\ninterface Gi0/3\n switchport access vlan 20\ninterface Gi0/8\n switchport mode trunk\n switchport trunk allowed vlan 20"
    - name: DNS-1
      kind: server
      x: 18
      y: 95
      config: 'ip addr add 10.60.20.53/24 dev eth0

        ip route add default via 10.60.20.1

        service dns start

        dns add portal.corp.test A 10.60.20.8'
    - name: PORTAL
      kind: server
      x: 40
      y: 95
      config: 'ip addr add 10.60.20.80/24 dev eth0

        ip route add default via 10.60.20.1

        service http start'
    - name: R1
      kind: router
      x: 46
      y: 25
      config: "interface Gi0/0\n no shutdown\ninterface Gi0/0.10\n encapsulation dot1q 10\n ip address 10.60.10.1 255.255.255.0\n ip nat inside\ninterface Gi0/0.20\n encapsulation dot1q 20\n ip address 10.60.20.1 255.255.255.0\n ip nat inside\ninterface Gi0/1\n ip address 203.0.113.2 255.255.255.0\n ip nat outside\n no shutdown\nip route 0.0.0.0 0.0.0.0 203.0.113.9\naccess-list 1 permit 10.60.0.0 0.0.0.255\nip nat inside source list 1 interface Gi0/1 overload"
    - name: ISP
      kind: router
      x: 72
      y: 25
      locked: true
      config: "interface Gi0/0\n ip address 203.0.113.1 255.255.255.0\n no shutdown\ninterface Gi0/1\n ip address 198.51.100.1 255.255.255.0\n no shutdown"
    - name: INTERNET
      kind: server
      x: 92
      y: 25
      locked: true
      config: 'ip addr add 198.51.100.10/24 dev eth0

        ip route add default via 198.51.100.1

        service http start'
    cables:
    - - PC-1
      - eth0
      - SW1
      - Gi0/1
    - - DNS-1
      - eth0
      - SW1
      - Gi0/2
    - - PORTAL
      - eth0
      - SW1
      - Gi0/3
    - - R1
      - Gi0/0
      - SW1
      - Gi0/8
    - - R1
      - Gi0/1
      - ISP
      - Gi0/0
    - - INTERNET
      - eth0
      - ISP
      - Gi0/1
  expect:
  - label: PC-1 reaches its gateway
    reach:
      from: PC-1
      to: 10.60.10.1
  - label: PC-1 resolves the portal correctly
    dns:
      from: PC-1
      name: portal.corp.test
      answer: 10.60.20.80
  - label: PC-1 opens the portal by name
    reach:
      from: PC-1
      to: portal.corp.test
      proto: tcp
      port: 80
  - label: PC-1 reaches the internet
    reach:
      from: PC-1
      to: INTERNET
      proto: tcp
      port: 80
  - label: R1 survives a reload
    saved:
      device: R1
  - label: SW1 survives a reload
    saved:
      device: SW1
  solution: |-
    [PC-1]
    ping 10.60.10.1
    [SW1]
    enable
    show interfaces trunk
    configure terminal
    interface Gi0/8
    switchport trunk allowed vlan add 10
    end
    copy running-config startup-config
    [R1]
    enable
    show running-config
    configure terminal
    no ip route 0.0.0.0 0.0.0.0 203.0.113.9
    ip route 0.0.0.0 0.0.0.0 203.0.113.1
    no access-list 1
    access-list 1 permit 10.60.0.0 0.0.255.255
    end
    copy running-config startup-config
    [DNS-1]
    dns del portal.corp.test
    dns add portal.corp.test A 10.60.20.80
    [PC-1]
    curl portal.corp.test
    curl 198.51.100.10
rewind:
- type: mc
  level: easy
  label: The main idea
  q: What do you start from in an outage?
  options:
  - Evidence, such as logs and tests.
  - A guess.
  - A full rebuild.
  - Whoever complains loudest.
  answer: Evidence, such as logs and tests.
  hint: Look before you change.
- type: mc
  level: easy
  label: The approach
  q: Which fix should you make first?
  options:
  - The smallest one that explains what you see.
  - The biggest one you can think of.
  - All of them at once.
  - Whatever is newest.
  answer: The smallest one that explains what you see.
  hint: Small changes are easy to check.
- type: mc
  level: medium
  label: Proving it
  q: How do you know an outage is really over?
  options:
  - Nobody has complained for a minute.
  - Test it from the user side and see that it works.
  - The fix looked right.
  - The ticket was closed.
  answer: Test it from the user side and see that it works.
  hint: Prove it.
- type: order
  level: medium
  label: Put it in order
  q: This incident was worked through in stages. Tap them from first to last.
  scrambled:
  - Bring the office back
  - Read the restart loop
  - Count the damage
  - Fix the config
  - Read the logs
  answer:
  - Read the logs
  - Fix the config
  - Count the damage
  - Read the restart loop
  - Bring the office back
  hint: 'It started with: Read the logs.'
- type: mc
  level: hard
  label: On the job
  q: It is fixed at 3am. What still needs doing?
  options:
  - Nothing, ever.
  - Delete the logs.
  - Blame someone in the morning.
  - Write down what happened and what will stop it happening again.
  answer: Write down what happened and what will stop it happening again.
  hint: The next on-call will thank you.
fixtures:
  ops/app.log: |
    ERROR db timeout
    INFO ok
    ERROR db timeout
    ERROR disk full
    INFO ok
  ops/app.conf: |
    workers=4
    db_timeout=1
