lesson:
  text: Variable-length subnetting (VLSM) gives big groups big blocks. Allocate largest first and each block starts right after the last.
  example: |-
    10.0.0.0/24 for 60 and 20 hosts:
    10.0.0.0/26 then 10.0.0.64/27
brief: "Split 10.40.60.0/24 for: engineering 100 hosts, support 50, finance 20. Allocate largest first, one after the other. What's the finance subnet?"
goal: "Run: submit <answer>"
hints:
  - Engineering /25, support /26, finance /27.
  - Engineering ends at .127, support takes the next 64.
debrief:
  why: Variable-length subnetting allocates largest first so blocks stay aligned.
  solution: submit 10.40.60.192/27
  job: How you stretch an address block across an office.
teaches:
  - VLSM
answer:
