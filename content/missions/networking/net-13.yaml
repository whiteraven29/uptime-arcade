id: net-13
track: NET
skill: networking
chapter: Transport
order: 13
title: The TCP handshake
from: Network
difficulty: medium
check: answer
par:
  kind: first-try
  value: 1
lesson:
  text: TCP sets up a connection before sending data, with three messages. The client sends SYN, the server answers SYN-ACK, and the client finishes with ACK.
  example: |-
    -> SYN
    <- SYN-ACK
    -> ACK
brief: A client sends SYN to a healthy server. What does the server send back?
goal: "Run: submit <answer>"
hints:
  - It has to acknowledge and also start its own side.
  - Two words joined by a dash.
debrief:
  why: The handshake proves both sides can hear each other. A SYN with no reply usually means a firewall.
  solution: submit syn-ack
  job: Connection timeouts are diagnosed by which step of this fails.
teaches:
  - SYN
  - SYN-ACK
  - ACK
  - TCP
answer:
  accept:
    - syn-ack
    - synack
    - syn ack
rewind:
