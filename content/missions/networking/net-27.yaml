id: net-27
track: NET
skill: networking
chapter: Edge
order: 27
title: TLS at a glance
from: SRE
difficulty: hard
check: answer
par:
  kind: first-try
  value: 1
lesson:
  text: TLS encrypts traffic and proves who the server is, using a certificate with an expiry date. openssl s_client shows it. notAfter is the moment it stops being valid, and browsers then refuse the site.
  example: |-
    openssl s_client -connect example.test:443
    notAfter=Jan  9 23:59:59 2027 GMT
brief: In ~/net/cert.txt, when does the certificate for app.whiteraven.example expire?
goal: "Run: submit <month and day>, for example: submit dec 14"
hints:
  - Look for notAfter.
  - grep notAfter ~/net/cert.txt
debrief:
  why: A certificate is only trusted until its expiry date, so expiry is a calendar problem that looks like an outage.
  solution: grep notAfter ~/net/cert.txt
  job: Expired certificates still take down major sites every year.
teaches:
  - TLS
  - certificate
  - openssl
answer:
  accept:
    - dec 14
    - dec 14 2026
    - "2026-12-14"
