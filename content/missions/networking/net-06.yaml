lesson:
  text: "Add 2 to the devices you need, then find the smallest block that fits. Usable hosts double with each step: 30, 62, 126, 254."
  example: 40 devices need /26 (62 hosts)
brief: Guest Wi-Fi needs 120 devices. What's the smallest prefix that fits?
goal: "Run: submit <answer>"
hints:
  - Usable = 2^(32-prefix) - 2
  - /26 gives 62.
debrief:
  why: /26 has 62 hosts and /25 has 126.
  solution: submit /25
  job: Sizing is the first decision in any VLAN plan.
teaches:
  - size
answer:
