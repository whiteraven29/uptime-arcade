id: net-09
track: NET
skill: networking
chapter: Subnets
order: 9
title: One route for four
from: Network
difficulty: easy
check: answer
par:
  kind: first-try
  value: 1
lesson:
  text: Neighbouring networks can share one shorter route if they fit one aligned block, which is called summarising. Two /24s make a /23, and four make a /22.
  example: |-
    10.2.4.0/24 + 10.2.5.0/24
    = 10.2.4.0/23
brief: Write one route that covers exactly 10.1.0.0/24 to 10.1.3.0/24.
goal: "Run: submit <answer>"
hints:
  - Four /24s fit in two fewer prefix bits.
  - Their first 22 bits match.
debrief:
  why: Summarising shrinks routing tables, as long as the block is aligned.
  solution: submit 10.1.0.0/22
  job: Smaller tables mean simpler, faster routing.
teaches:
  - summaris
answer:
  accept:
    - 10.1.0.0/22
verify: str(list(ipaddress.collapse_addresses([ipaddress.ip_network(f'10.1.{i}.0/24') for i in range(4)]))[0])
rewind:
