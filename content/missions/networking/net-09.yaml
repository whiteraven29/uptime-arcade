    q: You just finished "One route for four". Which sentence best describes what it taught?
    options:
      - Summarising shrinks routing tables, as long as the block is aligned.
      - The mask is the prefix written as four octets.
      - /26 has 62 hosts and /25 has 126.
      - An address is just one 32-bit number written in a friendly way. All subnet maths follows from that.
    answer: Summarising shrinks routing tables, as long as the block is aligned.
    hint: Look for the sentence about summaris.
