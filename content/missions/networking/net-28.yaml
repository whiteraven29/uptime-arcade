lesson:
  text: "IPv6 addresses have 128 bits, written as eight groups. To shorten one, drop the leading zeros in each group and replace one run of all-zero groups with ::. Subnets are usually /64, and fe80:: addresses are link-local."
  example: |-
    2001:0db8:0001:0000:0000:0000:0000:0002
    = 2001:db8:1::2
brief: Shorten 2001:0db8:0000:0000:0000:0000:0000:0001 as far as it goes.
goal: "Run: submit <answer>"
hints:
  - 0db8 becomes db8.
  - "The six zero groups become ::"
debrief:
  why: "Only one :: is allowed per address, or nobody could tell how many zeros each one hides."
  solution: submit 2001:db8::1
  job: Cloud providers increasingly hand out IPv6 first.
teaches:
  - IPv6
  - "::"
answer:
  accept:
    - 2001:db8::1
verify: str(ipaddress.ip_address('2001:0db8:0000:0000:0000:0000:0000:0001'))
