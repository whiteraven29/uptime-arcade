lesson:
  text: DNS turns names into addresses. An A record gives an IPv4 address, AAAA an IPv6 one, CNAME points to another name, MX says where mail goes, and TXT holds notes. cat prints a file and grep finds lines in it.
  example: |-
    blog CNAME host
    host A 1.2.3.4

    grep host zone.txt
brief: In ~/net/zone.txt, what IP does www finally resolve to?
goal: "Run: submit <answer>"
hints:
  - www is a CNAME for edge.
  - Then find edge's A record.
debrief:
  why: A CNAME points to a name, so the resolver looks that name up again.
  solution: cat ~/net/zone.txt
  job: CDNs and hosting setups chain these.
teaches:
  - DNS
  - A
  - CNAME
  - grep
  - cat
