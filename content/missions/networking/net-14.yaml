    label: The main idea
    q: You just finished "TCP or UDP?". Which sentence best describes what it taught?
    options:
      - IP gets a packet across networks, and the MAC gets it across the local wire. ARP is the bridge between them.
      - A host compares network bits, then uses ARP for local targets or the gateway for the rest.
      - DNS uses UDP for speed and falls back to TCP for large answers.
      - Variable-length subnetting allocates largest first so blocks stay aligned.
    answer: DNS uses UDP for speed and falls back to TCP for large answers.
    hint: Look for the sentence about UDP.
