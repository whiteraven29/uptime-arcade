id: net-14
track: NET
skill: networking
chapter: Transport
order: 14
title: TCP or UDP?
from: Network
difficulty: medium
check: answer
par:
  kind: first-try
  value: 1
lesson:
  text: TCP sets up a connection and retries, which is reliable but slower. UDP just sends, which is fast and simple, and the application handles any loss.
  example: |-
    Video calls often use UDP
    File transfer uses TCP
brief: Normal DNS queries use which transport first?
goal: "Run: submit tcp  or  submit udp"
hints:
  - Short question, short answer, no handshake.
debrief:
  why: DNS uses UDP for speed and falls back to TCP for large answers.
  solution: submit udp
  job: Firewall rules for DNS need both.
teaches:
  - UDP
answer:
  accept:
    - udp
