lesson:
  text: An IP finds the machine, and a port finds the program on it. A socket is the pair, written with a colon. One server can run many services because each listens on its own port.
  example: |-
    10.40.10.80:443
    = machine 10.40.10.80, port 443
brief: A log line says the app is at 10.40.10.11:8080. Which port is the program listening on?
goal: "Run: submit <answer>"
hints:
  - It is after the colon.
  - The part before the colon is the machine.
debrief:
  why: IP plus port identifies one service on one machine.
  solution: submit 8080
  job: Every connection you debug is described this way.
teaches:
  - port
  - socket
answer:
  accept:
    - "8080"
