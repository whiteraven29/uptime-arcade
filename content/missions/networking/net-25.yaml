    q: You just finished "Read the NAT table". Which sentence best describes what it taught?
    options:
      - A jump that carries on to later hops marks a real long link or congestion.
      - NAT shares one public IP by mapping inside address and port pairs to outside ports.
      - A service bound to 127.0.0.1 cannot be reached from outside, which is the usual cause of "connection refused".
