title: Binary to decimal
from: Network
difficulty: easy
check: answer
par:
  kind: first-try
  value: 1
lesson:
  text: Computers store numbers in binary, as ones and zeros. An octet has 8 bits, worth 128, 64, 32, 16, 8, 4, 2 and 1 from left to right. Add up the ones that are on.
  example: |-
    10000001 = 128 + 1 = 129
    00001010 = 8 + 2 = 10
brief: What is the binary octet 11000000 in decimal?
goal: "Run: submit <answer>"
hints:
  - Only the first two bits are on.
  - 128 + 64
debrief:
  why: Eight place values are all you need, and they come straight back when you read subnet masks.
  solution: submit 192
  job: Masks like 255.255.255.192 make sense once you can see the bits.
teaches:
  - binary
answer:
  accept:
    - "192"
verify: str(0b11000000)
rewind:
  - type: mc
    level: easy
    label: The main idea
    q: You just finished "Binary to decimal". Which sentence best describes what it taught?
    options:
      - An address is just one 32-bit number written in a friendly way. All subnet maths follows from that.
      - The mask is the prefix written as four octets.
      - The 172 private block is the one people misremember, because it stops at 172.31.
      - Eight place values are all you need, and they come straight back when you read subnet masks.
    answer: Eight place values are all you need, and they come straight back when you read subnet masks.
    hint: Look for the sentence about binary.
  - type: mc
    level: easy
