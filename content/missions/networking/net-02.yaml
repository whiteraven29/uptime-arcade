      - 255.255.255.192
    answer: "192"
    hint: 128 + 64
    code: false
  - type: mc
    level: medium
    label: Why it matters
    q: Where would you use what "Binary to decimal" taught you at work?
    options:
      - Older gear and many forms ask for masks.
      - Masks like 255.255.255.192 make sense once you can see the bits.
      - Knowing these ranges tells you at a glance if a log entry is internal.
      - Everything else in networking builds on this one fact.
    answer: Masks like 255.255.255.192 make sense once you can see the bits.
    hint: "It starts with: Masks like 255.255.255.192 make…"
