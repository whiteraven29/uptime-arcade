lesson:
  text: Files are measured in bytes and links in bits, usually Mbps. Multiply bytes by 8, then divide by the link speed.
  example: |-
    500 MB = 4000 Mb
    on 50 Mbps: 80 s
brief: How many seconds to send 1 GB (1000 MB) over a 100 Mbps link at full speed?
goal: "Run: submit <seconds>"
hints:
