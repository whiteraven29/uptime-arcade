id: net-45
track: NET
skill: networking
chapter: Tunnels
order: 46
title: 'Tunnels: a link that isn''t there'
from: Network
difficulty: hard
check: answer
par:
  kind: first-try
  value: 1
lesson:
  text: A tunnel makes a virtual link across another network. A GRE tunnel wraps each packet inside a new one with public addresses, so two offices' private networks act as if they share a cable over the internet. Each end has a tunnel interface with a private address, a tunnel source, and a tunnel destination, which is the public address of the far end. Routing, even OSPF, runs over it as if it were real. GRE by itself isn't encrypted.
  example: |-
    interface Tunnel0
     ip address 172.31.0.1 255.255.255.252
     tunnel source Gi0/1
     tunnel destination 198.51.100.2
brief: 'In the example, which address does the internet see as the packet''s destination: 172.31.0.2 or 198.51.100.2?'
goal: 'Run: submit <answer>'
hints:
- The internet only routes public addresses.
- It's the tunnel destination.
debrief:
  why: 'A tunnel hides private addressing inside public packets, so routing protocols work across networks that know nothing about them. But hiding isn''t protecting: GRE has no encryption.'
  solution: submit 198.51.100.2
  job: Tunnels join sites, carry routing over the internet, and sit underneath many VPNs.
teaches:
- GRE
- tunnel source
- tunnel destination
answer:
  accept:
  - 198.51.100.2
reasoned: true
