id: net-10
track: NET
skill: networking
chapter: Local network
order: 10
title: MACs and ARP
from: Network
difficulty: easy
check: answer
par:
  kind: first-try
  value: 1
lesson:
  text: 'On a local network, frames are delivered by MAC address: a fixed hardware address on each network card, at layer 2. IP is layer 3. ARP connects them by asking the whole network "who has this IP?", and the owner replies.'
  example: |-
    Who has 10.0.0.9? Tell 10.0.0.5
    10.0.0.9 is at 52:54:00:3a:7e:21
brief: A host knows the IP of its neighbour but needs one more address to actually send a frame. ARP finds it. What kind of address is that?
goal: "Run: submit <what ARP finds>"
hints:
  - It is a hardware address.
  - Three letters.
debrief:
  why: IP gets a packet across networks, and the MAC gets it across the local wire. ARP is the bridge between them.
  solution: submit mac
  job: Duplicate IPs and bad switches show up as ARP problems.
teaches:
  - MAC
  - ARP
answer:
  accept:
    - mac
    - mac address
