id: net-01
track: NET
skill: networking
chapter: Addresses
order: 1
title: What an IP really is
from: Network
difficulty: easy
check: answer
par:
  kind: first-try
  value: 1
lesson:
  text: Every device on a network has an address so that data can find it. An IPv4 address is a 32-bit number. For people it is written as four numbers from 0 to 255, each called an octet because it is 8 bits.
  example: |-
    10.40.30.21
    four octets, 8 bits each
brief: Four octets, 8 bits each. How many bits long is an IPv4 address?
goal: "Run: submit <answer>"
hints:
  - An octet is 8 bits.
  - 4 times 8.
debrief:
  why: An address is just one 32-bit number written in a friendly way. All subnet maths follows from that.
  solution: submit 32
  job: Everything else in networking builds on this one fact.
teaches:
  - IP
  - bits
  - octet
answer:
  accept:
    - "32"
verify: str(ipaddress.ip_address("10.0.0.1").max_prefixlen)
rewind:
