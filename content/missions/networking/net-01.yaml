    level: easy
    label: The main idea
    q: You just finished "What an IP really is". Which sentence best describes what it taught?
    options:
      - /26 has 62 hosts and /25 has 126.
      - An address is just one 32-bit number written in a friendly way. All subnet maths follows from that.
      - Two addresses are reserved in each normal subnet.
      - The mask is the prefix written as four octets.
    answer: An address is just one 32-bit number written in a friendly way. All subnet maths follows from that.
    hint: Look for the sentence about IP and bits.
  - type: mc
    level: easy
    label: Spot the solution
    q: What was the right answer?
    context: Four octets, 8 bits each. How many bits long is an IPv4 address?
    options:
      - "32"
      - /25
      - 255.255.255.192
