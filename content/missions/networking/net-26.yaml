order: 26
title: First match wins
from: Network
difficulty: hard
check: answer
par:
  kind: first-try
  value: 1
lesson:
  text: Firewalls read rules from the top and stop at the first match. Lower rules never see that packet.
  example: |-
    1 deny from A
    2 permit from any
    A is denied by rule 1
brief: A guest laptop at 10.40.40.7 opens TCP 443 to 10.40.20.5. Rules are in ~/net/fw-rules.txt.
goal: "Run: submit <rule number that decides>"
hints:
  - Read from the top and stop at the first full match.
  - Rule 30 would allow it, but something comes first.
debrief:
  why: Firewalls stop at the first match, so the finance deny must sit above the general permit.
  solution: |-
    cat ~/net/fw-rules.txt
    submit 20
  job: Network separation depends on rule order.
teaches:
  - Firewall
answer:
  accept:
    - "20"
