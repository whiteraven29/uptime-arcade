lesson:
  text: Well-known ports are shared conventions. 22 is SSH, 25 is mail, 53 is DNS, 80 is HTTP and 3389 is Windows remote desktop. Secure web has its own port.
  example: |-
    HTTP uses TCP 80
    SSH uses TCP 22
brief: Which TCP port does HTTPS use by default?
goal: "Run: submit <answer>"
hints:
  - HTTP is 80.
