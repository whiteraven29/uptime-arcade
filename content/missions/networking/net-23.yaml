  value: 1
lesson:
  text: "ss -tulpn lists everything waiting for connections: -t TCP, -u UDP, -l listening, -p with the process, -n with numbers. An address of 127.0.0.1 means only this machine can reach it."
  example: ss -tulpn
brief: Which program on this server is only reachable from the machine itself, on port 5432?
goal: "Run: submit <program name>"
hints:
  - Run ss -tulpn.
  - Look for 127.0.0.1:5432.
debrief:
  why: A service bound to 127.0.0.1 cannot be reached from outside, which is the usual cause of "connection refused".
  solution: ss -tulpn
  job: The first check when a service cannot be reached.
teaches:
  - ss
  - -t
  - -u
  - -l
  - -p
  - -n
answer:
  accept:
    - postgres
