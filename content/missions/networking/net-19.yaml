    context: ~/net/routes.txt is a router's table. A packet is going to 10.40.30.140.
    options:
      - sed -i 's/10.40.10.99/10.40.10.53/' /etc/resolv.conf
      - "8080"
      - 10.40.0.4
      - udp
    answer: 10.40.0.4
    hint: 10.40.30.192/26 starts at .192.
    code: false
  - type: mc
