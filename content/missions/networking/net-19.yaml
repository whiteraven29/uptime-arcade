id: net-19
track: NET
skill: networking
chapter: Routing
order: 25
title: Read a routing table
from: Network
difficulty: medium
check: answer
par:
  kind: first-try
  value: 1
lesson:
  text: When several routes match, the router picks the longest prefix, meaning the most specific one. The default route only wins when nothing else matches.
  example: |-
    to 10.0.0.9:
    10.0.0.0/8 and 10.0.0.0/24 match
    /24 wins
brief: ~/net/routes.txt is a router's table. A packet is going to 10.40.30.140.
goal: "Run: submit <next hop IP>"
hints:
  - The longest matching prefix wins.
  - 10.40.30.192/26 starts at .192.
debrief:
  why: .140 is in 10.40.30.128/25 but not in .192/26, so longest match gives 10.40.0.4.
  solution: |-
    cat ~/net/routes.txt
    submit 10.40.0.4
  job: Explains why traffic took an unexpected path.
teaches:
  - longest prefix
answer:
  accept:
    - 10.40.0.4
rewind:
  - type: mc
    level: easy
    label: The main idea
    q: You just finished "Read a routing table". Which sentence best describes what it taught?
    options:
      - .140 is in 10.40.30.128/25 but not in .192/26, so longest match gives 10.40.0.4.
      - A timeout means no server answered, and NXDOMAIN means it answered that the name doesn't exist. They're different faults.
      - IP plus port identifies one service on one machine.
      - DNS uses UDP for speed and falls back to TCP for large answers.
    answer: .140 is in 10.40.30.128/25 but not in .192/26, so longest match gives 10.40.0.4.
    hint: Look for the sentence about longest prefix.
  - type: mc
    level: easy
