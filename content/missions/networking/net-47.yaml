title: 'Wi-Fi: networks on the air'
from: Network
difficulty: hard
check: answer
par:
  kind: first-try
  value: 1
lesson:
  text: An access point is a switch with a radio. It offers one or more networks by name, called an SSID, and each SSID drops its clients into a VLAN. The cable from the access point to the switch is a trunk, carrying those VLANs. Radios use channels. On 2.4 GHz, only 1, 6 and 11 don't overlap, so neighbouring access points should use different ones. If two neighbours overlap, they talk over each other and everyone slows down. A client joins the strongest access point offering its SSID, and moves to another if that one goes away, which is called roaming.
  example: |-
    SSID STAFF  -> VLAN 10
    SSID GUEST  -> VLAN 20
    AP-1 channel 1, AP-2 channel 6, AP-3 channel 11
brief: Two neighbouring access points are on channels 6 and 8. Do they overlap? Answer yes or no.
goal: 'Run: submit <answer>'
hints:
- Only 1, 6 and 11 are clear of each other.
- 6 and 8 are too close.
debrief:
  why: An SSID is just a name for a VLAN on the air, so everything you know about VLANs and trunks still applies. Channels are the part that's new, and picking non-overlapping ones is most of Wi-Fi planning.
  solution: submit yes
  job: '"The Wi-Fi is slow" in a busy office is very often neighbouring access points on overlapping channels.'
teaches:
- SSID
- channel
- roaming
answer:
  accept:
  - 'yes'
reasoned: true
