lesson:
  text: Keep a list of accepted requests. For each new one, count how many accepted ones are still inside the time window.
  example: |-
    recent = [x for x in ok if x > t - 60]
    if len(recent) < 5:
        ok.append(t)
brief: times holds sorted request seconds. Return how many are allowed if at most limit may pass in any window seconds. Rejected requests do not count.
goal: Write allowed(times, limit, window). Tests run when you press Run tests.
hints:
  - Keep a list of accepted times.
  - Count accepted times greater than t - window.
debrief:
  why: A sliding window avoids the spikes you get at the edges of fixed windows, and rate limiting protects a service from any one client.
  solution: |-
    def allowed(times, limit, window):
        ok = []
        for t in times:
            recent = [x for x in ok if x > t - window]
            if len(recent) < limit:
                ok.append(t)
        return len(ok)
  job: Every public API has a limiter like this. This game has one too.
teaches:
  - beyond
