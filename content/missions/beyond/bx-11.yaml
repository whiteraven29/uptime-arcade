    q: You just finished "The worst hour". Which sentence best describes what it taught?
    options:
      - Division by zero is the classic crash in reporting code, so guard it first.
      - Slicing the timestamp turns a list of events into a timeline, which is how you line an outage up with a deploy.
      - Every extra bit doubles the number of subnets and halves their size.
      - Filtering before grouping turns "how many errors" into "where are the errors", which is the question that matters.
    answer: Slicing the timestamp turns a list of events into a timeline, which is how you line an outage up with a deploy.
