lesson:
  text: substr(s, start, length) cuts text inside awk, and character positions start at 1. It lets you group by part of a field, such as the hour of a timestamp.
  example: awk '{print substr($1,1,4)}' dates.txt
brief: Times in ~/logs/api-access.log look like 2026-10-14T06:00:19. Which hour of the day (two digits) had the most 500 errors?
goal: "Run: submit <hour>"
hints:
  - The hour starts at character 12 of the first field.
  - Filter on $5==500, print substr($1,12,2), then count.
debrief:
  why: Slicing the timestamp turns a list of events into a timeline, which is how you line an outage up with a deploy.
  solution: awk '$5==500{print substr($1,12,2)}' ~/logs/api-access.log | sort | uniq -c | sort -rn | head -1
  job: Knowing when it started narrows down what caused it.
teaches:
  - beyond
answer:
  accept:
    - "13"
