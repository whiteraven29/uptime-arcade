lesson:
  text: awk keeps variables between lines, so it can count a run, reset it and remember the longest. if and else work inside a block.
  example: awk '{if($1=="x"){n++; if(n>m)m=n}else n=0} END{print m}' marks.txt
brief: What is the longest unbroken run of non-200 responses in ~/logs/api-access.log? Status is field 5.
goal: "Run: submit <length of the run>"
hints:
  - Add 1 to n on a bad line, and set n back to 0 on a good one.
  - Keep the biggest n you see in m, and print it in END.
debrief:
  why: "A count alone can hide this: ten errors spread over a day is fine, ten in a row is an outage. State between lines is what shows the difference."
  solution: awk '{if($5!=200){n++; if(n>m)m=n}else n=0} END{print m}' ~/logs/api-access.log
  job: Alerting systems look for runs like this, not just totals.
teaches:
  - beyond
