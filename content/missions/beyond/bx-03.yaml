lesson:
  text: round(x, 2) keeps two decimals. Check for a zero before you divide by it.
  example: |-
    if total == 0:
        return 0
    round(1 / 3 * 100, 2)   # 33.33
brief: Return up as a percentage of total, rounded to 2 decimals. If total is 0, return 0.
goal: Write uptime_pct(up, total). Tests run when you press Run tests.
hints:
  - Handle total == 0 first.
  - round(up / total * 100, 2)
debrief:
  why: Division by zero is the classic crash in reporting code, so guard it first.
  solution: |-
    def uptime_pct(up, total):
        if total == 0:
            return 0
        return round(up / total * 100, 2)
  job: Status pages show exactly this number.
teaches:
  - beyond
