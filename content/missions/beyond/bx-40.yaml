id: bx-40
track: BX
skill: networking
chapter: Hard
order: 30
title: Which rule decides?
from: Network
difficulty: hard
check: answer
par:
  kind: first-try
  value: 1
lesson:
  text: "Read a firewall table from the top, and test every part of a rule: source, destination, protocol and port. A rule has to match all of them."
  example: |-
    10 deny tcp 10.0.1.0/24 any
    20 permit ip any any
brief: A finance PC at 10.40.20.9 opens TCP 443 to 1.1.1.1. Rules are in ~/net/fw-rules.txt. Which rule decides?
goal: "Run: submit <rule number that decides>"
hints:
  - Rules 10, 20 and 30 are about the guest VLAN, 10.40.40.0/24.
  - Is 10.40.20.9 inside 10.40.0.0/16?
debrief:
  why: Rules 10 to 30 only match guest sources, so the first full match is rule 40.
  solution: |-
    cat ~/net/fw-rules.txt
    submit 40
  job: Reading a rule table in order is most of firewall work.
teaches:
  - beyond
answer:
  accept:
    - "40"
