lesson:
  text: Ctrl-v selects a rectangle, so d removes the same columns from every row. Move down for rows and right for width.
  example: Ctrl-v  2j  3l  d
brief: Remove the word old and its space from the front of all three lines in ~/vi/cutcol.txt, in one block delete.
goal: "Make the change, then save with :wq. You must use vi: vi ~/vi/cutcol.txt"
