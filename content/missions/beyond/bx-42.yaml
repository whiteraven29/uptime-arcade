  - Ctrl-v, then 2j covers three rows.
  - 3l widens it to four columns, and d removes them.
debrief:
  why: Block mode works on columns, which line-based commands cannot do in one go.
  solution: <C-v>2j3ld:wq<CR>
  job: Tidying aligned output and tables is where this shines.
