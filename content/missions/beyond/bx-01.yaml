lesson:
  text: sed -n 2p prints only line 2, so it picks second place out of any sorted list.
  example: sort scores.txt | sed -n 2p
brief: Everyone knows the busiest path in ~/logs/api-access.log. Which path is second busiest?
goal: "Run: submit <path>"
hints:
  - Start from the top-N counter.
  - End it with sed -n 2p instead of head -1.
debrief:
  why: Pipelines are built from parts, so swapping the last part changes the question they answer.
  solution: cut -d' ' -f4 ~/logs/api-access.log | sort | uniq -c | sort -rn | sed -n 2p
  job: The runner-up is often the next thing to fall over.
teaches:
  - beyond
answer:
  accept:
    - /health
