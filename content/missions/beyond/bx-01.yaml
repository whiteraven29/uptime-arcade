    q: You just finished "Second place". Which sentence best describes what it taught?
    options:
      - Pipelines are built from parts, so swapping the last part changes the question they answer.
      - Every extra bit doubles the number of subnets and halves their size.
      - Keeping the old value in a comment is a cheap rollback, and a macro does it for a whole file.
      - Division by zero is the classic crash in reporting code, so guard it first.
    answer: Pipelines are built from parts, so swapping the last part changes the question they answer.
