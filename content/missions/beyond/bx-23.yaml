lesson:
  text: Brainfuck is a real programming language with eight commands. > and < move along a row of cells, + and - change the current cell (0 to 255, wrapping), . outputs it as a character, and [ ] loop while it is not zero. The hard part is matching the brackets first.
  example: |-
    jump = {}
    stack = []
    # on [ push its position
    # on ] pop, and record both directions
brief: Return everything the program outputs, as a string. There is no input command. Cells wrap at 256.
goal: Write run_bf(code). Tests run when you press Run tests.
hints:
  - Scan the code once to pair every [ with its ], in a dict both ways.
  - chr(cell) turns a value into a character. Use % 256 to wrap.
debrief:
  why: An interpreter is just a loop over instructions with some state. Writing one removes the magic from every language you use.
  solution: |-
    def run_bf(code):
        jump = {}
        stack = []
        for i, c in enumerate(code):
            if c == "[":
                stack.append(i)
            elif c == "]":
                j = stack.pop()
                jump[i] = j
                jump[j] = i
        cells = [0] * 3000
        p = 0
        i = 0
        out = ""
        while i < len(code):
            c = code[i]
            if c == ">":
                p += 1
            elif c == "<":
                p -= 1
            elif c == "+":
                cells[p] = (cells[p] + 1) % 256
            elif c == "-":
                cells[p] = (cells[p] - 1) % 256
            elif c == ".":
                out += chr(cells[p])
            elif c == "[" and cells[p] == 0:
                i = jump[i]
            elif c == "]" and cells[p] != 0:
                i = jump[i]
            i += 1
        return out
  job: Nobody writes Brainfuck at work. Everybody who has written an interpreter reads code differently.
teaches:
  - beyond
python:
  starter: |
    def run_bf(code):
        # your code here
        pass
  tests:
    - expr: run_bf("+++++++++[>++++++++<-]>.")
      want: '"H"'
    - expr: run_bf("++[>+++<-]>[<+>-]<.")
      want: '"\x06"'
    - expr: run_bf(">+<[.]")
      want: '""'
    - expr: run_bf("-[+]+++.")
      want: '"\x03"'
    - expr: run_bf("++++[>++++++++++<-]>+.+.")
      want: '")*"'
