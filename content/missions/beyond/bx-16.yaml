debrief:
  why: Totals favour whoever is biggest. Averages show who is actually worth more, which is often a different answer.
  solution: awk -F, 'NR>1{s[$4]+=$5;n[$4]++} END{for(k in s)print s[k]/n[k],k}' ~/data/customers.csv | sort -rn | head -1
  job: Analysis that changes decisions is usually a ratio.
