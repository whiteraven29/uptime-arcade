lesson:
  text: range gives you a copy in v, but s[i] writes to the real slice. That is how you change items in a loop.
  example: |-
    for i := range s {
    	s[i]++
    }
brief: Read this Go program and predict exactly what it prints.
goal: "Predict the output, then run: submit <the printed text>"
hints:
  - s[i] changes the slice itself.
  - Println shows slices with square brackets and spaces.
debrief:
  why: v is a copy, and writing through the index is the one that sticks.
  solution: submit [2 4 6]
  job: A common loop in any Go code.
teaches:
  - beyond
answer:
  accept:
    - "[2 4 6]"
go:
  program: |
    package main

    import (
    	"fmt"
    )

    func main() {
    	s := []int{1, 2, 3}
    	for i, v := range s {
    		s[i] = v * 2
    	}
    	fmt.Println(s)
    }
