lesson:
  text: To keep a link full, TCP needs one round trip of data in flight. That is bandwidth times delay. Divide by 8 for bytes.
  example: |-
    100 Mbps with 20 ms:
    100000000 * 0.02 / 8 = 250000 bytes
brief: How big must the TCP window be, in megabytes, to fill a 1 Gbps link with a 50 ms round trip?
goal: "Run: submit <megabytes, to 2 decimals>"
hints:
  - 1000000000 bits per second times 0.05 seconds.
  - Divide by 8 for bytes, then by 1000000.
debrief:
  why: Bandwidth times delay is how much data is on the wire at once. A smaller window leaves the link idle, however fast it is.
  solution: submit 6.25
  job: Tuning long-distance transfers starts with this sum.
teaches:
  - beyond
answer:
  accept:
    - "6.25"
verify: str(1000000000*0.05/8/1000000)
