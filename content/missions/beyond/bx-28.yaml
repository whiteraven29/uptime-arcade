lesson:
  text: set() removes repeats, and sorted() orders what is left. x[-2] is the second item from the end.
  example: "sorted(set([4, 4, 1]))   # [1, 4]"
brief: Return the second largest distinct number. Repeats of the largest do not count.
goal: Write second_largest(nums). Tests run when you press Run tests.
hints:
  - Remove the repeats first.
  - sorted(set(nums))[-2]
debrief:
  why: Removing duplicates before sorting is what makes this right, because [7, 7, 2] has to give 2 and not 7.
  solution: |-
    def second_largest(nums):
        return sorted(set(nums))[-2]
  job: Rankings always have to decide how to treat ties.
