brief: 'Return each run of characters as the character and its length: "aaabcc" gives "a3b1c2".'
goal: Write rle(text). Tests run when you press Run tests.
hints:
  - Handle the empty string first.
  - Remember to write out the final run after the loop.
debrief:
  why: Compression is really about spotting runs. Forgetting the last run after the loop is the classic bug.
  solution: |-
    def rle(text):
        if not text:
            return ""
        out = ""
        prev = text[0]
        n = 0
        for c in text:
            if c == prev:
                n += 1
            else:
                out += prev + str(n)
                prev = c
                n = 1
        return out + prev + str(n)
  job: Log compressors and image formats start from this.
teaches:
  - beyond
