title: How many fit?
from: Network
difficulty: easy
check: answer
par:
  kind: first-try
  value: 1
lesson:
  text: Each extra prefix bit splits a block in two. So the count is 2 to the power of the difference between prefixes.
  example: |-
    A /24 holds two /25s
    and four /26s
brief: How many /26 subnets fit in one /24?
goal: "Run: submit <answer>"
hints:
  - 26 minus 24 is 2.
  - 2 to the power of 2.
debrief:
  why: Every extra bit doubles the number of subnets and halves their size.
  solution: submit 4
  job: The quick sum behind every address plan.
teaches:
  - beyond
answer:
  accept:
    - "4"
verify: str(len(list(ipaddress.ip_network('10.0.0.0/24').subnets(new_prefix=26))))
