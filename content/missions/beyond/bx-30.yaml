lesson:
  text: The last usable host is one below the broadcast address. Many networks put a gateway or a printer there.
  example: |-
    10.0.0.64/28
    broadcast 10.0.0.79
    last host 10.0.0.78
brief: What is the last usable address in the subnet of 192.168.7.130/27?
goal: "Run: submit <answer>"
hints:
  - /27 blocks go up in 32s, so the network is .128.
  - Broadcast is .159. One below that.
debrief:
  why: Network, then broadcast, then one below it. The same three steps work for any subnet.
  solution: submit 192.168.7.158
  job: Firewall rules and static addresses need exact ends of a range.
teaches:
  - beyond
answer:
  accept:
    - 192.168.7.158
verify: str(list(ipaddress.ip_interface('192.168.7.130/27').network.hosts())[-1])
