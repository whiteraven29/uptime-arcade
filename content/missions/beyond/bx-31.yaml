  - $4=="/v1/upload" picks the lines.
  - Print $2, then sort -u and wc -l.
debrief:
  why: Filter first and then count distinct, because counting the lines would count requests instead of clients.
  solution: awk '$4=="/v1/upload"{print $2}' ~/logs/api-access.log | sort -u | wc -l
  job: '"How many customers were affected?" is this query.'
