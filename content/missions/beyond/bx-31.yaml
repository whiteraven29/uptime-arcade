lesson:
  text: Filter with awk, then sort -u and wc -l. That is how you count distinct values among only some of the lines.
  example: awk '$1=="cat"{print $2}' pets.txt | sort -u | wc -l
brief: How many different client IPs used /v1/upload in ~/logs/api-access.log? The path is field 4 and the IP is field 2.
goal: "Run: submit <count>"
