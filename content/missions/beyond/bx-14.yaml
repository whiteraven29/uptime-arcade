id: bx-14
track: BX
skill: go
chapter: Hard
order: 14
title: Two defers and a panic
from: Platform
difficulty: hard
check: go-out
par:
  kind: first-try
  value: 1
lesson:
  text: During a panic, deferred calls still run in reverse order, and they can see and change a named result. recover only stops the panic inside the deferred function that calls it.
  example: |-
    defer first()
    defer second()
    panic("x")
    // second runs, then first
brief: Read this Go program and predict exactly what it prints.
goal: "Predict the output, then run: submit <the printed text>"
hints:
  - The last defer runs first, and n becomes 6.
  - Then the recover runs and overwrites n.
debrief:
  why: "Order is everything: n goes 3, then 6, then -1, because the recovering defer was registered first and so runs last."
  solution: submit -1
  job: Servers rely on this to turn a panic into a clean error response.
teaches:
  - beyond
answer:
  accept:
    - "-1"
go:
  program: |
    package main

    import (
    	"fmt"
    )

    func f() (n int) {
    	defer func() {
    		if r := recover(); r != nil {
    			n = -1
    		}
    	}()
    	defer func() { n *= 2 }()
    	n = 3
    	panic("x")
    }

    func main() {
    	fmt.Println(f())
    }
