    q: You just finished "Two defers and a panic". Which sentence best describes what it taught?
    options:
      - Slicing the timestamp turns a list of events into a timeline, which is how you line an outage up with a deploy.
      - Topological sort is how build tools, package managers and deploy systems decide what goes first.
      - 0 and 3 differ in two bits, so the shared prefix is 22 bits, and the route also covers 10.0.1.0 and 10.0.2.0.
      - "Order is everything: n goes 3, then 6, then -1, because the recovering defer was registered first and so runs last."
    answer: "Order is everything: n goes 3, then 6, then -1, because the recovering defer was registered first and so runs last."
    hint: "The lesson said: During a panic, deferred calls still run in reverse order, and they can see and change a named result."
