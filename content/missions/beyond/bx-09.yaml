    options:
      - Keeping the old value in a comment is a cheap rollback, and a macro does it for a whole file.
      - The header is copied, the array is shared until append moves it. That split explains most surprises with slices in functions.
      - Compression is really about spotting runs. Forgetting the last run after the loop is the classic bug.
      - Pipelines are built from parts, so swapping the last part changes the question they answer.
    answer: The header is copied, the array is shared until append moves it. That split explains most surprises with slices in functions.
