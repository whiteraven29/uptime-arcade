title: What the function changed
from: Backend
difficulty: medium
check: go-out
par:
  kind: first-try
  value: 1
lesson:
  text: A slice passed to a function shares its array, so s[0] changes the caller. But the slice header is a copy, and once append moves to a new array, writes go there.
  example: |-
    func f(s []int) {
    	s[0] = 1              // caller sees this
    	s = append(s, 2)     // caller does not
    }
brief: Read this Go program and predict exactly what it prints.
goal: "Predict the output, then run: submit <the printed text>"
hints:
  - a is full, so append allocates a new array.
  - s[1] = 7 happens on the new array.
debrief:
  why: The header is copied, the array is shared until append moves it. That split explains most surprises with slices in functions.
  solution: submit [9 2] 2
  job: This bug shows up in almost every Go code review.
teaches:
  - beyond
answer:
  accept:
    - "[9 2] 2"
go:
  program: |
    package main

    import (
    	"fmt"
    )

    func touch(s []int) {
    	s[0] = 9
    	s = append(s, 1)
    	s[1] = 7
    }

    func main() {
    	a := []int{1, 2}
    	touch(a)
    	fmt.Println(a, len(a))
    }
