lesson:
  text: A link between two routers usually gets a /30, which holds two usable hosts. Each extra prefix bit doubles how many fit.
  example: A /28 holds four /30s
brief: How many /30 point-to-point links can you carve from one /27?
goal: "Run: submit <answer>"
hints:
  - 30 minus 27 is 3.
  - 2 to the power of 3.
debrief:
  why: Three extra bits gives eight blocks. The same sum works for any two prefixes.
  solution: submit 8
  job: Router links get carved from a small reserved block like this.
teaches:
  - beyond
answer:
  accept:
    - "8"
