id: bx-12
track: BX
skill: vi
chapter: Hard
order: 12
title: Quote every value
from: Platform
difficulty: hard
check: vi
par:
  kind: keys
  value: 20
lesson:
  text: A macro has to leave the cursor where the next run can start. Ending on j0 means every replay begins at the start of the next line.
  example: |-
    qa  f=  a"<Esc>  A"<Esc>  j0  q
    2@a
brief: Wrap every value in ~/vi/quote.env in double quotes. Record once and replay.
goal: "Make the change, then save with :wq. You must use vi: vi ~/vi/quote.env"
hints:
  - f= then a inserts right after the equals sign.
  - End the macro with j then 0.
debrief:
  why: The hardest part of a macro is where it ends, because the next run depends on it.
  solution: qaf=a"<Esc>A"<Esc>j0q2@a:wq<CR>
  job: Unquoted values with spaces break env files in production.
teaches:
  - beyond
file: ~/vi/quote.env
expect:
  - file_equals:
      path: ~/vi/quote.env
      content: |
        HOST="web"
        PORT="80"
        MODE="prod"
  - vi_saved: ~/vi/quote.env
rewind:
  - type: mc
    level: easy
    label: The main idea
    q: You just finished "Quote every value". Which sentence best describes what it taught?
    options:
      - v is a copy, and writing through the index is the one that sticks.
      - 0 and 3 differ in two bits, so the shared prefix is 22 bits, and the route also covers 10.0.1.0 and 10.0.2.0.
      - Every extra bit doubles the number of subnets and halves their size.
      - The hardest part of a macro is where it ends, because the next run depends on it.
    answer: The hardest part of a macro is where it ends, because the next run depends on it.
    hint: "The lesson said: A macro has to leave the cursor where the next run can start."
  - type: mc
    level: easy
    label: Spot the solution
    q: Which keys made this edit?
    context: Wrap every value in ~/vi/quote.env in double quotes. Record once and replay.
    options:
      - "[2 4 6]"
      - 10.0.0.0/22
      - qaf=a"<Esc>A"<Esc>j0q2@a:wq<CR>
      - "4"
    answer: qaf=a"<Esc>A"<Esc>j0q2@a:wq<CR>
    hint: End the macro with j then 0.
    code: true
  - type: order
    level: medium
    label: Put it in order
    q: These are the keys you pressed, split into steps. Tap them from first to last.
    scrambled:
      - :wq<CR>
      - qaf=a"<Esc>
      - A"<Esc>
      - j0q2@a
    answer:
      - qaf=a"<Esc>
      - A"<Esc>
      - j0q2@a
      - :wq<CR>
    hint: 'The first one is: qaf=a"<Esc>'
  - type: text
    level: medium
    label: Fill the gap
    q: Here are the keys that solved it, with one part missing. Type the missing part.
    show: qaf=a"<Esc>A"<Esc>j0q2@a____<CR>
    answer:
      - :wq
    hint: It starts with ":" and is 3 characters long.
  - type: text
    level: hard
    label: From memory
    q: Which vi command saves the file and quits? Type it exactly, with the colon.
    answer:
      - :wq
    hint: It starts with a colon, then w, then q.
