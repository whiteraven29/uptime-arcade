title: The covering route
from: Network
difficulty: medium
check: answer
par:
  kind: first-try
  value: 1
lesson:
  text: Two networks can be covered by one shorter route. Find how many leading bits they share. It may cover more than just those two.
  example: |-
    10.0.2.0/24 and 10.0.3.0/24
    share 23 bits, so 10.0.2.0/23
brief: What is the smallest single route that covers both 10.0.0.0/24 and 10.0.3.0/24?
goal: "Run: submit <answer>"
hints:
  - "Write the third octets in binary: 00000000 and 00000011."
  - They differ in the last two bits of that octet.
debrief:
  why: 0 and 3 differ in two bits, so the shared prefix is 22 bits, and the route also covers 10.0.1.0 and 10.0.2.0.
  solution: submit 10.0.0.0/22
  job: Summaries often cover more than you meant, which can swallow traffic.
teaches:
  - beyond
answer:
  accept:
    - 10.0.0.0/22
verify: str(ipaddress.ip_network('10.0.3.0/22', strict=False))
