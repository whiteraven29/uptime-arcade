lesson:
  text: A router keeps every route that matches and picks the one with the longest prefix. Dividing by 2 ** (32 - prefix) drops the host bits, so only the network bits get compared, and a /0 matches everything.
  example: |-
    net, bits = "10.0.0.0/8".split("/")
    size = 2 ** (32 - int(bits))
    to_int(ip) // size == to_int(net) // size
brief: Return the next hop of the longest matching route, or None if nothing matches.
goal: Write next_hop(table, ip). Tests run when you press Run tests.
hints:
  - Turn each IP into one number first.
  - Track the best prefix seen so far, and replace it when a longer one matches.
debrief:
  why: This is the decision every router makes for every packet, written out in full.
  solution: |-
    def to_int(ip):
        n = 0
        for o in ip.split("."):
            n = n * 256 + int(o)
        return n

    def next_hop(table, ip):
        best = None
        best_bits = -1
        for route, hop in table:
            net, bits = route.split("/")
            bits = int(bits)
            size = 2 ** (32 - bits)
            if to_int(ip) // size == to_int(net) // size and bits > best_bits:
                best = hop
                best_bits = bits
        return best
  job: Routers do this in hardware, but the logic is exactly this.
teaches:
  - beyond
