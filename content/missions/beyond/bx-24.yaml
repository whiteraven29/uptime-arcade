par:
  kind: first-try
  value: 1
lesson:
  text: A method value like t.Val saves its receiver when you take it. With a value receiver that is a copy, frozen right there. With a pointer receiver it stays linked to t.
  example: |-
    val := t.Val   // copies t now
    inc := t.Inc   // keeps a pointer to t
brief: Read this Go program and predict exactly what it prints.
goal: "Predict the output, then run: submit <the printed text>"
hints:
  - val captured a copy of t when n was 1.
  - inc works on the real t, so n is 3 by the return.
debrief:
  why: val froze a copy when n was 1, inc changed the real t, and the deferred function ran after return and rewrote the named result.
  solution: submit 3 3 1
  job: If you can read this, you can read any Go code review.
teaches:
  - beyond
answer:
  accept:
    - 3 3 1
go:
  program: |
    package main

    import (
    	"fmt"
    )

    type T struct{ n int }

    func (t T) Val() int   { return t.n }
    func (t *T) Inc()      { t.n++ }

    func run() (out string) {
    	t := T{1}
    	val := t.Val
    	inc := t.Inc
    	defer func() {
    		out = fmt.Sprint(out, " ", t.n, " ", val())
    	}()
    	inc()
    	inc()
    	return fmt.Sprint(t.Val())
    }

    func main() {
    	fmt.Println(run())
    }
