par:
  kind: commands
  value: 1
lesson:
  text: sort -n puts the smallest number first. Use it without -r on a uniq -c count and the least common item comes to the top.
  example: sort | uniq -c | sort -n | head -1
brief: Which path in ~/logs/api-access.log is requested the least?
goal: "Run: submit <path>"
hints:
  - Start from the top-N counter.
  - Drop the -r, so the smallest count comes first.
debrief:
  why: Dropping one flag turns "most popular" into "least popular". The rare ones are often the endpoints you can retire.
  solution: cut -d' ' -f4 ~/logs/api-access.log | sort | uniq -c | sort -n | head -1
  job: Knowing what nobody uses is how you safely remove things.
teaches:
  - beyond
