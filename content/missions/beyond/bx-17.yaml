id: bx-17
track: BX
skill: vi
chapter: Expert
order: 17
title: Swap two values
from: Backend
difficulty: expert
check: vi
par:
  kind: keys
  value: 22
lesson:
  text: Named registers let you hold two pieces at once. "adi" deletes inside the quotes into register a, without touching register b.
  example: |-
    "adi"   delete inside quotes into a
    "aP    paste a before the cursor
brief: Swap the two quoted values in ~/vi/swap.py using named registers.
goal: "Make the change, then save with :wq. You must use vi: vi ~/vi/swap.py"
hints:
  - '"adi" on the first line, then j, then "bdi".'
  - The cursor is now inside the empty quotes. "aP, then k, then "bP.
debrief:
  why: With only the default register, the second delete would overwrite the first. Named ones keep both.
  solution: '"adi"j"bdi""aPk"bP:wq<CR>'
  job: Rearranging several pieces at once is where registers pay off.
teaches:
  - beyond
file: ~/vi/swap.py
expect:
  - file_equals:
      path: ~/vi/swap.py
      content: |
        a = "y"
        b = "x"
  - vi_saved: ~/vi/swap.py
