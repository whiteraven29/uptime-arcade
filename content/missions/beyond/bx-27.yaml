lesson:
  text: D deletes from the cursor to the end of the line. Step back first with h if you want to take the space too.
  example: f#  h  D
brief: Remove the trailing comment from ~/vi/trailing.conf, and the space before it.
goal: "Make the change, then save with :wq. You must use vi: vi ~/vi/trailing.conf"
hints:
  - f# lands on the hash.
  - h steps onto the space, and D removes the rest.
debrief:
  why: D saves you counting characters when everything to the end of the line has to go.
  solution: f#hD:wq<CR>
  job: Cleaning up a line before committing a config is a daily edit.
teaches:
  - beyond
file: ~/vi/trailing.conf
