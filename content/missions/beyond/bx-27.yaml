    level: easy
    label: The main idea
    q: You just finished "Cut the comment". Which sentence best describes what it taught?
    options:
      - v is a copy, and writing through the index is the one that sticks.
      - Dropping one flag turns "most popular" into "least popular". The rare ones are often the endpoints you can retire.
      - D saves you counting characters when everything to the end of the line has to go.
      - Pipelines are built from parts, so swapping the last part changes the question they answer.
    answer: D saves you counting characters when everything to the end of the line has to go.
    hint: Think about what "Cut the comment" asked you to do.
