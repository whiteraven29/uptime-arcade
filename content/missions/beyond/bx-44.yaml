title: Reading a closed channel
from: Backend
difficulty: expert
check: go-out
par:
  kind: first-try
  value: 1
lesson:
  text: "A closed channel still hands over what is in its buffer. After that it never blocks: every read returns the zero value and false."
  example: v, ok := <-ch   // ok is false once closed and empty
brief: Read this Go program and predict exactly what it prints.
goal: "Predict the output, then run: submit <the printed text>"
hints:
  - The buffered 5 comes out first.
  - After that, reads give the zero value right away.
debrief:
  why: A read from a closed channel never blocks, which is exactly why closing one works as a signal to every goroutine at once.
  solution: submit 5 true 0 false
  job: Shutting down a whole group of workers uses this.
teaches:
  - beyond
answer:
  accept:
    - 5 true 0 false
go:
  program: |
    package main

    import (
    	"fmt"
    )

    func main() {
    	ch := make(chan int, 1)
    	ch <- 5
    	close(ch)
    	a, ok1 := <-ch
    	b, ok2 := <-ch
    	fmt.Println(a, ok1, b, ok2)
    }
