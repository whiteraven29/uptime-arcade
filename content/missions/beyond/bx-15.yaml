title: Mismatched masks
from: Network
difficulty: hard
check: answer
par:
  kind: first-try
  value: 1
lesson:
  text: Each host decides on its own, using only its own mask. So two hosts on one wire can disagree about whether they are neighbours.
  example: |-
    A thinks B is local.
    B thinks A is remote.
brief: "On one switch: host A is 10.0.0.5/24 and host B is 10.0.0.200/25. Which host sends its replies through the gateway instead of directly?"
goal: "Run: submit a  or  submit b"
hints:
  - Work out what each host thinks its own subnet is.
  - B is in 10.0.0.128/25. Does that contain 10.0.0.5?
debrief:
  why: B thinks 10.0.0.5 is outside its /25, so it hands replies to the gateway, which gives odd one-way failures.
  solution: submit b
  job: A typo in one mask causes bugs that look impossible.
teaches:
  - beyond
answer:
  accept:
    - b
    - host b
reasoned: true
