id: bx-29
track: BX
skill: go
chapter: Easy
order: 9
title: Skip and stop
from: Backend
difficulty: easy
check: go-out
par:
  kind: first-try
  value: 1
lesson:
  text: continue skips to the next round of a loop. break leaves the loop completely.
  example: |-
    for i := 0; i < 9; i++ {
    	if i == 2 {
    		break
    	}
    }
brief: Read this Go program and predict exactly what it prints.
goal: "Predict the output, then run: submit <the printed text>"
hints:
  - i of 1 prints nothing, but the loop carries on.
  - i of 3 ends the loop.
debrief:
  why: continue skips one round and break ends the loop, and mixing them up gives a loop that stops too soon or never.
  solution: submit 0 2 end
  job: Almost every filter loop uses one of these.
teaches:
  - beyond
answer:
  accept:
    - 0 2 end
go:
  program: |
    package main

    import (
    	"fmt"
    )

    func main() {
    	for i := 0; i < 5; i++ {
    		if i == 1 {
    			continue
    		}
    		if i == 3 {
    			break
    		}
    		fmt.Print(i, " ")
    	}
    	fmt.Println("end")
    }
