id: bx-07
track: BX
skill: vi
chapter: Medium
order: 12
title: Keep the original
from: SRE
difficulty: medium
check: vi
par:
  kind: keys
  value: 24
lesson:
  text: P pastes above and leaves the cursor on the new line. Combined with a macro, every line can get a commented copy.
  example: |-
    qa  yy  P  I# <Esc>  j  j  q
    @a
brief: 'In ~/vi/keep.txt put a commented-out copy above each line, like "# port: 80" above "port: 80". Record the edit once and replay it.'
goal: "Make the change, then save with :wq. You must use vi: vi ~/vi/keep.txt"
hints:
  - yy then P makes the copy above.
  - After editing the copy, j j lands on the next original.
debrief:
  why: Keeping the old value in a comment is a cheap rollback, and a macro does it for a whole file.
  solution: qayyPI# <Esc>jjq@a:wq<CR>
  job: Careful admins leave the old value right there during a risky change.
teaches:
  - beyond
file: ~/vi/keep.txt
expect:
  - file_equals:
      path: ~/vi/keep.txt
      content: |
        # port: 80
        port: 80
        # workers: 2
        workers: 2
  - vi_saved: ~/vi/keep.txt
rewind:
  - type: mc
    level: easy
    label: The main idea
    q: You just finished "Keep the original". Which sentence best describes what it taught?
    options:
      - Filtering before grouping turns "how many errors" into "where are the errors", which is the question that matters.
      - Division by zero is the classic crash in reporting code, so guard it first.
      - x keeps what it removed, so xp is a two-key typo fix.
      - Keeping the old value in a comment is a cheap rollback, and a macro does it for a whole file.
    answer: Keeping the old value in a comment is a cheap rollback, and a macro does it for a whole file.
    hint: "The lesson said: P pastes above and leaves the cursor on the new line."
