lesson:
  text: "To respect precedence, write one function per level: an expression is terms joined by + and -, a term is factors joined by * and /, and a factor is a number or a bracketed expression. The functions call each other. This is called recursive descent, and real compilers start this way."
  example: |-
    def term():
        v = factor()
        while peek() == "*":
            next()
            v = v * factor()
        return v
brief: Evaluate whole-number arithmetic with + - * / and brackets, respecting precedence. There are no spaces, and / is whole-number division. Do not use eval.
goal: Write calc(text). Tests run when you press Run tests.
hints:
  - Keep a position in the text, and write expr, term and factor functions that call each other.
  - factor reads either digits or a bracket that calls expr again.
debrief:
  why: Grammar turns into functions almost line by line. Every language you use is parsed by something shaped like this.
  solution: |-
    def calc(text):
        pos = [0]
        def peek():
            return text[pos[0]] if pos[0] < len(text) else ""
        def factor():
            if peek() == "(":
                pos[0] += 1
                v = expr()
                pos[0] += 1
                return v
            start = pos[0]
            while peek().isdigit():
                pos[0] += 1
            return int(text[start:pos[0]])
        def term():
            v = factor()
            while peek() in ("*", "/"):
                op = peek()
                pos[0] += 1
                v = v * factor() if op == "*" else v // factor()
            return v
        def expr():
            v = term()
            while peek() in ("+", "-"):
                op = peek()
                pos[0] += 1
                v = v + term() if op == "+" else v - term()
            return v
        return expr()
  job: Config languages, query planners and spreadsheets all contain one of these.
teaches:
  - beyond
