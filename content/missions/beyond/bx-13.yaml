lesson:
  text: deps maps each service to what it needs first. Repeatedly pick a service whose needs are all done, taking the alphabetically first when there is a choice. This is called a topological sort.
  example: |-
    done = []
    ready = [s for s in deps if s not in done]
brief: Return a valid deploy order. Everything a service depends on comes before it, and ties go alphabetically.
goal: Write deploy_order(deps). Tests run when you press Run tests.
hints:
  - Loop until every service is placed.
  - Use sorted() so ties go alphabetically, then all(d in done for d in deps[s]).
debrief:
  why: Topological sort is how build tools, package managers and deploy systems decide what goes first.
  solution: |-
    def deploy_order(deps):
        done = []
        while len(done) < len(deps):
            for s in sorted(deps):
                if s not in done and all([d in done for d in deps[s]]):
                    done.append(s)
                    break
        return done
  job: Every orchestrator contains this algorithm.
teaches:
  - beyond
