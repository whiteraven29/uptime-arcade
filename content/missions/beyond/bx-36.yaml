lesson:
  text: One array sums and another counts, per key. Dividing them in END gives an average for each key, which you can then sort.
  example: awk '{s[$1]+=$2;n[$1]++} END{for(k in s)print s[k]/n[k],k}' times.txt | sort -rn
brief: Which path has the highest average response time in ~/logs/api-access.log? Path is field 4 and ms is field 6.
goal: "Run: submit <path>"
hints:
  - s[$4]+=$6 and n[$4]++.
  - Print s[k]/n[k] and k in END, then sort -rn.
debrief:
  why: One slow request says little. An average per endpoint tells you where the real problem is.
  solution: awk '{s[$4]+=$6;n[$4]++} END{for(k in s)print s[k]/n[k],k}' ~/logs/api-access.log | sort -rn | head -1
  job: This is the first thing to run when an API feels slow.
teaches:
  - beyond
answer:
  accept:
    - /v1/search
