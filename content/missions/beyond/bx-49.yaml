id: bx-49
track: BX
skill: go
chapter: Brainfuck
order: 49
title: Embedding is not inheritance
from: CTO
difficulty: brainfuck
check: go-out
par:
  kind: first-try
  value: 1
lesson:
  text: "A struct can embed another, and gets its methods. But an embedded method only ever sees the inner type: it has no idea it is inside something else, so there is no overriding like in other languages."
  example: |-
    type B struct{ A }
    b.Hi()   // runs A.Hi, on the A inside b
brief: Read this Go program and predict exactly what it prints.
goal: "Predict the output, then run: submit <the printed text>"
hints:
  - Hi belongs to A, so its a.Name() means A.Name.
  - b.Name() finds B first.
debrief:
  why: Hi was written on A, so it calls A.Name forever. Go has composition, not virtual methods, and that surprises everyone coming from other languages.
  solution: submit hi A B A
  job: This is the first real shock for anyone arriving at Go from Java or Python.
teaches:
  - beyond
answer:
  accept:
    - hi A B A
go:
  program: |
    package main

    import (
    	"fmt"
    )

    type A struct{}

    func (A) Name() string { return "A" }
    func (a A) Hi() string  { return "hi " + a.Name() }

    type B struct{ A }

    func (B) Name() string { return "B" }

    func main() {
    	b := B{}
    	fmt.Println(b.Hi(), b.Name(), b.A.Name())
    }
