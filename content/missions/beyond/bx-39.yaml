par:
  kind: first-try
  value: 1
lesson:
  text: A function can return another function. The inner one keeps the variables it uses, even after the outer one has finished. That is a closure, and each call to the outer function makes a new one.
  example: |-
    func f() func() int {
    	n := 0
    	return func() int { n++; return n }
    }
brief: Read this Go program and predict exactly what it prints.
goal: "Predict the output, then run: submit <the printed text>"
hints:
  - a and b each have their own n.
  - a is called twice, b once.
debrief:
  why: Each call to counter makes a new n, and the closure keeps it alive, so a and b count separately.
  solution: submit 1 2 1
  job: Middleware and handlers in Go servers rely on closures everywhere.
teaches:
  - beyond
answer:
  accept:
    - 1 2 1
go:
  program: |
    package main

    import (
    	"fmt"
    )

    func counter() func() int {
    	n := 0
    	return func() int {
    		n++
    		return n
    	}
    }

    func main() {
    	a := counter()
    	b := counter()
    	fmt.Println(a(), a(), b())
    }
