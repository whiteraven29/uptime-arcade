title: The window limit
from: SRE
difficulty: expert
check: answer
par:
  kind: first-try
  value: 1
lesson:
  text: TCP can only have one window of data unacknowledged at a time. So the top speed is window size divided by round-trip time, however fast the link is.
  example: |-
    32768 bytes, 100 ms RTT
    32768 * 8 / 0.1 = 2.62 Mbps
brief: A connection has a 65536 byte TCP window and a 100 ms round trip. What is its maximum speed in Mbps?
goal: "Run: submit <megabits per second, to 2 decimals>"
hints:
  - "Bytes to bits: multiply by 8."
  - Divide by 0.1 seconds, then by 1000000.
debrief:
  why: "This is why a fast link across an ocean can still feel slow: latency caps throughput until the window grows."
  solution: submit 5.24
  job: It explains the "gigabit link, slow transfer" ticket.
teaches:
  - beyond
answer:
  accept:
    - "5.24"
verify: str(round(65536*8/0.1/1000000,2))
