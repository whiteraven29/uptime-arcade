title: Swap two letters
from: Support
difficulty: easy
check: vi
par:
  kind: keys
  value: 7
lesson:
  text: x cuts a character, and p pastes it after the cursor. So xp swaps a letter with the next one.
  example: xp
brief: Fix the classic typo in ~/vi/teh.txt so it reads "the server".
goal: "Make the change, then save with :wq. You must use vi: vi ~/vi/teh.txt"
hints:
  - Stand on the e.
  - x then p swaps it with the h.
debrief:
  why: x keeps what it removed, so xp is a two-key typo fix.
  solution: lxp:wq<CR>
  job: You will use xp for the rest of your life.
teaches:
  - beyond
file: ~/vi/teh.txt
expect:
  - file_equals:
      path: ~/vi/teh.txt
      content: |
        the server
  - vi_saved: ~/vi/teh.txt
rewind:
