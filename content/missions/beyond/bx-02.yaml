    level: easy
    label: The main idea
    q: You just finished "Swap two letters". Which sentence best describes what it taught?
    options:
      - Pipelines are built from parts, so swapping the last part changes the question they answer.
      - Compression is really about spotting runs. Forgetting the last run after the loop is the classic bug.
      - Every extra bit doubles the number of subnets and halves their size.
      - x keeps what it removed, so xp is a two-key typo fix.
    answer: x keeps what it removed, so xp is a two-key typo fix.
    hint: "The lesson said: x cuts a character, and p pastes it after the cursor."
