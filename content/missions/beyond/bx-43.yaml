lesson:
  text: "An LRU cache drops whatever was used longest ago when it is full. Keep the keys in a list ordered by use: move a key to the end when it is touched, and drop from the front."
  example: |-
    order.remove(key)
    order.append(key)
    oldest = order.pop(0)
brief: LRU(size) holds that many keys. put(key, value) stores one, and get(key) returns it or None. Using a key with get or put makes it the most recent. When full, drop the least recently used.
goal: Write the LRU class. Tests run when you press Run tests.
hints:
  - Keep a dict for values and a list for order.
  - Touching a key means remove it from the list and append it.
debrief:
  why: A cache is only useful if it keeps what people still want, and "used least recently" is the simple rule that works.
  solution: |-
    class LRU:
        def __init__(self, size):
            self.size = size
            self.data = {}
            self.order = []
        def touch(self, key):
            if key in self.order:
                self.order.remove(key)
            self.order.append(key)
        def get(self, key):
            if key not in self.data:
                return None
            self.touch(key)
            return self.data[key]
        def put(self, key, value):
            self.data[key] = value
            self.touch(key)
            if len(self.order) > self.size:
                oldest = self.order.pop(0)
                del self.data[oldest]
  job: Redis, browsers and CPUs all use this idea.
teaches:
  - beyond
