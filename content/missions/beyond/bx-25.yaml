title: The black hole
from: CTO
difficulty: brainfuck
check: answer
par:
  kind: first-try
  value: 1
lesson:
  text: The largest packet a path can carry is its MTU. Normally a router too small for a packet tells the sender. If those ICMP messages are blocked, big packets just vanish while small ones work. That is called a path MTU black hole.
  example: |-
    small ping: works
    big ping:   100% loss
    web page:   hangs after connecting
brief: Pings work, DNS works and the TCP connection opens, yet pages hang at the TLS handshake. Read ~/net/blackhole.txt. What is at fault?
goal: "Run: submit <what is at fault>: dns, routing, firewall or mtu"
hints:
  - What differs between the ping that works and the one that fails?
  - A TLS handshake is the first big packet of a connection.
debrief:
  why: Small packets pass and big ones vanish, so the path has a smaller MTU than the endpoints think, and the ICMP messages saying so are being dropped.
  solution: cat ~/net/blackhole.txt
  job: VPNs and tunnels cause this often, and few people recognise it. Now you will.
teaches:
  - beyond
answer:
  accept:
    - mtu
reasoned: true
