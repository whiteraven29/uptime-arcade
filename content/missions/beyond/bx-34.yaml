lesson:
  text: delete removes a key, and deleting a missing key does nothing. Reading a key that is not there gives the zero value and does not add it.
  example: |-
    delete(m, "x")
    v, ok := m["x"]   // 0 false
brief: Read this Go program and predict exactly what it prints.
goal: "Predict the output, then run: submit <the printed text>"
hints:
  - One key is left.
  - Reading "zz" gives 0 and adds nothing.
debrief:
  why: Reads never change a map, and comma-ok is the only way to tell "missing" from "zero".
  solution: submit 1 false 0
  job: Caches and sets in Go are built from maps like this.
teaches:
  - beyond
answer:
  accept:
    - 1 false 0
go:
  program: |
    package main

    import (
    	"fmt"
    )

    func main() {
    	m := map[string]int{"a": 1, "b": 2}
    	delete(m, "a")
    	_, ok := m["a"]
    	fmt.Println(len(m), ok, m["zz"])
    }
