    def parse_query(text):
        # your code here
        pass
  tests:
    - expr: parse_query("a=1&b=two")
      want: '{"a": 1, "b": "two"}'
    - expr: parse_query("")
      want: "{}"
    - expr: parse_query("x=")
      want: '{"x": ""}'
