lesson:
  text: Split on & and then on =. text.isdigit() says whether a string is all digits, so you know when to convert it.
  example: '"12".isdigit()   # True'
brief: Turn "a=1&b=two" into a dict. Values made only of digits become ints. Empty text gives {}.
goal: Write parse_query(text). Tests run when you press Run tests.
hints:
  - Guard the empty string first.
  - Split each part on = and use isdigit() to decide.
debrief:
  why: Web input always arrives as text, so converting only what is safe to convert is the real job.
  solution: |-
    def parse_query(text):
        if not text:
            return {}
        out = {}
        for part in text.split("&"):
            k, v = part.split("=")
            out[k] = int(v) if v.isdigit() else v
        return out
  job: Every web framework does this for you. Now you know what it is doing.
teaches:
  - beyond
python:
