lesson:
  text: A percentile comes from sorted data. With 1600 lines, the 95th percentile by nearest rank is line 1520, and sed -n 1520p prints exactly that line.
  example: sort -k2 -n times.txt | sed -n 95p
brief: What is the 95th percentile response time in ~/logs/api-access.log? There are 1600 lines, ms is field 6, and nearest rank means line 1520 once sorted.
goal: "Run: submit <ms>"
hints:
  - sort -k6 -n puts them in order.
  - sed -n 1520p picks the line, and cut -d' ' -f6 picks the number.
debrief:
  why: An average hides the slowest users. The 95th percentile shows what one request in twenty really feels like.
  solution: sort -k6 -n ~/logs/api-access.log | sed -n 1520p | cut -d' ' -f6
  job: Service targets are written in percentiles, not averages.
teaches:
  - beyond
