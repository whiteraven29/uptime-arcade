title: Capacity decides everything
from: Backend
difficulty: expert
check: go-out
par:
  kind: first-try
  value: 1
lesson:
  text: a[1:2] can grow into the rest of the array. a[1:2:2] limits its capacity, so its next append must copy. The third number is how you make a slice safe to append to.
  example: s := a[1:2:2]   // cap is 1, append will copy
brief: Read this Go program and predict exactly what it prints.
goal: "Predict the output, then run: submit <the printed text>"
hints:
  - b has room, so its append writes into a[2].
  - c has no room, so it moves to a new array before c[0] = 5.
debrief:
  why: "The three-index slice is the fix for shared-array bugs: it forces append to copy instead of overwriting a neighbour."
  solution: submit [0 0 7 0] 2 9
  job: Libraries that hand out sub-slices use this to protect their data.
teaches:
  - beyond
answer:
  accept:
    - "[0 0 7 0] 2 9"
go:
  program: |
    package main

    import (
    	"fmt"
    )

    func main() {
    	a := make([]int, 3, 10)
    	b := a[1:2]
    	c := a[1:2:2]
    	b = append(b, 7)
    	c = append(c, 8)
    	c[0] = 5
    	fmt.Println(a[:4], len(b), cap(b))
    }
