# Nginx for Uptime Arcade. Replace arcade.example.com, and YOUR.ADMIN.IP in the admin block, before enabling it.
limit_req_zone $binary_remote_addr zone=uptime_arcade_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=uptime_arcade_auth:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=uptime_arcade_perip:10m;

upstream uptime_api {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    listen [::]:80;
    server_name arcade.example.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    # This form, because Ubuntu 24.04's Nginx is too old for "http2 on".
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name arcade.example.com;

    ssl_certificate /etc/letsencrypt/live/arcade.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arcade.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    include /etc/nginx/snippets/uptime-real-ip.conf;
    server_tokens off;
    client_max_body_size 4m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    limit_conn uptime_arcade_perip 40;

    # 'unsafe-eval' is there because Skulpt, the in-browser Python, compiles to JavaScript. tools/e2e.mjs runs under this exact policy.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; media-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    root /srv/uptime-arcade/frontend/dist;
    index index.html;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location /api/v1/auth/ {
        limit_req zone=uptime_arcade_auth burst=20 nodelay;
        include /etc/nginx/snippets/uptime-proxy.conf;
    }
    location /api/ {
        limit_req zone=uptime_arcade_api burst=60 nodelay;
        include /etc/nginx/snippets/uptime-proxy.conf;
    }

    # The private path set by DJANGO_ADMIN_PATH. Only your address gets in (section 17).
    location /manage-CHANGE-ME/ {
        allow YOUR.ADMIN.IP;
        deny all;
        include /etc/nginx/snippets/uptime-proxy.conf;
    }
    location /static/ {
        alias /srv/uptime-arcade/backend/staticfiles/;
        expires 7d;
    }

    # Renewals can arrive here too, when Cloudflare sends all its traffic over HTTPS.
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    # Nothing else from the backend is reachable, and no dotfile is ever served.
    location ~ /\. { deny all; }
    location / { try_files $uri /index.html; }
}
